function startRoots(){ const rs = shuffle(DATA.roots).slice(0, 10); RQ = {qs: rs.map(r => ({r, opts: shuffle([r].concat(shuffle(DATA.roots.filter(x => x !== r && x.m !== r.m)).slice(0,3)))})), i:0, score:0, picked:null}; go('rootquiz', {}, false); }
VIEWS.rootquiz = function(){
  const z = RQ; if(!z) return '';
  if(z.i >= z.qs.length) return `<div class="sess"><div class="summary card"><p class="eyebrow">Roots · results</p><p class="big">${z.score}/${z.qs.length}</p><p>Every root you know unlocks a family of words.</p><div class="row"><button class="btn btn-primary" data-act="roots-again">New round</button><button class="btn btn-ghost" data-act="done">Done</button></div></div></div>`;
  const q = z.qs[z.i]; const answered = z.picked !== null;
  const opts = q.opts.map((o,k) => `<button class="opt ${answered ? (o===q.r?'right':(o===z.picked?'wrong':'')) : ''}" data-rpick="${k}" ${answered?'disabled':''}><span class="k">${k+1}</span><span>${esc(o.m)}</span></button>`).join('');
  const ok = z.picked === q.r;
  const fb = answered ? `<div class="feedback ${ok?'good':'bad'}"><b class="t">${ok?'Right.':'Not quite.'}</b><p><b>${esc(q.r.r)}</b> = ${esc(q.r.m)}. Keyword: <b>${esc(q.r.key)}</b>.</p><p class="small">${q.r.ex.slice(0,8).map(x => W[slug(x)] ? `<button class="linkbtn" data-word="${slug(x)}" style="padding:0">${esc(x)}</button>` : esc(x)).join(', ')}</p><div class="row"><button class="btn btn-primary" data-act="rnext" data-autofocus>${z.i+1<z.qs.length?'Next root':'See results'}</button></div></div>` : '';
  return `<div class="sess"><div class="sess-top"><button class="iconbtn" data-act="end" aria-label="End">${I.close}</button><div class="prog"><span style="width:${Math.round(z.i/z.qs.length*100)}%"></span></div><span class="count">${z.i+1}/${z.qs.length}</span></div>
    <div style="display:grid;gap:8px"><p class="eyebrow">What does this root mean?</p><p class="headword">${esc(q.r.r)}</p><p class="muted small">Hint: think of ${esc(q.r.ex.slice(0,2).join(' and '))}.</p></div><div class="opts">${opts}</div>${fb}</div>`;
};

/* ---------- hink pinks ---------- */
const HP = (function(){ const L = DATA.lessons.ttc.find(l => l.hinkpinks); const base = L ? L.hinkpinks.map(h => Object.assign({src:'Lecture 33'}, h)) : [];
  const extra = [{q:"an ersatz serpent", s:"hink pink", a:"fake snake"},{q:"a jocular rabbit", s:"hinky pinky", a:"funny bunny"},{q:"a nocturnal scare", s:"hink pink", a:"night fright"},{q:"a Brobdingnagian swine", s:"hink pink", a:"big pig"},{q:"a Lilliputian sphere", s:"hink pink", a:"small ball"},{q:"a laconic leader", s:"hink pink", a:"brief chief"}];
  return base.concat(extra.map(h => Object.assign({src:'Extra'}, h))); })();
let HPS = null;
function startHP(){ HPS = {list: shuffle(HP.map((h,i) => i)), i:0, val:'', state:null, hint:false, score:0}; go('hinkpink', {}, false); }
VIEWS.hinkpink = function(){
  const z = HPS; if(!z) return '';
  if(z.i >= z.list.length) return `<div class="sess"><div class="summary card"><p class="eyebrow">Hink Pinks · finished</p><p class="big">${z.score}/${z.list.length}</p><p>Now invent your own: pick a course word, think of a plain synonym, find a rhyming noun. "What do you call an indolent flower?"</p><div class="row"><button class="btn btn-primary" data-act="hp-again">Play again</button><button class="btn btn-ghost" data-act="done">Done</button></div></div></div>`;
  const h = HP[z.list[z.i]];
  const fb = z.state ? `<div class="feedback ${z.state==='ok'?'good':'bad'}"><b class="t">${z.state==='ok' ? 'You got it!' : 'The answer:'}</b><p class="headword sm">${esc(h.a)}</p><div class="row"><button class="btn btn-primary" data-act="hp-next" data-autofocus>${z.i+1<z.list.length?'Next riddle':'Finish'}</button></div></div>` : '';
  return `<div class="sess"><div class="sess-top"><button class="iconbtn" data-act="end" aria-label="End">${I.close}</button><div class="prog"><span style="width:${Math.round(z.i/z.list.length*100)}%"></span></div><span class="count">${z.i+1}/${z.list.length}</span></div>
    <div class="card" style="display:grid;gap:12px"><p class="eyebrow">Hink Pinks · rhyming riddle</p><p class="q" style="font-family:var(--f-head);font-weight:400;font-size:1.6rem">What do you call ${esc(h.q)}?</p>
      <p><span class="chip">${esc(h.s)}</span> <span class="muted small">${h.s==='hink pink'?'two one-syllable words':h.s==='hinky pinky'?'two words of two syllables':'two words of three syllables'} that rhyme</span></p>
      ${z.hint ? `<p class="muted">Starts with: <b>${esc(h.a.split(' ').map(x => x[0]).join(' … '))}</b></p>`:''}
      <form class="inputrow" data-form="hp"><label class="sr" for="hpin">Your answer</label><input id="hpin" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(z.val)}" ${z.state?'disabled':'data-autofocus'} placeholder="two rhyming words"><button class="btn btn-primary" type="submit" ${z.state?'disabled':''}>Check</button></form>
      ${!z.state ? `<div class="row"><button class="linkbtn" data-act="hp-hint">Hint</button><button class="linkbtn" data-act="hp-show">Show answer</button></div>`:''}
    </div>${fb}</div>`;
};

/* ---------- clue review (heads-up) ---------- */
let HU = null, timerId = null;
function stopTimer(){ if(timerId && !(view.name === 'headsup' && HU && HU.phase === 'play')){ clearInterval(timerId); timerId = null; } }
VIEWS.headsup = function(){
  const z = HU;
  if(z.phase === 'setup') return `<div class="sess"><div class="sess-top"><button class="iconbtn" data-act="end" aria-label="Close">${I.close}</button><p class="eyebrow" style="margin:0">Clue Review · for two</p></div>
    <div class="card" style="display:grid;gap:12px"><h2>How to play</h2>
      <ol style="margin:0;padding-left:1.2em;display:grid;gap:6px"><li>The guesser holds the phone to their forehead, screen facing the clue-giver.</li><li>The clue-giver explains the word's meaning or gives an example. No "sounds like" clues and no saying the word.</li><li>Tap <b>Got it</b> when they guess, or <b>Pass</b> to skip. Beat the clock, then swap roles.</li></ol>
      <div class="setting"><label class="lbl" for="hudeck">Deck</label><select id="hudeck" data-hu="deck" style="border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:10px">${[['started',"Words I've started"],['ttc',COURSES.ttc.name],['bri',COURSES.bri.name],['va',COURSES.va.name],['all','All words']].map(([k,l]) => `<option value="${k}" ${z.deck===k?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
      <div class="setting"><span class="lbl">Time</span><div class="chips">${[60,90,120].map(t => `<button class="chip" data-hutime="${t}" aria-pressed="${z.time===t}">${t} seconds</button>`).join('')}</div></div>
      <button class="btn btn-primary btn-block" data-act="hu-go">Start</button></div></div>`;
  if(z.phase === 'play'){
    const w = W[z.deck_ids[z.i % z.deck_ids.length]];
    return `<div class="sess"><div class="sess-top"><button class="iconbtn" data-act="hu-stop" aria-label="Stop round">${I.close}</button><div class="timer" id="hutimer" style="flex:1">${z.left}</div><span class="count">${z.got.length} ✓</span></div>
      <div class="card" style="display:grid;gap:10px;align-content:center;min-height:16rem"><p class="hu-word">${esc(w.w)}</p><p class="hu-clue small">Clue-giver: ${esc(trunc(w.d, 120))}</p></div>
      <div class="answers hu-ans"><button class="btn btn-again" data-act="hu-pass">Pass</button><button class="btn btn-got" data-act="hu-got">Got it</button></div></div>`;
  }
  return `<div class="sess"><div class="summary card"><p class="eyebrow">Clue Review · time's up</p><p class="big">${z.got.length}</p><p>${z.got.length === 1 ? 'word guessed' : 'words guessed'}${z.passed.length ? `, ${z.passed.length} passed` : ''}.</p>
    ${z.got.length ? `<div><div class="lbl">Guessed</div><p>${z.got.map(id => `<button class="linkbtn" data-word="${id}" style="padding:0 4px 0 0">${esc(W[id].w)}</button>`).join(' · ')}</p></div>`:''}
    ${z.passed.length ? `<div><div class="lbl">Passed</div><p>${z.passed.map(id => `<button class="linkbtn" data-word="${id}" style="padding:0 4px 0 0">${esc(W[id].w)}</button>`).join(' · ')}</p></div>`:''}
    <div class="row"><button class="btn btn-primary" data-act="hu-go">Next player</button><button class="btn btn-ghost" data-act="done">Done</button></div></div></div>`;
};
function huStart(){
  const z = HU; let ids = scopeIds(z.deck); if(ids.length < 10) ids = ORDER.both.slice(0, 80);
  z.deck_ids = shuffle(ids); z.i = 0; z.got = []; z.passed = []; z.left = z.time; z.phase = 'play';
  view = {name:'headsup'}; render();
  clearInterval(timerId);
  timerId = setInterval(() => { z.left--; const el = document.getElementById('hutimer'); if(el) el.textContent = z.left; if(z.left <= 0){ clearInterval(timerId); timerId = null; z.phase = 'done'; render(); } }, 1000);
}

/* ---------- settings sheet ---------- */
let confirmReset = false;
function openSettings(){
  const layer = document.getElementById('layer');
  layer.innerHTML = `<div class="sheet-bg" data-act="close-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-h" data-stop="1">
    <div class="row" style="justify-content:space-between"><h2 id="settings-h">Settings</h2><button class="iconbtn" data-act="close-sheet" aria-label="Close settings">${I.close}</button></div>
    <div class="setting"><span class="lbl">New words per day</span><div class="chips">${[5,10,15,20].map(n => `<button class="chip" data-goal="${n}" aria-pressed="${S.set.goal===n}">${n}</button>`).join('')}</div></div>
    ${canSpeak ? `<div class="setting"><span class="lbl">Speaking speed</span><div class="chips">${[[0.7,'Slow'],[0.9,'Normal'],[1.05,'Quick']].map(([r,l]) => `<button class="chip" data-rate="${r}" aria-pressed="${S.set.rate===r}">${l}</button>`).join('')}<button class="chip" data-say="perspicacious">${I.speak} Test</button></div></div>` : ''}
    <div class="setting"><span class="lbl">How the lamp works</span><p class="small">Each word has four levels, from Lecture 1's word-knowledge scale: <b>Heard it</b> → <b>Recognize it</b> → <b>Know it</b> → <b>Own it</b>. Each time you remember a word on its review day it brightens a step and comes back later: after 1, 3, 8, then 21 days. Forget it and it drops back to the start.</p></div>
    <div class="setting"><span class="lbl">Where your progress lives</span><p class="small sync ${syncMode==='account'?'on':''}"><i></i><span>${syncText()}</span></p></div>
    <div class="setting"><span class="lbl">Start over</span>${confirmReset ? `<div class="confirm"><p><b>Erase all progress?</b> Every word goes back to "Not started" and your streak resets. This can't be undone.</p><div class="row"><button class="btn btn-again" data-act="reset-yes">Erase my progress</button><button class="btn btn-ghost" data-act="reset-no">Keep it</button></div></div>` : `<button class="btn btn-ghost" data-act="reset" style="justify-self:start">Reset progress…</button>`}</div>
    <p class="small muted">Content summarized from your three courses: <i>Building a Better Vocabulary</i> (The Great Courses, Kevin Flanigan), <i>Vocabulary Words Brilliance</i> (Lewis Angel) and <i>Verbal Advantage</i> (Charles Harrington Elster). Definitions, examples, memory stories and quiz questions are written for this app; pronunciations follow the courses and standard dictionaries.</p>
  </div></div>`;
}
function closeSettings(){ confirmReset = false; document.getElementById('layer').innerHTML = ''; }

/* ---------- toast ---------- */
let toastT = null;
function toast(msg){ const l = document.getElementById('layer'); let t = document.getElementById('toast'); if(!t){ t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('button, [data-act]'); if(!el) return;
  if(el.dataset.say !== undefined && el.dataset.say !== ''){ e.preventDefault(); say(el.dataset.say); return; }
  if(el.dataset.tab){ stack.length = 0; view = {name: el.dataset.tab}; render(true); return; }
  if(el.dataset.course){ tabCourse = el.dataset.course; render(); return; }
  if(el.dataset.wmode){ wordsMode = el.dataset.wmode; wordQuery = ''; render(); return; }
  if(el.dataset.wfilter){ wordFilter = el.dataset.wfilter; render(); return; }
  if(el.dataset.word){ closeSettings(); go('word', {id: el.dataset.word}); return; }
  if(el.dataset.pick){ quizPick(el.dataset.pick); return; }
  if(el.dataset.upick !== undefined){ const z = UQ; if(z && z.picked === null){ z.picked = +el.dataset.upick; if(z.picked === z.qs[z.i].q.a) z.score++; touchDay(false); persist(); render(); } return; }
  if(el.dataset.rpick !== undefined){ const z = RQ; if(z.picked === null){ const o = z.qs[z.i].opts[+el.dataset.rpick]; z.picked = o; if(o === z.qs[z.i].r) z.score++; touchDay(false); persist(); render(); } return; }
  if(el.dataset.goal){ S.set.goal = +el.dataset.goal; S.setT = Date.now(); persist(); openSettings(); return; }
  if(el.dataset.rate){ S.set.rate = +el.dataset.rate; S.setT = Date.now(); persist(); openSettings(); return; }
  if(el.dataset.hutime){ HU.time = +el.dataset.hutime; render(); return; }
  if(el.dataset.go){ const p = {}; if(el.dataset.c) p.c = el.dataset.c; if(el.dataset.n !== undefined) p.n = +el.dataset.n; if(el.dataset.replace){ view = Object.assign({name: el.dataset.go}, p); render(true); } else go(el.dataset.go, p); return; }
  const a = el.dataset.act; if(!a) return;
  if(a === 'close-sheet'){ if(e.target.closest('[data-stop]') && !el.matches('.iconbtn')) return; closeSettings(); return; }
  switch(a){
    case 'back': back(); break;
    case 'settings': openSettings(); break;
    case 'review': startCards(dueIds().slice(0, 30), 'review', 'Review'); break;
    case 'learn': { const left = Math.max(5, S.set.goal - newToday()); startCards(newQueue().slice(0, Math.min(left, S.set.goal)), 'learn', 'New words'); break; }
    case 'learn-lesson': { const L = findLesson(el.dataset.c, +el.dataset.n); const ids = L.items.map(i => i.id); const un = ids.filter(id => !lvl(id)); if(un.length) startCards(un.slice(0, 12), 'learn', lessonName(el.dataset.c, L)); else startCards(shuffle(ids), 'practice', 'Practice'); break; }
    case 'quiz-lesson': { const L = findLesson(el.dataset.c, +el.dataset.n); startQuiz(L.items.map(i => i.id), lessonName(el.dataset.c, L)); break; }
    case 'study-one': { const id = el.dataset.id; startCards([id], lvl(id) ? 'practice' : 'learn', W[id].w); break; }
    case 'star': { const id = el.dataset.id; if(S.star[id]) delete S.star[id]; else S.star[id] = 1; persist(); render(); break; }
    case 'known': grade(el.dataset.id, true, {known:true}); toast('Marked as Own it.'); render(); break;
    case 'reveal': SESS.shown = true; render(); break;
    case 'got': cardAnswer(true); break;
    case 'again': cardAnswer(false); break;
    case 'end': case 'done': clearInterval(timerId); timerId = null; back(); while(SESSION_VIEWS[view.name]) back(); break;
    case 'quiz-these': { const ids = SESS.ids; view = stack.pop() || {name:'today'}; startQuiz(ids, 'Quick quiz'); break; }
    case 'quiz': startQuiz(scopeIds(), 'Quiz'); break;
    case 'quiz-again': { const t = QZ.title; const ids = QZ.qs.map(q => q.id); view = stack.pop() || {name:'today'}; startQuiz(t === 'Quiz' ? scopeIds() : ids.concat(QZ.qs.flatMap(q => q.opts)), t); break; }
    case 'qnext': QZ.i++; QZ.picked = null; render(); break;
    case 'spell': startSpell(scopeIds()); break;
    case 'spell-again': view = stack.pop() || {name:'today'}; startSpell(scopeIds()); break;
    case 'spell-hint': SP.hint = Math.min(SP.hint + 2, W[SP.list[SP.i]].w.length - 1); render(); break;
    case 'spell-skip': SP.state = 'bad'; touchDay(false); persist(); render(); break;
    case 'spell-next': SP.i++; SP.state = null; SP.value = ''; SP.hint = 0; render(); if(SP.i < SP.list.length && canSpeak) say(W[SP.list[SP.i]].w); break;
    case 'rootquiz': startRoots(); break;
    case 'usage': startUsage(USAGE_Q, 'Usage & pronunciation'); break;
    case 'usage-note': { const id = el.dataset.id; startUsage(USAGE_Q.filter(x => x.nid === id), NOTE[id].title); break; }
    case 'usage-again': { const t = UQ.title; view = stack.pop() || {name:'today'}; startUsage(t === 'Usage & pronunciation' ? USAGE_Q : USAGE_Q.filter(x => NOTE[x.nid].title === t), t); break; }
    case 'unext': UQ.i++; UQ.picked = null; render(); break;
    case 'roots-again': view = stack.pop() || {name:'today'}; startRoots(); break;
    case 'rnext': RQ.i++; RQ.picked = null; render(); break;
    case 'hinkpink': startHP(); break;
    case 'hp-again': view = stack.pop() || {name:'today'}; startHP(); break;
    case 'hp-hint': HPS.hint = true; render(); break;
    case 'hp-show': HPS.state = 'bad'; render(); break;
    case 'hp-next': HPS.i++; HPS.state = null; HPS.val = ''; HPS.hint = false; render(); break;
    case 'headsup-setup': HU = {phase:'setup', deck: startedIds().length >= 10 ? 'started' : 'ttc', time:60}; go('headsup', {}, false); break;
    case 'hu-go': huStart(); break;
    case 'hu-got': HU.got.push(HU.deck_ids[HU.i % HU.deck_ids.length]); HU.i++; render(); break;
    case 'hu-pass': HU.passed.push(HU.deck_ids[HU.i % HU.deck_ids.length]); HU.i++; render(); break;
    case 'hu-stop': clearInterval(timerId); timerId = null; HU.phase = 'done'; render(); break;
    case 'newpair': pairSeed++; render(); break;
    case 'reset': confirmReset = true; openSettings(); break;
    case 'reset-no': confirmReset = false; openSettings(); break;
    case 'reset-yes': { const keep = S.set; S = defaults(); S.set = keep; S.setT = Date.now(); persist(); confirmReset = false; closeSettings(); stack.length = 0; view = {name:'today'}; render(true); toast('Progress erased.'); break; }
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.set === 'course'){ S.set.course = el.value; S.setT = Date.now(); persist(); render(); }
  if(el.dataset.set === 'scope'){ scopeChoice = el.value; }
  if(el.dataset.hu === 'deck'){ HU.deck = el.value; }
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.input === 'wq'){ wordQuery = el.value; const l = document.getElementById('wordlist'); if(l) l.innerHTML = wordListHTML(); }
  if(el.dataset.input === 'uq'){ wordQuery = el.value; const l = document.getElementById('notelist'); if(l) l.innerHTML = noteListHTML(); }
  if(el.dataset.input === 'rq'){ wordQuery = el.value; const l = document.getElementById('rootlist'); if(l) l.innerHTML = rootListHTML(); }
  if(el.id === 'spellin' && SP) SP.value = el.value;
  if(el.id === 'hpin' && HPS) HPS.val = el.value;
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if(f === 'spell'){ const w = W[SP.list[SP.i]]; const ok = norm(SP.value) === norm(w.w); SP.state = ok ? 'ok' : 'bad'; if(ok) SP.score++; const en = S.w[w.id]; if(en && en.b && !ok) grade(w.id, false); else { touchDay(false); persist(); } render(); }
  if(f === 'hp'){ const h = HP[HPS.list[HPS.i]]; const ok = norm(HPS.val) === norm(h.a); if(ok){ HPS.state = 'ok'; HPS.score++; S.hp[HPS.list[HPS.i]] = 1; persist(); render(); } else { toast('Not that one — try again, or tap Hint.'); } }
});
document.addEventListener('keydown', e => {
  if(e.target.matches('input, select, textarea')) return;
  if(document.getElementById('layer').innerHTML && e.key === 'Escape'){ closeSettings(); return; }
  if(view.name === 'cards' && SESS && SESS.queue.length){
    if(!SESS.shown && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); SESS.shown = true; render(); }
    else if(SESS.shown && e.key === '1'){ cardAnswer(false); } else if(SESS.shown && e.key === '2'){ cardAnswer(true); }
  } else if(view.name === 'quiz' && QZ && QZ.i < QZ.qs.length && QZ.picked === null && /^[1-4]$/.test(e.key)){ quizPick(QZ.qs[QZ.i].opts[+e.key - 1]); }
  else if(view.name === 'usage' && UQ && UQ.i < UQ.qs.length && UQ.picked === null && /^[1-4]$/.test(e.key)){ const b = app.querySelectorAll('[data-upick]')[+e.key-1]; if(b) b.click(); }
  else if(view.name === 'rootquiz' && RQ && RQ.i < RQ.qs.length && RQ.picked === null && /^[1-4]$/.test(e.key)){ const b = app.querySelector(`[data-rpick="${+e.key-1}"]`); if(b) b.click(); }
});

/* ---------- boot ---------- */
const startHash = (location.hash || '').replace('#','');
if(['today','lessons','practice','words'].includes(startHash)) view = {name:startHash};
render();
initSync();
})();
</script>
