marks back and forth. Related: repartee, raillery; riposte = a quick, sharp comeback (from fencing).","src":[{"c":"ttc","n":16},{"c":"va","n":46}],"pr":"bad-n-AHZH","tip":"Banter is light mockery; badinage is more delicate teasing; persiflage is flippant talk; raillery is keener, often sarcastic.","d2":"playful, teasing banter","ety2":"French badiner, to joke.","syn":["banter","repartee","raillery","persiflage"]},{"id":"panegyric","w":"panegyric","pos":"noun","d":"a formal public speech or text of elaborate praise","ex":"The general's panegyric for his fallen soldiers moved everyone.","ety":"Greek pan (all) + agora (assembly): praise delivered to everyone gathered in the marketplace. Synonyms: encomium, tribute, homage.","src":[{"c":"ttc","n":16}]},{"id":"paean","w":"paean","pos":"noun","d":"an enthusiastic song or piece of writing praising something","ex":"The film is a paean to working families.","ety":"Originally a Greek hymn of thanks to Apollo. Pronounced PEE-un.","src":[{"c":"ttc","n":16}]},{"id":"claptrap","w":"claptrap","pos":"noun","d":"pretentious, insincere nonsense","ex":"His fiery speech was mostly partisan claptrap.","ety":"Literally a trick to trap an audience into clapping. Cousins: balderdash, poppycock, twaddle, codswallop, malarkey, hogwash, hooey.","src":[{"c":"ttc","n":16}]},{"id":"bunk","w":"bunk","pos":"noun","d":"nonsense; empty, untrue talk","ex":"That miracle diet is pure bunk.","ety":"Toponym: in 1820 Congressman Felix Walker gave an endless, empty speech 'for Buncombe', his county. Debunk = expose the nonsense.","src":[{"c":"ttc","n":16}]},{"id":"palaver","w":"palaver","pos":"noun","d":"idle chatter; also prolonged, tedious fuss or flattery","ex":"The negotiator cut through the palaver to the real issues.","ety":"From Portuguese palavra (word).","src":[{"c":"ttc","n":16}]},{"id":"pablum","w":"pablum","pos":"noun","d":"bland, simplistic or insipid ideas, speech or writing","ex":"The report was intellectual pablum.","ety":"Pablum was a mushy 1930s cereal for babies — soft, bland, easy to swallow. Synonym: pap.","src":[{"c":"ttc","n":16}]},{"id":"interlocutor","w":"interlocutor","pos":"noun","d":"a person in a conversation; often an informal go-between in negotiations","ex":"A retired diplomat served as interlocutor between the two sides.","ety":"Latin inter (between) + loc (speak).","src":[{"c":"ttc","n":16}]},{"id":"riposte","w":"riposte","pos":"noun","d":"a quick, clever reply to an insult or criticism","ex":"Her witty riposte silenced the heckler.","ety":"Fencing term for a quick counter-thrust after parrying.","src":[{"c":"ttc","n":16}]},{"id":"draconian","w":"draconian","pos":"adjective","d":"excessively harsh and severe (of laws or punishments)","ex":"The regime imposed draconian penalties on protesters.","ety":"Draco, Athens' first lawgiver (c. 621 BCE), made almost every crime — even stealing a cabbage — punishable by death. Solon, his wiser successor, gave us 'solon' (a wise lawmaker).","src":[{"c":"ttc","n":17}]},{"id":"quixotic","w":"quixotic","pos":"adjective","d":"idealistic, romantic and wildly impractical","ex":"Their quixotic plan to beat the big-box stores was doomed.","ety":"From Don Quixote, Cervantes' knight who tilted at windmills he mistook for giants.","src":[{"c":"ttc","n":17},{"c":"va","n":38}],"pr":"kwik-SAHT-ik","d2":"idealistic in an impractical, romantic way","ety2":"From Don Quixote, Cervantes' hero who tilted at windmills.","syn":["visionary","chimerical","unrealistic","romantic"],"ant":["pragmatic","practical","realistic"]},{"id":"gerrymander","w":"gerrymander","pos":"verb / noun","d":"to redraw voting districts to give one party an unfair advantage","ex":"Critics accused the legislature of gerrymandering the map.","ety":"Governor Elbridge Gerry's 1812 redistricting created a district shaped like a salamander: Gerry + salamander.","src":[{"c":"ttc","n":17}]},{"id":"quisling","w":"quisling","pos":"noun","d":"a traitor who collaborates with an occupying enemy","ex":"The resistance despised the quislings who served the occupiers.","ety":"Vidkun Quisling, the Norwegian who helped Nazi Germany occupy Norway in 1940 and was executed for treason in 1945.","src":[{"c":"ttc","n":17}]},{"id":"bedlam","w":"bedlam","pos":"noun","d":"a scene of uproar and wild confusion","ex":"When the power failed, the stadium descended into bedlam.","ety":"From the Hospital of St Mary of Bethlehem in London — 'Bedlam' — an asylum the public once visited for entertainment.","src":[{"c":"ttc","n":17}]},{"id":"luddite","w":"Luddite","pos":"noun","d":"a person who opposes new technology","ex":"I'm a Luddite when it comes to smart fridges.","ety":"The Luddites (1811–16) were English workers who smashed new machinery, supposedly named after Ned Ludd. Hook: a Luddite is a fuddy-duddy about tech.","src":[{"c":"ttc","n":17}]},{"id":"billingsgate","w":"billingsgate","pos":"noun","d":"coarse, foul, abusive language","ex":"The argument degenerated into billingsgate.","ety":"A toponym: London's Billingsgate fish market, famous for its inventively profane fishmongers.","src":[{"c":"ttc","n":17}]},{"id":"malapropism","w":"malapropism","pos":"noun","d":"the mistaken use of a word in place of a similar-sounding one, often comically","ex":"'He's a man of great statue' is a malapropism.","ety":"Mrs. Malaprop in Sheridan's play The Rivals (1775), from French mal à propos (inappropriate).","src":[{"c":"ttc","n":17}]},{"id":"eponym","w":"eponym","pos":"noun","d":"a word derived from a person's name","ex":"'Sandwich' is an eponym of the Earl of Sandwich.","ety":"Greek epi (upon) + onym (name). A toponym is a word derived from a place name.","src":[{"c":"ttc","n":17}]},{"id":"apropos","w":"apropos","pos":"adjective / preposition","d":"appropriate, fitting; with reference to","ex":"His remarks were apropos of the occasion.","ety":"French à propos (to the purpose). Mal apropos = inappropriate.","src":[{"c":"ttc","n":17}]},{"id":"induction","w":"induction","pos":"noun","d":"reasoning from specific instances to a general principle","ex":"By induction, she concluded that all the samples were contaminated.","ety":"Bottom-up reasoning: in (into) + duc (lead).","src":[{"c":"ttc","n":18}]},{"id":"deduction","w":"deduction","pos":"noun","d":"reasoning from general premises to a specific, necessary conclusion","ex":"All humans are mortal; Socrates is human; so Socrates is mortal — that's deduction.","ety":"de (down, from) + duc (lead): leading down from the general to the specific.","src":[{"c":"ttc","n":18}]},{"id":"exegesis","w":"exegesis","pos":"noun","d":"a critical explanation or interpretation of a text, especially scripture","ex":"The professor's exegesis made the dense article finally make sense.","ety":"Greek for 'explanation, interpretation'. Pronounced ek-suh-JEE-sis.","src":[{"c":"ttc","n":18}]},{"id":"perspicacious","w":"perspicacious","pos":"adjective","d":"having keen insight and understanding; shrewd","ex":"A perspicacious critic spotted the flaw everyone else missed.","ety":"per (through) + spic (look): able to see through the surface — intellectual X-ray vision. Synonyms: astute, discerning, sagacious, sapient.","src":[{"c":"ttc","n":18}]},{"id":"didactic","w":"didactic","pos":"adjective","d":"intended to teach, especially in a preachy or excessively moralizing way","ex":"The film had a message but wasn't overly didactic.","ety":"Greek didaskein (to teach). Related verb: sermonize.","src":[{"c":"ttc","n":18},{"c":"va","n":31}],"pr":"dy-DAK-tik","rel":["pedagogue — a teacher, often a pedantic one","pedagogy — the art or profession of teaching"],"d2":"intended to teach, often morally; sometimes preachy","ety2":"Greek didaktikos, skilled at teaching.","syn":["instructive","edifying","pedagogic","preachy"]},{"id":"pedantic","w":"pedantic","pos":"adjective","d":"overly concerned with minor details, rules or displaying learning","ex":"Our pedantic guide corrected everyone's pronunciation.","ety":"From Greek ped (child) via pedagogue (teacher).","src":[{"c":"ttc","n":18},{"c":"bri","n":10},{"c":"va","n":34}],"pic":"mouse pad + attic","hook":"A mouse pad stuffs itself with tiny details until it's too big for the attic.","syn":["nitpicking","fussy","overscrupulous"],"ant":["easygoing","flexible"],"d2":"overly concerned with minor details, rules or showing off learning","pr":"puh-DAN-tik","rel":["pedant — one who parades learning","pedantry — 'much reading and little understanding' (Steele)","pedagogue — a teacher, often a narrow-minded one"],"ety2":"Italian pedante, teacher; Greek paidagogos, the slave who led children to school — also pedagogue."},{"id":"philistine","w":"philistine","pos":"noun","d":"a person hostile or indifferent to culture, art and intellectual pursuits","ex":"Only a philistine would call the museum a waste of space.","ety":"The biblical Philistines; in 1687 university students in Jena used the German 'Philister' for anti-education townsfolk, and Matthew Arnold popularized it in English.","src":[{"c":"ttc","n":18},{"c":"bri","n":15}],"pic":"Philly + sting","hook":"A Philly cheesesteak shop so old people call it ancient — and it has no taste for art.","syn":["boor","barbarian"],"ant":["aesthete","connoisseur"],"d2":"a person who is hostile or indifferent to culture and the arts (originally a people of ancient Philistia)"},{"id":"erudite","w":"erudite","pos":"adjective","d":"having or showing deep, extensive scholarly knowledge","ex":"Her erudite lecture covered three centuries of history.","ety":"Latin e (out of) + rudis (rough, untaught — as in rude): brought out of roughness by education. Noun: erudition.","src":[{"c":"ttc","n":18},{"c":"va","n":12}],"pr":"ER-uh-dyt or ER-yoo-dyt","tip":"Both pronunciations are standard. Elster prefers the older ER-uh-dyt; he finds the fashionable ER-yoo-dyt a bit affected.","rel":["erudition — deep learning"],"d2":"deeply learned, especially from books; scholarly","ety2":"Latin erudire, to instruct — literally to polish away roughness."},{"id":"recondite","w":"recondite","pos":"adjective","d":"little known and difficult to understand; profound","ex":"The paper was too recondite to make an impact.","ety":"Synonym: abstruse. Stresses depth and remoteness from everyday interests.","src":[{"c":"ttc","n":18}]},{"id":"esoteric","w":"esoteric","pos":"adjective","d":"understood by only a small group with special knowledge","ex":"Handyman skills remain esoteric to me.","ety":"Greek esoterikos (belonging to an inner circle). Synonym: arcane.","src":[{"c":"ttc","n":18},{"c":"va","n":23}],"pr":"es-uh-TER-ik","d2":"understood by or meant for only a small inner circle; obscure","ety2":"Greek, inner. Originally Aristotle's technical writings and the secret teachings of Pythagoras.","syn":["arcane","abstruse","recondite","cryptic"],"ant":["exoteric (for the general public)","accessible","lucid"]},{"id":"sedulous","w":"sedulous","pos":"adjective","d":"showing dedication and diligence; persevering","ex":"The carpenter's sedulous workmanship showed in every joint.","ety":"Synonyms: diligent, assiduous, persistent, tenacious. Always hire a sedulous person.","src":[{"c":"ttc","n":19},{"c":"bri","n":11}],"pic":"seed + lace","hook":"Tiny seeds climb a steep hill with a shoelace, never giving up.","syn":["diligent","assiduous","industrious"],"ant":["lazy","careless"],"d2":"diligent; showing steady, careful effort"},{"id":"facile","w":"facile","pos":"adjective","d":"done effortlessly and fluently; or (negatively) too easy, shallow and simplistic","ex":"Her facile mind solved the puzzle at once. / His facile answers earned a D.","ety":"Latin fac (do): doing things easily. Related: facility (aptitude), facilitate (make easier).","src":[{"c":"ttc","n":19},{"c":"va","n":25}],"pr":"FAS-ul","tip":"Usually disparaging today. And facilitate an action, not a person: new equipment facilitates assembly, not the workers.","d2":"done too easily, without enough thought; superficially smooth","ety2":"Latin facilis, easy (facere, to do) — also facility and facilitate.","syn":["glib","superficial","simplistic","effortless"],"ant":["laborious","difficult"]},{"id":"alacrity","w":"alacrity","pos":"noun","d":"brisk, cheerful readiness and eagerness","ex":"She accepted the invitation with alacrity.","ety":"Synonyms: eagerness, zeal, vim and vigor, get-up-and-go.","src":[{"c":"ttc","n":19},{"c":"va","n":36}],"pr":"uh-LAK-ri-tee","tip":"Celerity stresses speed in getting work done; alacrity stresses eager promptness in responding to a request or command.","d2":"cheerful readiness; prompt eagerness","syn":["eagerness","readiness","briskness","zeal","celerity"],"ant":["reluctance","apathy","lethargy"]},{"id":"indolent","w":"indolent","pos":"adjective","d":"habitually lazy; avoiding effort","ex":"The indolent writer never got out of bed before noon.","ety":"Say it slowly — it sounds lazy. Synonyms: slothful, lackadaisical, lethargic, listless, languid.","src":[{"c":"ttc","n":19}]},{"id":"torpor","w":"torpor","pos":"noun","d":"a state of physical or mental sluggishness and inactivity","ex":"Free pizza roused the boys from their torpor.","ety":"Latin torpere (to be numb). The torpedo was first a numbing electric fish. Adjective: torpid.","src":[{"c":"ttc","n":19}]},{"id":"torpid","w":"torpid","pos":"adjective","d":"sluggish, lethargic and inactive","ex":"The economy finally broke out of its torpid growth.","ety":"Think of a teenager on a school morning.","src":[{"c":"ttc","n":19}]},{"id":"turbid","w":"turbid","pos":"adjective","d":"cloudy and muddy with stirred-up sediment; also confused and muddled","ex":"Rescuers couldn't see through the turbid floodwater.","ety":"Latin turba (turmoil); keyword turbulent.","src":[{"c":"ttc","n":19},{"c":"va","n":43}],"pr":"TUR-bid","tip":"Don't confuse with turgid (swollen, pompous) or tumid (swollen). Turbid never means swollen.","d2":"muddy and cloudy; figuratively, confused and muddled","ety2":"Latin turba, turmoil — also disturb.","syn":["murky","roiled","muddy","muddled","opaque"],"ant":["clear","limpid","lucid","pellucid"]},{"id":"turgid","w":"turgid","pos":"adjective","d":"swollen; (of language) pompous and overblown","ex":"The love song's turgid lyrics made us cringe.","ety":"Hook: I URGe you not to write turgid prose. Hemingway is the opposite.","src":[{"c":"ttc","n":19}]},{"id":"pertinacious","w":"pertinacious","pos":"adjective","d":"stubbornly or annoyingly persistent","ex":"His pertinacious questioning exhausted the professor.","ety":"Compare tenacious (admirably determined).","src":[{"c":"ttc","n":19}]},{"id":"stupefy","w":"stupefy","pos":"verb","d":"to stun or astonish; to make unable to think clearly","ex":"The news stupefied the entire town.","ety":"-fy (make) + stupor: to make into a stupor.","src":[{"c":"ttc","n":19}]},{"id":"schism","w":"schism","pos":"noun","d":"a split within a group into opposing factions","ex":"The dispute caused a schism in the party.","ety":"Greek schisma (cleft), related to scissors and schizophrenia. Pronounced SIZ-um or SKIZ-um. The Great Schism split the Christian church in 1054.","src":[{"c":"ttc","n":20}]},{"id":"diaspora","w":"diaspora","pos":"noun","d":"the scattering of a people away from their ancestral homeland; also the dispersed community itself","ex":"The Irish diaspora spread across the world.","ety":"Greek dia (across) + speirein (to scatter, sow). Capitalized for the Jewish Diaspora.","src":[{"c":"ttc","n":20}]},{"id":"lacuna","w":"lacuna","pos":"noun","d":"a gap or missing part, especially in a text or in knowledge","ex":"A large lacuna at the start of the manuscript made it confusing.","ety":"Latin lacuna (hole, pit), related to lake and lagoon — picture an empty lagoon. Plural: lacunae.","src":[{"c":"ttc","n":20}]},{"id":"maw","w":"maw","pos":"noun","d":"the jaws, mouth or throat of a hungry animal; figuratively, something that devours","ex":"The tabloids feed the insatiable maw of public curiosity.","ety":"Old English maga (stomach). Common phrase: the gaping maw of …","src":[{"c":"ttc","n":20}]},{"id":"cleave","w":"cleave","pos":"verb","d":"(1) to split or cut apart; (2) to cling or stick closely to","ex":"A cleaver cleaves the meat. / He cleaved to his principles.","ety":"A contronym — two different Germanic words that ended up spelled alike. The 'cling' sense is related to glue.","src":[{"c":"ttc","n":20}]},{"id":"concatenation","w":"concatenation","pos":"noun","d":"a series of linked things or events, like a chain","ex":"A concatenation of small errors caused the meltdown.","ety":"Latin con (together) + catena (chain).","src":[{"c":"ttc","n":20}]},{"id":"cabal","w":"cabal","pos":"noun","d":"a small secret group plotting together; or the plot itself","ex":"A cabal of advisers plotted to seize control.","ety":"From Kabbalah (Jewish mysticism); popularized by Charles II's ministers Clifford, Arlington, Buckingham, Ashley and Lauderdale — whose initials spell C-A-B-A-L.","src":[{"c":"ttc","n":20}]},{"id":"coterie","w":"coterie","pos":"noun","d":"a small, close-knit group sharing an interest or purpose","ex":"She belongs to a coterie of serious skiers.","ety":"Related words: clique (exclusive), faction (dissenting), sect, circle, cadre.","src":[{"c":"ttc","n":20}]},{"id":"contronym","w":"contronym","pos":"noun","d":"a word that has two opposite meanings","ex":"'Sanction' is a contronym: it can mean approve or penalize.","ety":"Also called a Janus word, after the two-faced Roman god of doorways (and January).","src":[{"c":"ttc","n":20}]},{"id":"denude","w":"denude","pos":"verb","d":"to strip bare; to deprive of something important","ex":"Clear-cutting denuded the hillside of trees.","ety":"de (away) + nudare (strip, make nude).","src":[{"c":"ttc","n":21}]},{"id":"abdicate","w":"abdicate","pos":"verb","d":"to formally give up a throne, power or responsibility","ex":"Edward VIII abdicated in 1936 to marry Wallis Simpson.","ety":"ab (away) + dic (speak): to 'speak away' one's office. Originally meant to disown one's children.","src":[{"c":"ttc","n":21}]},{"id":"abnegate","w":"abnegate","pos":"verb","d":"to deny or renounce; also to give up (responsibility, a right)","ex":"He abnegated his former beliefs.","ety":"ab (away) + negare (deny). Abdicate is reserved for high office; abnegate is more general. Noun: abnegation (self-denial).","src":[{"c":"ttc","n":21}]},{"id":"ablution","w":"ablution","pos":"noun","d":"the act of washing oneself, especially as a religious ritual","ex":"He performed his morning ablutions before prayer.","ety":"ab (away) + luere (wash): washing the dirt — or sin — away.","src":[{"c":"ttc","n":21}]},{"id":"antediluvian","w":"antediluvian","pos":"adjective","d":"ridiculously old-fashioned; literally, from before the biblical Flood","ex":"The firm's antediluvian attitude to the internet cost it a generation of customers.","ety":"Latin ante (before) + diluvium (flood, deluge). Coined by Sir Thomas Browne in the 1600s.","src":[{"c":"ttc","n":21}]},{"id":"absquatulate","w":"absquatulate","pos":"verb","d":"to leave abruptly, often making off with something","ex":"The other hiker absquatulated with our gear.","ety":"A playful 1830s Americanism: ab (away) + squat — pop up from a squat and run. From the same fad as bloviate and discombobulate.","src":[{"c":"ttc","n":21}]},{"id":"discombobulate","w":"discombobulate","pos":"verb","d":"to confuse or disconcert","ex":"The sudden change of plans discombobulated everyone.","ety":"A whimsical 1830s American coinage — it sounds confusing.","src":[{"c":"ttc","n":21}]},{"id":"nihilism","w":"nihilism","pos":"noun","d":"the rejection of all religious and moral principles; belief that life is meaningless","ex":"The novel's hero drifts into nihilism.","ety":"Latin nihil (nothing) — as in a 'nil–nil' soccer score.","src":[{"c":"ttc","n":21}]},{"id":"solipsism","w":"solipsism","pos":"noun","d":"extreme self-absorption; (philosophy) the view that only one's own mind is sure to exist","ex":"His solipsism made every conversation about himself.","ety":"Latin solus (alone) + ipse (self). The solipsist's breakup line: 'It's not you, it's me.'","src":[{"c":"ttc","n":21}]},{"id":"agnosticism","w":"agnosticism","pos":"noun","d":"the view that whether God exists cannot be known","ex":"His agnosticism set him apart from both believers and atheists.","ety":"Coined by T. H. Huxley in 1869: Greek a (not) + gnosis (knowledge). Atheism = a (without) + theos (god): belief that there is no god.","src":[{"c":"ttc","n":21}]},{"id":"protean","w":"protean","pos":"adjective","d":"able to change form or do many different things; versatile","ex":"Meryl Streep is a protean actor.","ety":"Proteus, the Greek sea god who could foretell the future and changed shape to avoid being caught.","src":[{"c":"ttc","n":21},{"c":"va","n":50}],"pr":"PROH-tee-un","d2":"changing readily in shape or character; versatile","ety2":"From Proteus, the Greek sea god who could change his shape at will.","syn":["variable","changeable","versatile","mutable","kaleidoscopic"],"ant":["fixed","constant","immutable"]},{"id":"splenetic","w":"splenetic","pos":"adjective","d":"bad-tempered, irritable and spiteful","ex":"His blog is full of splenetic attacks on anyone who disagrees.","ety":"From the spleen, which medieval medicine saw as the seat of bad temper. Hook: a splinter in your spleen would make anyone splenetic. Cousins: irascible, testy, dyspeptic, cantankerous.","src":[{"c":"ttc","n":22}]},{"id":"fractious","w":"fractious","pos":"adjective","d":"unruly, rebellious and hard to manage; also quarrelsome","ex":"The coach struggled with a fractious team. / They had a fractious relationship.","ety":"Latin frangere (to break), keyword fracture: fractious people break rules and the peace. Close to contumacious and refractory.","src":[{"c":"ttc","n":22}]},{"id":"asperity","w":"asperity","pos":"noun","d":"harshness of tone or manner; also harsh, rough conditions","ex":"The children heard the asperity in their father's voice and stopped.","ety":"Latin asper (rough, harsh) — used for sour wine and hard times. Related: exasperate (to treat thoroughly harshly).","src":[{"c":"ttc","n":22}]},{"id":"importune","w":"importune","pos":"verb","d":"to pester someone with persistent, urgent requests","ex":"My son importuned us for a fifth phone.","ety":"Synonyms: badger, beseech, implore, hound, plead.","src":[{"c":"ttc","n":22},{"c":"va","n":36}],"pr":"im-por-TOON","rel":["importunate — annoyingly persistent"],"d2":"to pester with urgent, persistent requests","syn":["badger","beseech","pester","entreat","solicit"]},{"id":"phlegmatic","w":"phlegmatic","pos":"adjective","d":"calm and unemotional by temperament (positive: composed; negative: apathetic)","ex":"The phlegmatic firefighters stayed perfectly calm.","ety":"Phlegm was one of the four bodily 'humors'; too much of it supposedly made you sluggish and apathetic. Picture Mr. Spock with a bad cold.","src":[{"c":"ttc","n":22},{"c":"va","n":44}],"pr":"fleg-MAT-ik","tip":"The four humors: blood (sanguine, cheerful), yellow bile (choleric, irascible), black bile (melancholy), phlegm (phlegmatic, sluggish).","d2":"calm and unemotional; hard to arouse","ety2":"From phlegm, one of the four humors that medieval doctors thought shaped temperament.","syn":["stolid","impassive","imperturbable","apathetic","placid"],"ant":["excitable","passionate","emotional"]},{"id":"stoic","w":"stoic","pos":"adjective / noun","d":"enduring pain or hardship without showing feelings or complaining","ex":"The family was stoic in the face of adversity.","ety":"From Stoicism, the philosophy Zeno taught at the Stoa (painted porch) in Athens around 300 BCE. Unlike phlegmatic, stoicism is self-discipline.","src":[{"c":"ttc","n":22},{"c":"va","n":20}],"pr":"STOH-ik","rel":["stoicism — calm endurance"],"d2":"showing no emotion; enduring pain or hardship without complaint","ety2":"Greek stoa, porch: the Painted Porch in Athens where Zeno taught (around 300 BC) that the wise should be free of passion and accept what they cannot change.","syn":["impassive","imperturbable","phlegmatic","unflappable"],"ant":["emotional","ardent","fervent"]},{"id":"stolid","w":"stolid","pos":"adjective","d":"calm, dull and showing little emotion or interest; impassive","ex":"The stolid clerk processed forms without looking up.","ety":"Suggests heavy, plodding routine and unquestioning dullness.","src":[{"c":"ttc","n":22},{"c":"va","n":40}],"pr":"STAHL-id","tip":"Not the same as stoic: the stoic endures by strength of character; the stolid person just doesn't react.","d2":"showing little emotion; dull and impassive","ety2":"Latin stolidus, dull, stupid.","syn":["impassive","phlegmatic","apathetic","unemotional","bovine"],"ant":["excitable","sensitive","emotional"]},{"id":"inure","w":"inure","pos":"verb","d":"to accustom someone to something unpleasant so they no longer feel it","ex":"Years in the desert inured the hermit to cold and hunger.","ety":"Usually 'inured to'. Related: ascetic (a person who practices severe self-denial).","src":[{"c":"ttc","n":22}]},{"id":"irascible","w":"irascible","pos":"adjective","d":"easily angered; hot-tempered","ex":"The irascible chef threw a pan across the kitchen.","ety":"Latin ira (anger), as in ire.","src":[{"c":"ttc","n":22},{"c":"va","n":35}],"pr":"i-RAS-uh-bul (also eye-RAS-)","tip":"Irate means angry right now; irascible means prone to anger by temperament.","d2":"easily angered; hot-tempered by nature","ety2":"Latin irasci, to be angry; ira, anger — also ire and irate.","syn":["cantankerous","choleric","splenetic","peevish","testy"],"ant":["placid","equable","affable","amiable"]},{"id":"intrepid","w":"intrepid","pos":"adjective","d":"fearless and adventurous, especially in enduring danger over time","ex":"Intrepid explorers mapped the uncharted coast.","ety":"in (not) + trepidus (alarmed, trembling) — not trembling. Related: trepidation. Synonym: undaunted.","src":[{"c":"ttc","n":23}]},{"id":"fortitude","w":"fortitude","pos":"noun","d":"courage and mental strength in enduring pain or adversity over the long haul","ex":"Douglass showed remarkable fortitude in teaching himself to read.","ety":"Latin fortis (strong), as in fort and fortify.","src":[{"c":"ttc","n":23}]},{"id":"moxie","w":"moxie","pos":"noun","d":"spirited courage and determination; nerve; also energy and know-how","ex":"The rookie quarterback kept getting up — that kid's got moxie.","ety":"From Moxie, an 1880s bitter soft drink advertised to 'build up your nerve'. Synonyms: grit, pluck, gumption, guts.","src":[{"c":"ttc","n":23}]},{"id":"temerity","w":"temerity","pos":"noun","d":"reckless boldness; rash disregard of consequences","ex":"He had the temerity to answer his phone during the exam.","ety":"Latin temere (rashly). Don't confuse with timorous (fearful).","src":[{"c":"ttc","n":23},{"c":"va","n":41}],"pr":"tuh-MER-i-tee","tip":"Don't confuse with timidity — they're opposites.","rel":["temerarious — reckless"],"d2":"reckless boldness; rash nerve","ety2":"Latin temere, rashly, blindly.","syn":["audacity","effrontery","gall","nerve","impudence"],"ant":["timidity","diffidence","caution","timorousness"]},{"id":"chutzpah","w":"chutzpah","pos":"noun","d":"shameless audacity; nerve that may shock others (admiring or disapproving)","ex":"She had the chutzpah to tell the CEO he was running the company into the ground.","ety":"Yiddish. Classic definition: a man who kills his parents, then begs the court for mercy because he's an orphan. Related: brazen, brash, cheeky, audacity.","src":[{"c":"ttc","n":23}]},{"id":"bravado","w":"bravado","pos":"noun","d":"a swaggering show of courage meant to impress, often hiding fear","ex":"The young gunslinger's bravado couldn't hide his shaking hands.","ety":"From Italian bravo — someone showing bravado wants a 'bravo!' Common phrase: false bravado.","src":[{"c":"ttc","n":23}]},{"id":"braggadocio","w":"braggadocio","pos":"noun","d":"empty, arrogant boasting; or a boastful person","ex":"His tales of heroism were pure braggadocio.","ety":"Braggadocchio, a boastful fake knight in Spenser's The Faerie Queene (1590).","src":[{"c":"ttc","n":23}]},{"id":"timorous","w":"timorous","pos":"adjective","d":"showing nervousness or a lack of confidence; fearful","ex":"The timorous third-grader trembled after facing the bully.","ety":"Latin timere (to fear), like timid. Related: milquetoast (a timid person, from a 1920s comic strip), milksop.","src":[{"c":"ttc","n":23}]},{"id":"craven","w":"craven","pos":"adjective","d":"contemptibly cowardly","ex":"The captain's craven refusal to fight led to mutiny.","ety":"Hook: the raven made Poe's narrator craven.","src":[{"c":"ttc","n":23}]},{"id":"pusillanimous","w":"pusillanimous","pos":"adjective","d":"lacking courage or determination; faint-hearted","ex":"It was pusillanimous of him to stay silent while his friend was blamed.","ety":"Latin pusillus (very small) + animus (spirit): small-spirited. Opposite: magnanimous (great-spirited, generous).","src":[{"c":"ttc","n":23},{"c":"va","n":42}],"pr":"pyoo-suh-LAN-uh-mus","rel":["pusillanimity — cowardice"],"d2":"cowardly; contemptibly timid","ety2":"Latin pusillus (very small) + animus (spirit): small-souled. Opposite of magnanimous.","syn":["cowardly","craven","fainthearted","timorous","spineless"],"ant":["brave","valiant","intrepid","dauntless"]},{"id":"magnanimous","w":"magnanimous","pos":"adjective","d":"generous and forgiving, especially toward a rival or someone less powerful","ex":"She was magnanimous in victory.","ety":"Latin magn (great) + animus (spirit).","src":[{"c":"ttc","n":23},{"c":"va","n":33}],"pr":"mag-NAN-uh-mus","rel":["magnanimity — generosity of spirit"],"d2":"noble and generous, especially in forgiving injury or insult","ety2":"Latin magnus (great) + animus (spirit): great-spirited.","syn":["noble","high-minded","generous","beneficent","altruistic"],"ant":["petty","vindictive","churlish","pusillanimous"]},{"id":"abstruse","w":"abstruse","pos":"adjective","d":"very difficult to understand; obscure","ex":"Finnegans Wake is famously abstruse.","ety":"Latin abstrusus (concealed). A notch beyond recondite.","src":[{"c":"ttc","n":24},{"c":"va","n":26}],"pr":"ab-STROOS","rel":["arcane — known to only a few (Latin arca, a chest)","recondite — beyond ordinary understanding","cryptic — with a hidden meaning (Greek kryptos, hidden)"],"d2":"very hard to understand","ety2":"Latin, pushed away — out of reach of comprehension.","syn":["recondite","esoteric","arcane","cryptic","occult"],"ant":["lucid","perspicuous","manifest"]},{"id":"epiphany","w":"epiphany","pos":"noun","d":"a sudden, striking realization or insight","ex":"Each story in Dubliners turns on a character's epiphany.","ety":"Greek epiphaneia (manifestation). Joyce popularized the literary sense.","src":[{"c":"ttc","n":24}]},{"id":"surreptitious","w":"surreptitious","pos":"adjective","d":"done secretly because it would not be approved of","ex":"She sneaked a surreptitious glance at her phone.","ety":"Latin surripere (to seize secretly).","src":[{"c":"ttc","n":24},{"c":"va","n":19}],"pr":"sur-up-TISH-us","tip":"Stealthy = slow and quiet; furtive = quick and thief-like (Latin furtum, theft); clandestine = secret for an illicit purpose; covert = deliberately concealed. Elster prefers the traditional KUV-urt for covert.","d2":"done secretly and slyly, to avoid notice","ety2":"Latin surripere, to snatch secretly: done while no one is looking.","syn":["stealthy","furtive","covert","clandestine"],"ant":["open","overt","manifest"]},{"id":"parricide","w":"parricide","pos":"noun","d":"the killing of a parent or close relative; or the person who does it","ex":"Lizzie Borden was tried for parricide and acquitted.","ety":"Hook: par- → parents + cide (kill). Related: matricide, patricide, fratricide (brother), sororicide (sister), regicide (king).","src":[{"c":"ttc","n":25}]},{"id":"caesura","w":"caesura","pos":"noun","d":"a pause or break in a line of verse or music, or in speech","ex":"'Once upon a midnight dreary, ‖ while I pondered' has a caesura.","ety":"Latin caedere (to cut) — a cut in the line. Plural: caesurae.","src":[{"c":"ttc","n":25}]},{"id":"vivisection","w":"vivisection","pos":"noun","d":"surgery on a living animal for research; figuratively, a ruthless, detailed critique","ex":"The press's vivisection of the general forced his resignation.","ety":"Latin vivus (alive) + sect (cut).","src":[{"c":"ttc","n":25}]},{"id":"desuetude","w":"desuetude","pos":"noun","d":"a state of disuse or inactivity","ex":"The old law has fallen into desuetude.","ety":"Latin de (away from) + suescere (become accustomed). Usually 'fall into desuetude'. Pronounced DES-wi-tood.","src":[{"c":"ttc","n":25}]},{"id":"perdition","w":"perdition","pos":"noun","d":"eternal damnation; or utter ruin","ex":"The preacher warned that sinners were on the road to perdition.","ety":"Latin perdere (to destroy, lose).","src":[{"c":"ttc","n":25}]},{"id":"extirpate","w":"extirpate","pos":"verb","d":"to root out and destroy completely","ex":"Black bears were extirpated from the region by 2003.","ety":"Latin ex (out) + stirps (root, stem): to pull out by the roots. Synonyms: eradicate, exterminate, uproot.","src":[{"c":"ttc","n":25},{"c":"va","n":45}],"pr":"EK-stur-payt","tip":"Eradicate implies resistance; deracinate implies violent uprooting; extirpate implies deliberate removal of something deeply entrenched.","rel":["extirpation — complete destruction"],"ety2":"Latin ex- (out) + stirps (root).","syn":["eradicate","deracinate","exterminate","annihilate"]},{"id":"abrogate","w":"abrogate","pos":"verb","d":"to formally repeal or abolish (a law, treaty); or to neglect a duty","ex":"Critics say Congress abrogated its duty to declare war.","ety":"Latin abrogare (to repeal).","src":[{"c":"ttc","n":25},{"c":"va","n":21}],"pr":"AB-ruh-gayt","tip":"Abolish = do away with; rescind = cut off; revoke = call back; repeal = withdraw a law; annul/abrogate = make void (rights, treaties, privileges).","d2":"to abolish or cancel officially","syn":["repeal","revoke","annul","nullify","rescind"]},{"id":"fin-de-siecle","w":"fin de siècle","pos":"noun / adjective","d":"the end of a century, especially the late 1800s and its sophisticated, decadent mood","ex":"Fin-de-siècle Vienna was a hub for artists.","ety":"French 'end of the century'. English equivalent: turn of the century.","src":[{"c":"ttc","n":25}]},{"id":"incisive","w":"incisive","pos":"adjective","d":"clear, sharp and penetrating (of thought or remarks)","ex":"She offered an incisive analysis of the problem.","ety":"From cise (cut): remarks that cut to the heart of the matter.","src":[{"c":"ttc","n":25}]},{"id":"smite","w":"smite","pos":"verb","d":"to strike hard; to defeat or kill (past: smote)","ex":"Cain smote his brother Abel.","ety":"Related to smitten — struck hard by love.","src":[{"c":"ttc","n":25}]},{"id":"hobson-s-choice","w":"Hobson's choice","pos":"noun phrase","d":"a choice between taking what is offered or nothing at all; (loosely) a choice between two bad options","ex":"It was a Hobson's choice: the full sports package or no soccer channel.","ety":"Thomas Hobson, a Cambridge stable keeper (c. 1600), let customers take the horse nearest the door — or none — so his horses were rested equally.","src":[{"c":"ttc","n":26}]},{"id":"stultify","w":"stultify","pos":"verb","d":"to make someone dull, bored or ineffective; to stifle","ex":"The rigid rules stultified creativity in the office.","ety":"Word-part hook: stul → dull. Adjective: stultifying.","src":[{"c":"ttc","n":26}]},{"id":"frisson","w":"frisson","pos":"noun","d":"a sudden thrilling shiver of excitement or fear","ex":"A frisson of fear ran through me as I climbed to the attic.","ety":"French 'shiver', from Latin frigere (to be cold) — like frigid. Pronounced free-SOHN.","src":[{"c":"ttc","n":26}]},{"id":"detritus","w":"detritus","pos":"noun","d":"debris; waste or leftover fragments","ex":"The detritus of the battle littered the streets.","ety":"Latin deterere (to wear away), like detriment: detritus is what's left after things wear away.","src":[{"c":"ttc","n":26}]},{"id":"shibboleth","w":"shibboleth","pos":"noun","d":"a word, phrase or custom that distinguishes members of a group; also an old slogan still clung to","ex":"Saying 'Derry' or 'Londonderry' can act as a shibboleth in Northern Ireland.","ety":"In the Book of Judges, fleeing Ephraimites were caught because they couldn't pronounce the 'sh' in shibboleth.","src":[{"c":"ttc","n":27}]},{"id":"argot","w":"argot","pos":"noun","d":"the specialized vocabulary of a particular group (originally thieves)","ex":"Hikers have their own argot: NOBOs, SOBOs and slackpacking.","ety":"French, 1860; originally the slang of Paris rogues. Pronounced AR-go or AR-gut. Not related to the Argonauts.","src":[{"c":"ttc","n":27}]},{"id":"dialect","w":"dialect","pos":"noun","d":"a regional or social variety of a language, with its own words, pronunciation and grammar","ex":"In Pittsburgh's dialect, soda is 'pop'.","ety":"Greek dialektos (way of speaking).","src":[{"c":"ttc","n":27}]},{"id":"vernacular","w":"vernacular","pos":"noun / adjective","d":"the everyday language spoken by ordinary people, as opposed to formal or literary language","ex":"Luther translated the Bible into the German vernacular.","ety":"Hook: Vern is a regular guy who uses everyday words.","src":[{"c":"ttc","n":27},{"c":"va","n":22}],"pr":"vur-NAK-yuh-lur","tip":"'In the vernacular' means in plain, everyday language. The vernacular includes both good and bad everyday English.","d2":"the everyday language of ordinary people; native, as opposed to foreign or literary"},{"id":"jargon","w":"jargon","pos":"noun","d":"technical or specialized language that is hard for outsiders to understand","ex":"To me, ballet terminology is pure jargon.","ety":"Old French jargoun (twittering of birds).","src":[{"c":"ttc","n":27},{"c":"va","n":5}],"pr":"JAR-gun","tip":"Jargon helps insiders talk precisely but shuts outsiders out — avoid it with clients.","d2":"the specialized vocabulary of a profession or group; pretentious, hard-to-follow language"},{"id":"lingua-franca","w":"lingua franca","pos":"noun","d":"a common language used between speakers of different native languages","ex":"English has become a global lingua franca for business.","ety":"Italian 'Frankish tongue': a mixed trade language of Renaissance Mediterranean ports. Also called a bridge language.","src":[{"c":"ttc","n":27}]},{"id":"discursive","w":"discursive","pos":"adjective","d":"rambling from topic to topic; digressive","ex":"The comedian's discursive stories somehow worked.","ety":"Latin discurrere (to run to and fro). Hook: like a meandering current.","src":[{"c":"ttc","n":27},{"c":"va","n":30}],"pr":"di-SKUR-siv","tip":"Digressive = straying from the point; desultory = leaping aimlessly between topics; discursive = roving widely without a central theme.","d2":"rambling from topic to topic","ety2":"Latin discurrere, to run about.","syn":["rambling","digressive","desultory","meandering"]},{"id":"sobriquet","w":"sobriquet","pos":"noun","d":"a nickname, often humorous or affectionate","ex":"'The Big Easy' is a sobriquet for New Orleans.","ety":"Old French for 'a chuck under the chin'. Pronounced SOH-bri-kay.","src":[{"c":"ttc","n":27}]},{"id":"sesquipedalian","w":"sesquipedalian","pos":"adjective","d":"given to using long words; (of words) very long","ex":"The student hid his confusion behind sesquipedalian words.","ety":"From Horace's 'sesquipedalia verba' — words a foot and a half long: sesqui (one and a half) + ped (foot).","src":[{"c":"ttc","n":27}]},{"id":"somniloquy","w":"somniloquy","pos":"noun","d":"talking in one's sleep","ex":"His somniloquy kept his roommate awake.","ety":"Latin somnus (sleep, as in insomnia) + loq (speak).","src":[{"c":"ttc","n":27}]},{"id":"spoonerism","w":"spoonerism","pos":"noun","d":"an accidental swap of the first sounds of two words, often with funny results","ex":"'A well-boiled icicle' for 'a well-oiled bicycle' is a spoonerism.","ety":"Rev. William Archibald Spooner of Oxford, famous for slips like 'The Lord is a shoving leopard'.","src":[{"c":"ttc","n":28}]},{"id":"homophone","w":"homophone","pos":"noun","d":"a word that sounds the same as another but has a different spelling and meaning","ex":"'Patience' and 'patients' are homophones.","ety":"Greek homo (same) + phon (sound).","src":[{"c":"ttc","n":28}]},{"id":"homograph","w":"homograph","pos":"noun","d":"a word spelled like another but with a different pronunciation and meaning","ex":"'Minute' (60 seconds) and 'minute' (tiny) are homographs.","ety":"Greek homo (same) + graph (write).","src":[{"c":"ttc","n":28}]},{"id":"homonym","w":"homonym","pos":"noun","d":"a word spelled and pronounced like another but with a different meaning","ex":"'Bear' the animal and 'bear' a burden are homonyms.","ety":"Greek homo (same) + onym (name). Also called multiple-meaning words; contronyms (cleave, sanction, dust) are a special kind.","src":[{"c":"ttc","n":28}]},{"id":"toponym","w":"toponym","pos":"noun","d":"a word derived from a place name","ex":"Tuxedo, hamburger and Bordeaux are toponyms.","ety":"Greek topos (place) + onym (name). Tuxedo Park, New York, gave us the tailless dinner jacket.","src":[{"c":"ttc","n":28}]},{"id":"acronym","w":"acronym","pos":"noun","d":"a word formed from the first letters of a phrase","ex":"Scuba stands for 'self-contained underwater breathing apparatus'.","ety":"Greek akros (tip) + onym: a word made from the tips of other words. Letter-by-letter ones (FBI) are sometimes called initialisms.","src":[{"c":"ttc","n":28}]},{"id":"portmanteau-word","w":"portmanteau word","pos":"noun","d":"a word blending the sounds and meanings of two others","ex":"Brunch, motel, smog and chortle are portmanteau words.","ety":"Coined by Lewis Carroll (Humpty Dumpty: 'two meanings packed up into one word'). A portmanteau is a two-compartment suitcase.","src":[{"c":"ttc","n":28}]},{"id":"clipped-word","w":"clipped word","pos":"noun","d":"a word shortened without changing its meaning","ex":"'Gym' is clipped from 'gymnasium'.","ety":"Canter is clipped from 'Canterbury trot', the pace of pilgrims riding to Becket's shrine.","src":[{"c":"ttc","n":28}]},{"id":"boycott","w":"boycott","pos":"verb / noun","d":"to refuse to buy, use or deal with something as a protest","ex":"Customers boycotted the store.","ety":"An eponym: Charles Boycott, an Irish land agent shunned by the whole community in 1880 for refusing to lower rents.","src":[{"c":"ttc","n":28}]},{"id":"grundyism","w":"Grundyism","pos":"noun","d":"prudish insistence on conventional propriety","ex":"The censors' Grundyism banned the play.","ety":"Mrs. Grundy, an unseen prude in Thomas Morton's 1798 play Speed the Plough: 'What would Mrs. Grundy say?'","src":[{"c":"ttc","n":28}]},{"id":"snafu","w":"snafu","pos":"noun","d":"a chaotic situation, especially a recurring muddle","ex":"Another booking snafu left us without a room.","ety":"A WWII military acronym: 'situation normal, all fouled up' (politely).","src":[{"c":"ttc","n":28}]},{"id":"virulent","w":"virulent","pos":"adjective","d":"extremely infectious or harmful (of a disease); bitterly hostile (of words or feelings)","ex":"The Black Death was a virulent plague. / He launched a virulent personal attack.","ety":"Latin virus (poison). Synonyms for the figurative sense: acerbic, caustic, acrimonious, vitriolic.","src":[{"c":"ttc","n":29}]},{"id":"pernicious","w":"pernicious","pos":"adjective","d":"having a harmful effect, especially in a gradual or hidden way","ex":"He warned us about the pernicious effects of smoking.","ety":"Latin pernicies (ruin, destruction).","src":[{"c":"ttc","n":29},{"c":"va","n":31}],"pr":"pur-NISH-us","d2":"harmful in a subtle, gradual way; destructive","ety2":"Latin pernicies, destruction (nex, violent death).","syn":["insidious","deleterious","noxious","baneful","noisome"],"ant":["salutary","salubrious","wholesome"]},{"id":"mordant","w":"mordant","pos":"adjective","d":"bitingly sarcastic, often with ill intent","ex":"Her mordant remarks made colleagues avoid her.","ety":"Latin mordere (to bite), like morsel and remorse (the past coming back to bite you). Compare caustic, acrid, scathing (fierce but often righteous).","src":[{"c":"ttc","n":29},{"c":"bri","n":13},{"c":"va","n":36}],"pic":"more + ant","hook":"The more coffee the ants drink, the more biting their sarcastic jokes get.","syn":["caustic","acerbic","biting"],"ant":["gentle","kind"],"d2":"bitingly sarcastic or sharp (of humor)","pr":"MOR-dunt","ety2":"Latin mordere, to bite — think of gnashing teeth."},{"id":"piquant","w":"piquant","pos":"adjective","d":"pleasantly sharp or spicy in taste; also stimulating, provocative or charming","ex":"My son loved the piquant taste of lemons. / We had a piquant debate.","ety":"French piquer (to prick, sting). Related: pique (to irritate; or to arouse curiosity: 'it piqued my interest'). Opposite: insipid.","src":[{"c":"ttc","n":29}]},{"id":"officious","w":"officious","pos":"adjective","d":"aggressively eager to offer unwanted help or advice; meddlesome","ex":"The officious waiter practically ordered our meal for us.","ety":"Latin officium (duty, service), like office. In the 1560s it meant 'eager to serve'; by 1600 'too eager'.","src":[{"c":"ttc","n":29},{"c":"va","n":22}],"pr":"uh-FISH-us","tip":"Not the same as official!","rel":["quidnunc — a busybody (Latin, 'what now?')"],"d2":"meddlesome; forcing unwanted help or advice on others","syn":["meddlesome","intrusive","interfering","bossy"]},{"id":"salubrious","w":"salubrious","pos":"adjective","d":"good for one's health; wholesome","ex":"The salubrious sea air made me feel healthier.","ety":"Latin salus (health). Opposite: insalubrious.","src":[{"c":"ttc","n":29},{"c":"va","n":35}],"pr":"suh-LOO-bree-us","tip":"Wholesome builds up body or mind; salutary corrects or remedies; salubrious promotes physical health: salubrious air, a salubrious climate.","d2":"healthful; promoting well-being","ety2":"Latin salus, health — also salutary.","syn":["healthful","wholesome","invigorating","beneficial"],"ant":["insalubrious","deleterious","pernicious","noxious","noisome"]},{"id":"salutary","w":"salutary","pos":"adjective","d":"producing a beneficial effect, especially an improvement or useful lesson","ex":"Unstructured play has a salutary effect on children's development.","ety":"Same root as salute and salutation — Romans greeted each other with 'Salve!' (be well).","src":[{"c":"ttc","n":29}]},{"id":"avuncular","w":"avuncular","pos":"adjective","d":"kind, friendly and indulgent, like an uncle","ex":"The avuncular judge gave the young man a second chance.","ety":"Latin avunculus (maternal uncle), the source of 'uncle'.","src":[{"c":"ttc","n":29},{"c":"va","n":35}],"pr":"uh-VUNG-kyuh-lur","tip":"(This track is blank on your drive; entry written from the standard meaning.)","d2":"like an uncle, especially kind, genial and indulgent","ety2":"Latin avunculus, maternal uncle.","syn":["kindly","genial","benevolent","indulgent"]},{"id":"virile","w":"virile","pos":"adjective","d":"having masculine strength and energy","ex":"The ad featured a virile lumberjack.","ety":"Latin vir (man) — not related to virulent.","src":[{"c":"ttc","n":29}]},{"id":"exiguous","w":"exiguous","pos":"adjective","d":"very small in amount; meager and inadequate","ex":"The boy tried to stretch his exiguous lunch.","ety":"Related to exact: exiguous = less than the exact amount you need. Common pair: exiguous resources.","src":[{"c":"ttc","n":30}]},{"id":"diminuendo","w":"diminuendo","pos":"noun","d":"a gradual decrease in loudness or intensity","ex":"The chorus ended in a haunting diminuendo.","ety":"Italian, related to diminish. Opposite: crescendo.","src":[{"c":"ttc","n":30}]},{"id":"lilliputian","w":"Lilliputian","pos":"adjective","d":"very small; also trivial or petty","ex":"Our worries about dinner seem Lilliputian next to theirs.","ety":"Lilliput, the land of tiny, petty people in Swift's Gulliver's Travels (1726), who fought over which end to crack an egg.","src":[{"c":"ttc","n":30}]},{"id":"brobdingnagian","w":"Brobdingnagian","pos":"adjective","d":"gigantic; enormous","ex":"Brobdingnagian sculptures towered over the entrance.","ety":"Brobdingnag, the land of giants in Gulliver's Travels. A big, clunky word for big things. Informal cousin: ginormous (gigantic + enormous).","src":[{"c":"ttc","n":30}]},{"id":"magnum-opus","w":"magnum opus","pos":"noun","d":"an artist's or writer's greatest work","ex":"Fallingwater is often called Frank Lloyd Wright's magnum opus.","ety":"Latin 'great work'. Plural: magna opera. Synonyms: masterpiece, chef-d'oeuvre.","src":[{"c":"ttc","n":30}]},{"id":"commodious","w":"commodious","pos":"adjective","d":"comfortably and conveniently roomy","ex":"The dorm room was surprisingly commodious.","ety":"Latin commodus (convenient) — the same source as commode, a convenient chamber-pot chair.","src":[{"c":"ttc","n":30},{"c":"va","n":5}],"pr":"kuh-MOH-dee-us","d2":"roomy and comfortable; spacious","ety2":"Latin commodus, convenient — also behind accommodate and accommodations.","syn":["spacious","roomy","capacious","ample"]},{"id":"capacious","w":"capacious","pos":"adjective","d":"able to hold a great deal; roomy","ex":"Aunt Thelma has a capacious memory.","ety":"Related to capable and capacity: capacious = capable of holding a lot (and it rhymes with spacious).","src":[{"c":"ttc","n":30},{"c":"va","n":26}],"pr":"kuh-PAY-shus","d2":"roomy; able to hold a lot; broad and comprehensive","syn":["spacious","commodious","ample","roomy"]},{"id":"juggernaut","w":"juggernaut","pos":"noun","d":"a huge, overwhelming force that crushes everything in its path","ex":"At 16, Tommy was a juggernaut on the football field.","ety":"From Jagannath ('lord of the world'), a form of Krishna, whose giant festival chariots are pulled through Puri, India. Anglicized by the 'Hobson-Jobson' process.","src":[{"c":"ttc","n":30}]},{"id":"diminutive","w":"diminutive","pos":"adjective","d":"extremely small","ex":"The diminutive dancer commanded the stage.","ety":"Latin min (small).","src":[{"c":"ttc","n":30}]},{"id":"megalomaniac","w":"megalomaniac","pos":"noun","d":"a person obsessed with their own power and importance","ex":"The villain was a classic megalomaniac.","ety":"Greek mega (great) + mania (madness).","src":[{"c":"ttc","n":30}]},{"id":"wanderlust","w":"wanderlust","pos":"noun","d":"a strong desire to travel and explore the world","ex":"Her wanderlust took her to forty countries before thirty.","ety":"Borrowed from German wandern (to hike) + Lust (desire).","src":[{"c":"ttc","n":31}]},{"id":"invented-spelling","w":"invented spelling","pos":"term","d":"the logical but non-standard spellings young children create (like YIZ for 'wise')","ex":"Invented spelling shows what a child knows about sounds.","ety":"Children who spell by letter names use Y for the 'w' sound because the name 'why' starts with it.","src":[{"c":"ttc","n":31}]},{"id":"truckle","w":"truckle","pos":"verb","d":"to submit obsequiously; to yield weakly to someone more powerful","ex":"My brother refused to truckle to the bullies.","ety":"A truckle (trundle) bed was the low bed servants slept on, beneath their master's. Usually 'truckle to'.","src":[{"c":"ttc","n":32}]},{"id":"tendentious","w":"tendentious","pos":"adjective","d":"promoting a particular, often controversial, point of view; biased","ex":"His tendentious argument ignored all the research.","ety":"Related to tendency (leaning) and tenet (a belief one holds): leaning so far one way you can't see the others.","src":[{"c":"ttc","n":32}]},{"id":"tintinnabulation","w":"tintinnabulation","pos":"noun","d":"a ringing or tinkling sound, especially of bells","ex":"The tintinnabulation of church bells filled the valley.","ety":"Latin tintinnabulum (bell); compare tinnitus (ringing in the ears). Poe used it in 'The Bells'.","src":[{"c":"ttc","n":32}]},{"id":"susurration","w":"susurration","pos":"noun","d":"a soft whispering or rustling sound; a murmur","ex":"The susurration of the waves lulled us to sleep.","ety":"Latin susurrus (whisper) — say it and you hear it.","src":[{"c":"ttc","n":32}]},{"id":"harrumph","w":"harrumph","pos":"verb / noun","d":"to clear one's throat pompously, especially to show disapproval; to grumble","ex":"The professor harrumphed before answering.","ety":"An imitation of the sound itself.","src":[{"c":"ttc","n":32}]},{"id":"trenchant","w":"trenchant","pos":"adjective","d":"vigorous, clear and incisive; sometimes cutting","ex":"Uncle Jim's trenchant analysis went straight to the heart of the issue.","ety":"Old French trenchant (cutting), related to trench — originally a cut in wood or earth.","src":[{"c":"ttc","n":32},{"c":"va","n":16}],"pr":"TREN-chunt","tip":"Incisive = gets right to the point; cutting and biting = hurtful; trenchant combines incisive force with a sharp edge.","d2":"sharply incisive and forceful; keen and cutting","ety2":"French trencher, to cut.","syn":["incisive","keen","acute","cutting"]},{"id":"collocate","w":"collocate","pos":"noun","d":"a word that habitually appears alongside another","ex":"'Against' is a collocate of 'fulminate'.","ety":"Latin com (together) + locare (to place): words placed together.","src":[{"c":"ttc","n":33}]},{"id":"schadenfreude","w":"schadenfreude","pos":"noun","d":"pleasure taken in someone else's misfortune","ex":"I felt a twinge of schadenfreude when our rivals lost too.","ety":"German Schaden (harm) + Freude (joy).","src":[{"c":"ttc","n":34}]},{"id":"zeitgeist","w":"zeitgeist","pos":"noun","d":"the defining spirit or mood of a particular period","ex":"Jazz and flappers captured the zeitgeist of the 1920s.","ety":"German Zeit (time) + Geist (spirit, ghost).","src":[{"c":"ttc","n":34},{"c":"bri","n":31}],"pic":"sight + guy","hook":"A guy sightseeing with binoculars sees his grandpa's college days — a whole generation's mood.","syn":["spirit of the age","climate","mood"],"ant":[],"d2":"the spirit or mood of a particular period of history"},{"id":"weltschmerz","w":"weltschmerz","pos":"noun","d":"sadness and weariness at the evils and suffering of the world","ex":"Reading the news filled her with weltschmerz.","ety":"German Welt (world) + Schmerz (pain).","src":[{"c":"ttc","n":34}]},{"id":"eminence-grise","w":"éminence grise","pos":"noun","d":"a powerful adviser who works behind the scenes; (later, loosely) a respected elder statesman","ex":"Many saw the chief of staff as the éminence grise of the administration.","ety":"French 'grey eminence': Father Joseph, the grey-robed Capuchin adviser to Cardinal Richelieu (the 'red eminence').","src":[{"c":"ttc","n":34}]},{"id":"mugwump","w":"mugwump","pos":"noun","d":"a person who stays neutral or can't make up their mind, especially in politics","ex":"The senator was too much of a mugwump to take a stand.","ety":"From an Algonquian word for 'important person'; in 1884 it mocked Republicans who left their party. A fun false story: a bird with its mug on one side of the fence and its wump on the other.","src":[{"c":"ttc","n":34}]},{"id":"bete-noire","w":"bête noire","pos":"noun","d":"a person or thing especially disliked or dreaded","ex":"The Joker is Batman's bête noire.","ety":"French 'black beast'. Synonyms: nemesis, bugbear, anathema.","src":[{"c":"ttc","n":34}]},{"id":"doppelganger","w":"doppelgänger","pos":"noun","d":"a ghostly double of a living person; (now often) someone who looks strikingly like another","ex":"I saw your doppelgänger at the grocery store.","ety":"German 'double-goer'. Poe's story 'William Wilson' is a classic doppelgänger tale.","src":[{"c":"ttc","n":34}]},{"id":"loanword","w":"loanword","pos":"noun","d":"a word adopted from another language","ex":"'Kindergarten' is a German loanword.","ety":"Linguists call the process lexical borrowing.","src":[{"c":"ttc","n":34}]},{"id":"faux-pas","w":"faux pas","pos":"noun","d":"an embarrassing social blunder","ex":"Asking about 'Londonderry' was a faux pas.","ety":"French 'false step'.","src":[{"c":"ttc","n":34}]},{"id":"mot-juste","w":"mot juste","pos":"noun","d":"the exact, most appropriate word or expression","ex":"She searched for the mot juste to end her speech.","ety":"French 'the exact word'. Hook: the JUST-right word.","src":[{"c":"ttc","n":35}]},{"id":"bon-mot","w":"bon mot","pos":"noun","d":"a witty remark; a clever saying","ex":"He was famous for his bons mots at dinner parties.","ety":"French 'good word'.","src":[{"c":"ttc","n":35}]},{"id":"insouciant","w":"insouciant","pos":"adjective","d":"carefree and unconcerned; nonchalant","ex":"He took an insouciant stroll through town with his espresso.","ety":"French in (not) + soucier (to worry). Hook: insouciant → loosey-goosey. Synonyms: breezy, debonair, jaunty.","src":[{"c":"ttc","n":35},{"c":"va","n":32}],"pr":"in-SOO-see-unt","rel":["insouciance — lighthearted unconcern"],"ety2":"French in- (not) + soucier (to care); compare sans souci, without care.","syn":["nonchalant","blithe","carefree","unconcerned"]},{"id":"gestalt","w":"gestalt","pos":"noun","d":"an organized whole that is more than the sum of its parts","ex":"Listeners grasp a story's gestalt rather than counting its words.","ety":"German 'shape, form'. Gestalt psychology: we perceive wholes first (think of the face/vase illusion).","src":[{"c":"ttc","n":35}]},{"id":"cachet","w":"cachet","pos":"noun","d":"prestige or distinction; a mark of status","ex":"Wearing that brand carried a certain cachet on campus.","ety":"French 'seal' on a letter → a distinguishing mark → prestige. Pronounced ka-SHAY.","src":[{"c":"ttc","n":35}]},{"id":"cache","w":"cache","pos":"noun","d":"a hidden store of goods, valuables or weapons; the hiding place itself","ex":"Soldiers found a cache of weapons in the cave.","ety":"French cacher (to hide). Pronounced CASH — think stash.","src":[{"c":"ttc","n":35}]},{"id":"agent-provocateur","w":"agent provocateur","pos":"noun","d":"a secret agent who incites others to break the law so they can be punished","ex":"The lawsuit claimed the police used an agent provocateur.","ety":"French; related to provoke — the agent's job is to provoke.","src":[{"c":"ttc","n":35}]},{"id":"sangfroid","w":"sangfroid","pos":"noun","d":"composure and calm under pressure","ex":"Joe Montana's sangfroid won four Super Bowls.","ety":"French sang (blood) + froid (cold): cool-bloodedness. Froid comes from Latin frigidus — like frigid, frozen. Synonym: aplomb.","src":[{"c":"ttc","n":35}]},{"id":"aplomb","w":"aplomb","pos":"noun","d":"self-confidence and poise, especially in a demanding situation","ex":"She handled the hecklers with aplomb.","ety":"French à plomb (upright, by the plumb line).","src":[{"c":"ttc","n":35}]},{"id":"lagniappe","w":"lagniappe","pos":"noun","d":"a small extra gift given with a purchase; a bonus","ex":"The barista threw in a scone as lagniappe.","ety":"New Orleans Creole from Spanish la ñapa (the gift). Mark Twain called it 'a word worth traveling to New Orleans to get'. Pronounced LAN-yap.","src":[{"c":"ttc","n":35}]},{"id":"gemutlichkeit","w":"gemütlichkeit","pos":"noun","d":"warm, cozy friendliness and comfort, with a sense of belonging","ex":"Our Thanksgiving table is full of gemütlichkeit.","ety":"German Gemüt (soul, feeling), cognate with English mood.","src":[{"c":"ttc","n":35}]},{"id":"connotation","w":"connotation","pos":"noun","d":"the ideas and feelings a word suggests beyond its literal meaning","ex":"'Request' has a more formal connotation than 'ask'.","ety":"Its partner term is denotation, the literal dictionary meaning.","src":[{"c":"ttc","n":35}]},{"id":"sockdolager","w":"sockdolager","pos":"noun","d":"a decisive, finishing blow or remark; also something exceptional","ex":"Her closing argument was a real sockdolager.","ety":"An 1830s Americanism, perhaps a joke on 'doxology' (the hymn at the end of a service). A form of it ('sockdologizing') was the punchline Booth waited for before shooting Lincoln. Hook: you SOCK someone and they don't get up.","src":[{"c":"ttc","n":36}]},{"id":"peckish","w":"peckish","pos":"adjective","d":"slightly hungry; also irritable","ex":"A long hike always makes me peckish.","ety":"Literally 'inclined to peck' — like a bird nibbling. Hobbits avoid it with second breakfast and elevenses.","src":[{"c":"ttc","n":36}]},{"id":"evanescent","w":"evanescent","pos":"adjective","d":"quickly fading or disappearing; fleeting","ex":"Rainbows are beautiful but evanescent.","ety":"Latin e (= ex, out) + vanescere (to vanish). Hook: the VAN in evanescent → vanish.","src":[{"c":"ttc","n":36}]},{"id":"feckless","w":"feckless","pos":"adjective","d":"weak and ineffective; or lazy and irresponsible","ex":"The feckless leader was a mere figurehead.","ety":"Scottish feck (a clipped form of effect) + -less: without effect.","src":[{"c":"ttc","n":36}]},{"id":"profligate","w":"profligate","pos":"noun / adjective","d":"a recklessly extravagant, self-indulgent person; wildly wasteful or dissolute","ex":"The profligate rock star blew his millions on yachts.","ety":"Latin profligare (to ruin, overthrow).","src":[{"c":"ttc","n":36}]},{"id":"neologism","w":"neologism","pos":"noun","d":"a newly coined word or expression","ex":"'Selfie' was once a neologism.","ety":"Greek neo (new) + logos (word). A nonce word is invented for a single occasion.","src":[{"c":"ttc","n":36}]},{"id":"meme","w":"meme","pos":"noun","d":"an idea, behavior or style that spreads by imitation; especially an image or phrase that goes viral online","ex":"The 'most interesting man in the world' became a meme.","ety":"Coined by Richard Dawkins (1976) from Greek mimeme (imitated thing), shortened to rhyme with 'gene'. Related to mime and mimic.","src":[{"c":"ttc","n":36}]},{"id":"quark","w":"quark","pos":"noun","d":"an elementary particle that makes up protons and neutrons","ex":"Protons are made of three quarks.","ety":"Physicist Murray Gell-Mann took the spelling from Joyce's Finnegans Wake ('Three quarks for Muster Mark!') — fitting, since quarks come in threes.","src":[{"c":"ttc","n":36}]},{"id":"muggle","w":"muggle","pos":"noun","d":"a person who lacks a particular skill or knowledge; (in Harry Potter) a non-magical person","ex":"Among my astrophysicist friends, I'm a complete muggle.","ety":"Coined by J. K. Rowling from British slang 'mug' (a gullible person). Now in the Oxford English Dictionary.","src":[{"c":"ttc","n":36}]},{"id":"benevolent","w":"benevolent","pos":"adjective","d":"well-meaning and kindly","ex":"A benevolent neighbor shoveled our driveway without being asked.","pic":"bone + envelope","hook":"Your dog has been kind all week, so you give him a bone tucked inside an envelope.","syn":["kind","generous","charitable"],"ant":["malevolent","cruel"],"src":[{"c":"bri","n":0}]},{"id":"tawdry","w":"tawdry","pos":"adjective","d":"showy but cheap and of poor quality","ex":"The shop was full of tawdry souvenirs that broke within a day.","pic":"towel + dry","hook":"A cheap, flashy towel that can't dry anything — it's tawdry.","syn":["gaudy","cheap","tacky"],"ant":["tasteful","elegant"],"src":[{"c":"bri","n":0},{"c":"va","n":3}],"ety":"From 'tawdry lace', a corruption of St. Audrey's lace — cheap lace sold at St. Audrey's fair in England.","pr":"TAW-dree","d2":"cheap and showy; tastelessly gaudy"},{"id":"languid","w":"languid","pos":"adjective","d":"weak or slow; relaxed and lacking energy","ex":"We spent a languid afternoon dozing by the pool.","pic":"lane + squid","hook":"A squid lies limp in the middle of a bowling lane, too weak and lazy to move.","syn":["listless","sluggish","lethargic"],"ant":["energetic","lively"],"src":[{"c":"bri","n":0}]},{"id":"gregarious","w":"gregarious","pos":"adjective","d":"fond of company; sociable","ex":"Her gregarious brother knew everyone at the party within an hour.","pic":"gray car + rice","hook":"A gray car packed with grains of rice, all chatting and partying together.","syn":["sociable","outgoing","convivial"],"ant":["reclusive","introverted"],"src":[{"c":"bri","n":0}]},{"id":"pulchritude","w":"pulchritude","pos":"noun","d":"physical beauty","ex":"Poets have praised the pulchritude of the valley for centuries.","pic":"poker + toad","hook":"A toad at the poker table draws a straight flush — and a beautiful princess appears.","syn":["beauty","loveliness"],"ant":["ugliness"],"src":[{"c":"bri","n":0},{"c":"va","n":43}],"ety":"Latin pulcher, beautiful.","pr":"PUL-kri-tood","tip":"A literary word; often used with a wink.","rel":["pulchritudinous — beautiful"]},{"id":"tumult","w":"tumult","pos":"noun","d":"loud, confused noise or disorder, especially from a crowd","ex":"The announcement was lost in the tumult of the cheering fans.","pic":"tooth + mowing","hook":"A giant tooth mows the lawn at dawn and the whole street erupts in angry shouting.","syn":["uproar","commotion","turmoil"],"ant":["calm","peace"],"src":[{"c":"bri","n":0}]},{"id":"perusal","w":"perusal","pos":"noun","d":"the act of reading or examining something, often carefully","ex":"After a quick perusal of the menu, we ordered the soup.","pic":"parrot + salt (also: Peru + soul)","hook":"A parrot sprinkles salt on the book he's carefully reading.","syn":["reading","examination","review"],"ant":["neglect"],"src":[{"c":"bri","n":0}]},{"id":"redolent","w":"redolent","pos":"adjective","d":"strongly fragrant; also, strongly suggestive of something","ex":"The kitchen was redolent of cinnamon and fresh bread.","pic":"red deodorant","hook":"You swipe on a red deodorant and suddenly you smell sweet and fragrant.","syn":["fragrant","aromatic","evocative"],"ant":["odorless"],"src":[{"c":"bri","n":0}]},{"id":"guffaw","w":"guffaw","pos":"noun / verb","d":"a loud, hearty laugh; to laugh loudly","ex":"His guffaw echoed across the quiet library.","pic":"golf balls","hook":"A clown juggles golf balls, they all bonk him on the head, and he lets out a huge laugh.","syn":["roar","belly laugh"],"ant":["whimper"],"src":[{"c":"bri","n":0}]},{"id":"abasement","w":"abasement","pos":"noun","d":"humiliation or degradation; being brought low","ex":"He refused the job because he saw it as an abasement of his talents.","pic":"a basement","hook":"Someone gets shoved down into the basement in front of everyone — total humiliation.","syn":["humiliation","degradation"],"ant":["honor","exaltation"],"src":[{"c":"bri","n":0}]},{"id":"advocate","w":"advocate","pos":"noun / verb","d":"a person who publicly supports a cause; to publicly recommend or support","ex":"She advocated for better pay for teachers.","pic":"avocado + microphone","hook":"An avocado grabs the microphone to praise the carrot who's running for Congress.","syn":["supporter","champion","promote"],"ant":["opponent","critic"],"src":[{"c":"bri","n":1},{"c":"va","n":6}],"ety":"Latin ad (to) + vocare (to call). The same root: vocation (a calling), avocation (a hobby), convoke (call together), evoke (call forth), vocal.","pr":"AD-vuh-kayt (verb), AD-vuh-kit (noun)","d2":"to speak or write in support of; a supporter or someone who pleads for another"},{"id":"conciliate","w":"conciliate","pos":"verb","d":"to calm someone's anger; to win over or make peace","ex":"He tried to conciliate his angry neighbor with a fresh pie.","pic":"cone + latte","hook":"A kid hands his furious mom a latte-flavored ice-cream cone to calm her down.","syn":["placate","pacify","appease"],"ant":["provoke","antagonize"],"src":[{"c":"bri","n":1}]},{"id":"eclectic","w":"eclectic","pos":"adjective","d":"drawing from a wide, diverse range of sources or styles","ex":"His music taste is eclectic: jazz, punk and Malian blues.","pic":"electric guitar","hook":"A man on an electric guitar switches between every genre imaginable.","syn":["varied","diverse","wide-ranging"],"ant":["narrow","uniform"],"src":[{"c":"bri","n":1}]},{"id":"exonerate","w":"exonerate","pos":"verb","d":"to officially clear someone of blame","ex":"New DNA evidence exonerated the prisoner after ten years.","pic":"egg + rat","hook":"The rat ate the egg salad, not the monkey — so the monkey is set free from prison.","syn":["acquit","clear","vindicate"],"ant":["convict","blame"],"src":[{"c":"bri","n":1},{"c":"va","n":21}],"ety":"Latin ex (out) + onus (burden): to lift the burden of guilt.","pr":"ig-ZAHN-uh-rayt","d2":"to clear of blame or guilt"},{"id":"inane","w":"inane","pos":"adjective","d":"silly; lacking sense or meaning","ex":"The comments section was full of inane arguments.","pic":"In-N-Out","hook":"In-N-Out is out of hamburgers? That makes no sense.","syn":["silly","senseless","vacuous"],"ant":["sensible","intelligent"],"src":[{"c":"bri","n":1}]},{"id":"acumen","w":"acumen","pos":"noun","d":"the ability to make good judgments and quick decisions","ex":"Her business acumen turned a tiny stall into a chain of shops.","pic":"acute angle + men","hook":"Men sprint along an acute angle straight toward a giant brain.","syn":["shrewdness","insight","savvy"],"ant":["ignorance","ineptitude"],"src":[{"c":"bri","n":2}]},{"id":"filial","w":"filial","pos":"adjective","d":"relating to or befitting a son or daughter","ex":"He visited his parents every Sunday out of filial devotion.","pic":"file + nail","hook":"A father takes his daughter to get her nails filed — an act of family affection.","syn":["dutiful (as a child)","devoted"],"ant":[],"src":[{"c":"bri","n":2}]},{"id":"laud","w":"laud","pos":"verb","d":"to praise highly","ex":"Critics lauded the film as a masterpiece.","pic":"Lord","hook":"A church full of people raising their voices to praise the Lord.","syn":["praise","acclaim","extol"],"ant":["criticize","condemn"],"src":[{"c":"bri","n":2}]},{"id":"nonchalant","w":"nonchalant","pos":"adjective","d":"casually calm and unconcerned","ex":"He gave a nonchalant shrug when he heard he'd won.","pic":"nun + challenge","hook":"A nun faces the big Bible challenge totally calm — she's prepared for months.","syn":["casual","unconcerned","cool"],"ant":["anxious","concerned"],"src":[{"c":"bri","n":2}]},{"id":"perquisite","w":"perquisite nable for people who are pleasing to look at (or both good-looking and pleasant). For a merely friendly manner, use affable, amiable or sociable.","src":[{"c":"va","n":3}]},{"id":"resolute","w":"resolute","pos":"adjective","d":"firmly determined; unwavering in purpose","ex":"She was resolute about finishing her degree.","syn":["steadfast","determined","unwavering"],"ant":["irresolute","vacillating"],"pr":"REZ-uh-loot","rel":["resolve — to decide firmly"],"src":[{"c":"va","n":3}]},{"id":"supposition","w":"supposition","pos":"noun","d":"an assumption; something supposed to be true","ex":"The plan was built on the supposition that sales would grow.","pr":"sup-uh-ZISH-un","tip":"A hypothesis is a preliminary theory on limited evidence; a conjecture is little more than an educated guess; a supposition may rest on any amount of evidence, or none.","src":[{"c":"va","n":3}]},{"id":"arbitrary","w":"arbitrary","pos":"adjective","d":"based on whim or personal preference rather than reason; random; or using unchecked power","ex":"The deadline seemed arbitrary — no one could explain why it was Friday.","ety":"Related to arbiter and arbitrator, a judge who decides a dispute — an arbitrary decision is one left to someone's discretion.","pr":"AR-bi-trer-ee","src":[{"c":"va","n":3}]},{"id":"monotonous","w":"monotonous","pos":"adjective","d":"dull from lack of variety; repetitive in tone","ex":"The monotonous hum of the fan put him to sleep.","ety":"Greek mono- (one) + tone: literally having one tone. Compare monocle, monogram, monogamy.","pr":"muh-NAH-tuh-nus","rel":["monotony — tedious sameness"],"src":[{"c":"va","n":3}]},{"id":"legacy","w":"legacy","pos":"noun","d":"something handed down from the past; money or property left in a will","ex":"The cultural legacy of ancient Greece still shapes our thinking.","syn":["inheritance","bequest","heritage"],"pr":"LEG-uh-see","src":[{"c":"va","n":3}]},{"id":"manifold","w":"manifold","pos":"adjective","d":"many and varied; having many different parts","ex":"The job comes with manifold responsibilities.","syn":["multifarious","multitudinous","diverse"],"pr":"MAN-i-fohld","tip":"Manifold is not just a fancy 'many': it stresses variety as well as number.","src":[{"c":"va","n":4}]},{"id":"pliant","w":"pliant","pos":"adjective","d":"bending easily; flexible; easily influenced","ex":"The willow's pliant branches survived the storm.","ety":"French plier, to bend — as in pliers.","syn":["pliable","supple","flexible"],"pr":"PLY-unt","src":[{"c":"va","n":4}]},{"id":"retort","w":"retort","pos":"noun / verb","d":"a quick, sharp or witty reply; to reply in that way","ex":"Her clever retort silenced the heckler.","ety":"Latin re- (back) + torquere (to twist): something twisted back at the speaker.","pr":"ri-TORT","rel":["rejoinder — any answer, especially an answer to a reply"],"src":[{"c":"va","n":4}]},{"id":"obstinate","w":"obstinate","pos":"adjective","d":"stubbornly refusing to change one's mind or course","ex":"The obstinate mule would not budge.","syn":["stubborn","headstrong","intractable","pertinacious"],"ant":["compliant","docile","pliant"],"pr":"AHB-stuh-nit","tip":"(This track is blank on your drive; entry written from the standard meaning.)","src":[{"c":"va","n":4}]},{"id":"lacerate","w":"lacerate","pos":"verb","d":"to tear or cut roughly; figuratively, to wound deeply","ex":"The thorns lacerated his hands. His cruel retort lacerated her pride.","syn":["tear","gash","mangle","wound"],"pr":"LAS-uh-rayt","rel":["laceration — a jagged cut"],"src":[{"c":"va","n":4}]},{"id":"omnipotent","w":"omnipotent","pos":"adjective","d":"all-powerful; having unlimited authority","ex":"In the story the king acts as if he were omnipotent.","ety":"Latin omni- (all) + potent (powerful). The same prefix gives omniscient (all-knowing), omnipresent (everywhere at once) and omnivorous (eating everything).","pr":"ahm-NIP-uh-tunt","src":[{"c":"va","n":4}]},{"id":"unscrupulous","w":"unscrupulous","pos":"adjective","d":"without mora
