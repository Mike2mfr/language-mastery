],"n":[31]},{"r":"vis / vid","m":"see","key":"vision","ex":["visible","video","evident","provide"],"n":[31]},{"r":"aud","m":"hear","key":"audio","ex":["audible","audience","audition","auditorium"],"n":[31]},{"r":"tend / ten","m":"stretch, lean; hold","key":"tendency","ex":["tendentious","tenet","tenacious","extend"],"n":[32]},{"r":"neo","m":"new","key":"neon","ex":["neologism","neophyte","neonatal"],"n":[36]},{"r":"lum / lumin","m":"light","key":"illuminate","ex":["luminous","luminescent","Lumos"],"n":[36]},{"r":"petr","m":"rock, stone","key":"petrify","ex":["petroleum","petroglyph"],"n":[36]}],"alphabet":{"A":"apple","B":"bat","C":"cat","D":"dog","E":"elephant","F":"frog","G":"golf ball","H":"hand","I":"igloo","J":"jack","K":"kangaroo","L":"leaf","M":"mat","N":"nail","O":"orange","P":"pickle","Q":"queen","R":"rhino","S":"snake","T":"towel","U":"umbrella","V":"violin","W":"water","X":"xylophone","Y":"yo-yo","Z":"zebra"},"units":{"0":"Getting started","1":"Unit 1","2":"Unit 2","3":"Unit 3","4":"Unit 4","5":"Unit 5","6":"Unit 6","7":"Unit 7","8":"Unit 8"},"levels":{"1":{"n":1,"title":"The everyday power words","idea":"Elster's starting point: words that educated people use all the time, learned in order of difficulty so each one makes the next easier. Follow his three R's — routine, repetition and review: study a little every day, go over each set twice, and revisit a whole level before moving on."},"2":{"n":2,"title":"Words for judging people and ideas","idea":"Level 2 builds on the basics with words for motives, moods and arguments. Elster's big message here: the main way to keep building vocabulary after any course is reading — something every day, with a dictionary within reach."},"3":{"n":3,"title":"Precision and restraint","idea":"Level 3 is full of words about saying exactly enough — terse, laconic, succinct — and about character: glib, ingratiating, mercenary, erudite. Elster opens it with a plea to build the dictionary habit."},"4":{"n":4,"title":"The educated professional's toolkit","idea":"By Level 4 you have roughly doubled your normal rate of word learning. These words — astute, trenchant, perfunctory, sophistry — are the ones that mark a confident, precise speaker. Elster also steps back to ask what 'good usage' really means."},"5":{"n":5,"title":"Becoming a cultivated speaker","idea":"Level 5 opens with Elster's guide to pronunciation and closes the first half of the program. If you've absorbed Levels 1–5, your vocabulary is already in the top quarter of educated adults."},"6":{"n":6,"title":"Beyond the 75th percentile","idea":"The second half begins. Level 6 starts at about the 75th percentile of English vocabulary; finish Level 8 and you'll match most executives and professionals. Hard words are like money in the bank — you don't spend them every day, but they're there when you need them."},"7":{"n":7,"title":"Usage versus abusage","idea":"Level 7 pairs harder words with Elster's tour of the five great sources of 'abusage': redundancy, the sounds-like syndrome, vogue words, adverbiage and jargon."},"8":{"n":8,"title":"The 80th to 90th percentile","idea":"From here the leisurely part of the tour is over. Level 8 words fall roughly between the 80th and 90th percentile of the English vocabulary — words that the best-read people know. Elster proceeds with celerity; follow him with alacrity, and check each new word's pronunciation in a dictionary before you try it out."},"9":{"n":9,"title":"Into the top ten percent","idea":"Levels 9 and 10 cover words between the 90th and 99th percentile — the vocabulary of the most widely read. Elster skips his usual introduction and dives straight in, with detours into convince versus persuade and the foreign words and phrases English has borrowed."},"10":{"n":10,"title":"The summit","idea":"The acme of the English vocabulary: words known by fewer than one in ten educated adults. Some are rare treasures (deipnosophist, susurrus), some are precise tools (putative, specious, sanguine). Elster's parting advice: review the parts you found hardest, read widely, and keep a dictionary close for the rest of your life."}},"notes":[{"id":"va-success","lv":1,"kind":"essay","title":"Why vocabulary matters","points":["Researchers since the 1930s (notably Johnson O'Connor's Human Engineering Laboratory) found that a large, exact vocabulary goes with success at school and at work.","A big vocabulary is not just knowing hard words — it is knowing easy words more thoroughly and using them precisely.","About 3,500 words separate a high-vocabulary person from a low one; to excel in a field, your vocabulary should beat the average of your colleagues.","Words are the tools of thought: sharper tools, sharper thinking.","Success means more than money — it means doing your work well and making the most of your abilities."],"quiz":[]},{"id":"va-method","lv":1,"kind":"essay","title":"How to get the most out of Verbal Advantage","points":["The three R's: Routine (a set time every day — commute, workout), Repetition (go over each section a second time) and Review (re-listen to a whole level when you finish it).","Words are presented in order of difficulty: know 'reckless' and 'rash' before 'impetuous', and those before 'temerarious'.","After every 10 keywords there is a review quiz; if you miss three or more, go back over the ten words.","Don't rush and don't skip ahead: progress depends on thoroughness, not speed.","You learn more words by learning more about words — their history, relatives and pronunciation."],"quiz":[]},{"id":"va-realtor","lv":1,"kind":"pronunciation","title":"Realtor and realty","points":["Say REEL-tur (real + tor), not REE-luh-tur.","Likewise realty is REEL-tee, not REE-luh-tee.","Practice line: \"A realtor sells realty.\""],"quiz":[{"q":"How should 'realtor' be pronounced?","o":["REEL-tur","REE-luh-tur"],"a":0,"why":"Put the L right after 'rea': real + tor."}]},{"id":"va-redundancy-size","lv":1,"kind":"redundancy","title":"Say it again, Sam: size and height","points":["Don't say 'big in size', 'small in size', 'tall in height', 'long in length' or 'wide in width' — the adjective already says it.","Cutting redundancy is like dieting: it takes discipline, but the result looks and feels better."],"quiz":[{"q":"Which is better?","o":["The box is small.","The box is small in size."],"a":0,"why":"'In size' adds nothing."}]},{"id":"va-lie-lay","lv":1,"kind":"usage","title":"Lie vs. lay","points":["Lie (lie, lay, lain, lying) means to recline — it takes no object: \"Lie down.\" \"The dog lay on the rug yesterday.\"","Lay (lay, laid, laid, laying) means to put or place something — it needs an object: \"Lay the book on the table.\" \"She laid down a big tip.\"","Telling a dog to 'lay down' is the classic mistake: the dog should lie down.","Using these correctly never sounds stuffy — it just sounds right."],"quiz":[{"q":"Tell the dog to ___ down.","o":["lie","lay"],"a":0,"why":"No object, so the verb is lie."},{"q":"Yesterday I ___ in the sun for an hour.","o":["lay","laid"],"a":0,"why":"Past tense of lie is lay."},{"q":"She ___ the files on my desk.","o":["laid","lay"],"a":0,"why":"Something was placed, so the verb is lay (past: laid)."}]},{"id":"va-reading","lv":2,"kind":"essay","title":"Read with an eye for words","points":["Quizzes in magazines are fun but random; disciplined, graded study works better — and reading is the engine that keeps it going.","Read at least 15–30 minutes every day. Editorial pages, reviews, news magazines and headlines are rich in useful words.","Headlines love short, punchy words: eschew (avoid), aver (state firmly), impugn (attack as false), distaff (female, as in 'the distaff side'), bruit (spread a rumor).","Hobby magazines carry their own treasure: philatelist (stamp collector), numismatist (coin collector), prestidigitator (sleight-of-hand magician), sommelier (wine steward).","Whenever you meet an unfamiliar word, mark it and look it up — don't let it slip by."],"quiz":[]},{"id":"va-books","lv":2,"kind":"essay","title":"Five principles for reading books","points":["Read outside your specialty — the best professionals borrow analogous ideas from disparate fields.","Go for variety: alternate subjects, and alternate fiction with nonfiction.","Read what you enjoy; a book you force yourself through teaches little.","Read with a dictionary beside you — one at work, one at home.","Don't cheat yourself: never 'read around' a word you don't know. Those border words are the easiest ones to add next.","Keep it going after the course with flash cards (word on the front, definition and pronunciation on the back) or a personal dictionary notebook."],"quiz":[]},{"id":"va-preposition","lv":2,"kind":"usage","title":"Yes, you may end a sentence with a preposition","points":["The 'never end a sentence with a preposition' rule is a superstition — H. W. Fowler called it exactly that, and Theodore Bernstein agreed.","Great writers from Shakespeare ('such stuff as dreams are made on') to Toni Morrison end sentences with prepositions.","Natural: 'What are you looking for?' 'He's someone you can count on.' Stilted: 'For what are you looking?'","Let your ear decide: end with a preposition when it sounds natural, avoid it when it sounds clumsy."],"quiz":[{"q":"Which sentence is perfectly good English?","o":["That's the man I spoke to.","Both — but the first sounds natural.","Neither"],"a":1,"why":"'That's the man to whom I spoke' is also correct, but stiffer. Ending with 'to' is fine."}]},{"id":"va-sensual","lv":2,"kind":"usage","title":"Sensuous vs. sensual · comprise","points":["Sensuous refers favorably to pleasures of the senses: sensuous music, the sensuous colors of autumn.","Sensual refers to gratifying physical (often sexual) appetites, usually with a negative edge: sensual excess.","Comprise means 'include, contain': the whole comprises the parts. The United States comprises 50 states.","So don't say 'is comprised of'. Use 'is composed of' or 'consists of' — or flip it: 50 states make up the United States."],"quiz":[{"q":"The ___ beauty of the forest at dawn.","o":["sensuous","sensual"],"a":0,"why":"Pleasant to the senses, not about appetite: sensuous."},{"q":"Which is correct?","o":["The team comprises nine players.","The team is comprised of nine players."],"a":0,"why":"The whole comprises its parts."}]},{"id":"va-verbal-oral","lv":2,"kind":"usage","title":"Verbal vs. oral · verbiage, foliage","points":["Oral means spoken. Verbal means in words — spoken or written.","A 'verbal agreement' is ambiguous; if you mean it wasn't written down, say oral agreement.","Verbiage and foliage have three syllables: VUR-bee-ij, FOH-lee-ij — not 'verbage' or 'foilage'."],"quiz":[{"q":"A promise made only out loud is an ___ promise.","o":["oral","verbal"],"a":0,"why":"Verbal covers written words too."},{"q":"How many syllables in 'foliage'?","o":["three","two"],"a":0,"why":"FOH-lee-ij."}]},{"id":"va-disparate","lv":2,"kind":"pronunciation","title":"Disparate","points":["Disparate means fundamentally different, distinct.","Careful speakers stress the first syllable: DIS-puh-rit (newer variant: dis-PAR-it)."],"quiz":[]},{"id":"va-dictionary","lv":3,"kind":"essay","title":"The dictionary habit","points":["Know the name of your dictionary — 'Webster's' alone means nothing; dozens of books use it.","Own at least two good hardcover dictionaries (one at work, one at home); an unabridged one is worth having at home.","Read the whole entry: pronunciation first, then part of speech, etymology, every definition, usage notes and synonym studies.","Etymology (word history) is not entomology (the study of insects) — there's no n in etymology.","Knowing one root unlocks many words: mal- (bad) gives malpractice, malefactor (wrongdoer), maladroit (clumsy), malapropos (inappropriate).","Denotation is a word's exact dictionary meaning; connotation is everything it suggests. Use both.","Check your dictionary's style guide for punctuation and capitalization, and always reread what you write — ideally with a second pair of eyes."],"quiz":[]},{"id":"va-criteria","lv":3,"kind":"usage","title":"Criterion, criteria","points":["Criterion is singular, criteria plural: this criterion, these criteria. 'A criteria' is wrong.","A criterion is already a standard for judging, so 'decisional criterion' is redundant."],"quiz":[{"q":"Which is correct?","o":["The main criterion is cost.","The main criteria is cost."],"a":0,"why":"One standard = criterion."},{"q":"Which word means the history of words?","o":["etymology","entomology"],"a":0,"why":"Entomology is the study of insects."}]},{"id":"va-diction","lv":3,"kind":"usage","title":"A dictum on diction: irregardless, peruse, reticent","points":["Diction is your choice of words (and, secondarily, how clearly you enunciate). Good diction is clear, accurate, varied and apposite (relevant and fitting).","Irregardless is a nonword — a double negative. Say regardless.","Peruse traditionally means to read carefully and thoroughly, not to skim or browse.","Reticent means reluctant to speak, not simply reluctant. You can be reluctant to act, but not 'reticent to act'.","Beware the 'sounds-like syndrome', where a fancy word that sounds like a plainer one steals its meaning."],"quiz":[{"q":"Which is standard English?","o":["regardless","irregardless"],"a":0,"why":"Irregardless is a double negative."},{"q":"To peruse a contract means to…","o":["read it carefully","skim it quickly"],"a":0,"why":"Per- means thoroughly."},{"q":"He was ___ to sign the deal until his lawyer read it.","o":["reluctant","reticent"],"a":0,"why":"Reticent is about speaking; reluctant is about being unwilling."}]},{"id":"va-fewer","lv":3,"kind":"usage","title":"Less vs. fewer","points":["Use fewer for things you can count one by one: fewer cars, fewer mistakes, fewer items.","Use less for amounts and abstractions: less time, less money, less traffic.","So the supermarket sign should say '10 items or fewer'.","The people with less trouble in life are the ones who make fewer mistakes."],"quiz":[{"q":"There are ___ cars on the road on Sundays.","o":["fewer","less"],"a":0,"why":"Cars can be counted."},{"q":"I have ___ patience than I used to.","o":["less","fewer"],"a":0,"why":"Patience is an amount, not countable items."},{"q":"Express lane: ten items or ___.","o":["fewer","less"],"a":0,"why":"Items are countable."}]},{"id":"va-dilemma","lv":3,"kind":"usage","title":"Dilemma, quandary, predicament · censure vs. censor","points":["Strictly, a dilemma is a choice between two equally unpleasant alternatives (Greek di-, two + lemma, proposition). Using it for any problem is loose usage.","A quandary is a state of doubt that leaves you unsure what to do; a predicament is an unpleasant, awkward situation.","To censure is to criticize or condemn; to censor is to suppress or cut objectionable content."],"quiz":[{"q":"The Senate voted to ___ him for misconduct.","o":["censure","censor"],"a":0,"why":"Censure = formally condemn."},{"q":"Strictly speaking, a dilemma is…","o":["a choice between two bad options","any difficult problem"],"a":0,"why":"Di- means two."}]},{"id":"va-action","lv":3,"kind":"essay","title":"Putting your new words into action","points":["Words are precision tools: a word that's too fancy, too plain or slightly off splits the sentence like the wrong nail splits wood.","Rehearse a new word silently in your mind several times before using it aloud; check its meaning and pronunciation first.","Give each word a vivid personal context: link it to a person, a place, a book, or the moment you first met it.","Pick three or four words each morning and plan where you'll use them — an email, a conversation, a report.","Decide whether a word belongs in writing, speech or both (lachrymose suits writing; lucid works anywhere).","Don't use a word just to use it, don't lard sentences with big words, and never use vocabulary to show off. The goal is to be lucid, not inscrutable."],"quiz":[]},{"id":"va-usage-concept","lv":4,"kind":"essay","title":"What 'good usage' really means","points":["Permissivists say anything goes as long as we communicate; purists say rules are rules. Elster calls himself a moderate purist.","Humpty Dumpty ('a word means just what I choose it to mean') and Miss Thistlebottom (the rule-wielding schoolmarm) are both wrong.","Dictionaries are descriptive: they record how words are used. Usage guides are prescriptive: they evaluate what works best.","Good prescriptive advice aims not to dictate but to evaluate, not to cavil but to rectify, not to condemn but to ameliorate.","Recommended guides: Fowler, Bernstein, Strunk & White, Follett, Barzun, Zinsser, Safire and others.","Jacques Barzun: you must attend to words all the time — when you read, speak and listen — not just when you write."],"quiz":[]},{"id":"va-between-you-and-me","lv":4,"kind":"usage","title":"Between you and me","points":["After prepositions like between, for, with and to, use the objective case: between you and me, for my friend and me.","'Between you and I' is an overcorrection made mostly by educated people trying too hard.","Quick test: drop the other person. 'It's for I' sounds wrong, so 'it's for him and I' is wrong too: it's for him and me."],"quiz":[{"q":"Let's keep this between you and ___.","o":["me","I"],"a":0,"why":"Objective case after a preposition."},{"q":"The boss praised Greg and ___.","o":["me","I"],"a":0,"why":"Drop Greg: 'praised me'."},{"q":"___ and I will lead the meeting.","o":["She","Her"],"a":0,"why":"Subject of the sentence: nominative she."}]},{"id":"va-mispronounced-1","lv":4,"kind":"pronunciation","title":"Commonly mispronounced: stress and vogue","points":["Respite is RES-pit, stressed on the first syllable.","Keep the 'gram' in program (PROH-gram), as in telegram and diagram.","First-syllable stress: IN-fluence, AF-fluent, PREF-erable, COM-parable, FOR-midable, IN-tegral, HOS-pitable, AP-plicable, EX-quisite. Superfluous is soo-PUR-floo-us.","Err traditionally rhymes with sir (UR), though 'air' is now common.","Avoid the 'see' fad: ni-GOH-shee-ayt, kahn-truh-VUR-shul, SPEE-sheez — not ni-GOH-see-ayt, -VUR-see-ul, SPEE-seez.","Heinous is HAY-nus. Volatile is VAHL-uh-tul in American English."],"quiz":[{"q":"Where does the stress fall in 'formidable'?","o":["FOR-midable","for-MID-able"],"a":0,"why":"First syllable, like comparable and preferable."},{"q":"Which is the traditional pronunciation of 'negotiate'?","o":["ni-GOH-shee-ayt","ni-GOH-see-ayt"],"a":0,"why":"The 'see' version is a recent vogue."},{"q":"How is 'respite' best pronounced?","o":["RES-pit","ri-SPYT"],"a":0,"why":"Stress the first syllable."},{"q":"Heinous is pronounced…","o":["HAY-nus","HEE-nee-us"],"a":0,"why":"Two syllables."}]},{"id":"va-imply-infer","lv":4,"kind":"confused","title":"Imply vs. infer · disinterested vs. uninterested · anxious vs. eager","points":["To imply is to hint; to infer is to conclude. The speaker implies, the listener infers — 'the implier is the pitcher, the inferrer the catcher' (Bernstein).","Disinterested means impartial; uninterested means not interested. You want a disinterested judge, not an uninterested one.","Anxious means worried about something that might go wrong; eager means keen for something you want."],"quiz":[{"q":"From his silence, I ___ that he disagreed.","o":["inferred","implied"],"a":0,"why":"The listener draws a conclusion: infer."},{"q":"Are you ___ that I'm wrong?","o":["implying","inferring"],"a":0,"why":"The speaker hints: imply."},{"q":"A referee should be ___.","o":["disinterested","uninterested"],"a":0,"why":"Impartial, not bored."},{"q":"She's ___ to start her new job.","o":["eager","anxious"],"a":0,"why":"It's something she wants; anxious means worried."}]},{"id":"va-done","lv":4,"kind":"usage","title":"Is 'done' all right for 'finished'?","points":["Purists once insisted that only a roast is 'done' and people are 'finished'.","Usage authorities (even Theodore Bernstein, who had objected) came round: 'done' meaning completed dates back to the 14th century and is standard.","Lesson: question change, but don't cling to a rule against overwhelming evidence."],"quiz":[{"q":"'I'm done with my report' is…","o":["standard English","an error"],"a":0,"why":"Done meaning finished is fully standard."}]},{"id":"va-pronunciation","lv":5,"kind":"pronunciation","title":"How to become a cultivated speaker","points":["Good pronunciation is the easiest of the three goals to reach: you can master a word's pronunciation in a minute.","The hard part is catching familiar words you've been mispronouncing. Common slips: 'heighth' (height), 'warsh' (wash), mis-CHEE-vee-us (MIS-chi-vus), 'drownded', 'idear', 'irrevelant', JOO-luh-ree (JOO-ul-ree), NOO-kyuh-lur (NOO-klee-ur).","Regional accents are not mispronunciations: orange, merry/marry/Mary vary by region and are all acceptable.","Don't invent pronunciations and don't blindly imitate others — even experts. When in doubt, check a dictionary (two, if possible).","Learn the symbols: macron (¯, long vowel), breve (˘, short vowel), schwa (ə, the unstressed 'uh'), dieresis (¨) and circumflex (ˆ).","Always note where the main stress falls: AD-mirable, FOR-midable, IM-potent, GON-dola, MAY-or-al, e-LEC-toral."],"quiz":[{"q":"Which is the standard pronunciation of 'nuclear'?","o":["NOO-klee-ur","NOO-kyuh-lur"],"a":0,"why":"Two vowels after the k: nu-cle-ar."},{"q":"Which is the standard pronunciation of 'mischievous'?","o":["MIS-chi-vus","mis-CHEE-vee-us"],"a":0,"why":"Three syllables, stress on the first."},{"q":"Where is the stress in 'mayoral'?","o":["MAY-ur-ul","may-OR-ul"],"a":0,"why":"First syllable."}]},{"id":"va-plurals","lv":5,"kind":"usage","title":"Latin and Greek plurals","points":["Words ending in -is change to -es in the plural, pronounced 'eez': basis/bases, thesis/theses, crisis/crises, neurosis/neuroses.","Don't say 'this crises' for one crisis.","Don't over-apply the rule: processes is PRAH-ses-iz, not 'process-eez'.","Criterion/criteria and phenomenon/phenomena: the -a forms are plural."],"quiz":[{"q":"The plural of 'crisis' is…","o":["crises","crisises"],"a":0,"why":"-is becomes -es."},{"q":"How do you pronounce the plural 'processes'?","o":["PRAH-ses-iz","PRAH-ses-eez"],"a":0,"why":"Process is not a Greek -is word."}]},{"id":"va-unique","lv":5,"kind":"usage","title":"Loose usage and the overworked 'unique'","points":["Loose usage — peruse for skim, disinterested for uninterested, reticent for reluctant — causes real misunderstandings.","Unique means one of a kind, so it shouldn't be qualified: not 'very unique' or 'most unique'.","Better options: unparalleled, matchless, peerless, incomparable, singular, inimitable — or just unusual (which can be qualified).","Feckless means weak and ineffective (Scots feck, effect + -less)."],"quiz":[{"q":"Which is logical?","o":["a very unusual design","a very unique design"],"a":0,"why":"Unique can't come in degrees; unusual can."}]},{"id":"va-laws","lv":5,"kind":"essay","title":"Johnson O'Connor's laws of vocabulary","points":["Words can be ranked in order of difficulty.","Each person knows nearly all the words up to a certain level of difficulty, and few beyond it.","You learn fastest at the border of your vocabulary — so spend at least as much time reviewing as learning.","Review like an athlete practices: the basics, again and again, until they're automatic.","Finish Levels 1–5 and you're already in the top quarter of educated adults."],"quiz":[]},{"id":"va-active-passive","lv":6,"kind":"essay","title":"Active and passive vocabulary","points":["Children absorb thousands of words a year; after high school most adults add only one or two hundred.","Work reading rarely builds vocabulary, and the average college graduate reads only two books a year.","Your active vocabulary is what you can call on; your passive vocabulary is the warehouse of words you half-know. Unused words drift from one to the other.","'One's vocabulary needs constant fertilization or it will die' (Evelyn Waugh).","Unlike physical strength, vocabulary can keep growing all your life — with a little deliberate effort every day."],"quiz":[]},{"id":"va-greek-names","lv":6,"kind":"essay","title":"Words from ancient Greek names and places","points":["Procrustean — forcing conformity by violent means, after Procrustes, who stretched or lopped his victims to fit his bed.","Draconian — ruthlessly severe, after Draco, whose Athenian laws made nearly every crime punishable by death.","Epicurean — devoted to refined pleasure; an epicure has fastidious tastes in food and wine. (Epicurus himself taught pleasure through virtue.)","Pyrrhonism — total skepticism, after the philosopher Pyrrho, who doubted everything.","Boeotian — dull and ignorant (Athenians mocked rural Boeotia). Arcadian — idyllically rustic.","Solecism — a blunder in grammar or manners, from Soloi, a colony famous for its corrupt Greek.","Laodicean — lukewarm and indifferent, especially about religion."],"quiz":[{"q":"A draconian law is…","o":["ruthlessly severe","old-fashioned"],"a":0,"why":"After Draco's harsh code."},{"q":"A solecism is…","o":["a grammatical or social blunder","a long speech made alone"],"a":0,"why":"From the badly spoken Greek of Soloi. (A soliloquy is a speech made alone.)"},{"q":"A procrustean policy…","o":["forces everyone into one rigid mold","rewards hard work"],"a":0,"why":"Like Procrustes' bed."}]},{"id":"va-usage-6","lv":6,"kind":"usage","title":"At this point in time · immigrate/emigrate · eminent/imminent · transpire, condone, promiscuous","points":["'At this point in time' is a triple redundancy made famous at the Watergate hearings. Say now, or at present.","Childish means immaturely silly; childlike means innocent and trusting, like a child.","You emigrate FROM your country and immigrate TO a new one.","Imminent (IM-) means about to happen; eminent (EM-) means distinguished. Eminent domain is the state's superior right to take property.","Transpire strictly means to come to light, become known — not simply to happen.","Condone means to excuse or overlook an offense, not to approve it.","Promiscuous traditionally means indiscriminate, haphazard (a promiscuous collection), not only sexually so."],"quiz":[{"q":"My grandparents ___ from Italy in 1950.","o":["emigrated","immigrated"],"a":0,"why":"From = emigrate."},{"q":"Rain is ___; bring an umbrella.","o":["imminent","eminent"],"a":0,"why":"About to happen."},{"q":"An ___ surgeon led the team.","o":["eminent","imminent"],"a":0,"why":"Distinguished."},{"q":"Strictly, 'condone' means…","o":["to excuse or overlook","to approve or support"],"a":0,"why":"You condone a fault."},{"q":"Strictly, 'it transpired that he had lied' means…","o":["it came to light","it happened"],"a":0,"why":"Transpire = become known."}]},{"id":"va-impact","lv":6,"kind":"usage","title":"The overworked 'impact'","points":["'Impact' has become a vogue word for the plain noun effect and the verb affect.","A vogue word is an unusual or precise word suddenly adopted as a fashionable substitute for an everyday one (other examples: parameters, interface, proactive).","Use a putty knife, not a pile driver: say 'the law will affect small businesses', 'the effect on prices'."],"quiz":[{"q":"Which is plainer and clearer?","o":["The new rule will affect small businesses.","The new rule will impact small businesses."],"a":0,"why":"Affect is the everyday verb."}]},{"id":"va-redundancy","lv":7,"kind":"redundancy","title":"Abusage 1: Redundancy","points":["Redundancy — saying the same thing twice — is the most common error in educated usage, and the easiest to cure: delete.","Common offenders: repeat again, interact with each other, past history, future plans, advance planning, new innovation, continue on, proceed on.","More: fellow colleague, cooperate together, completely unanimous, report back, return back, ascend upward, dwindle down, passing fad, actual fact, final ultimatum, visible to the eye, new recruit, necessary requirement, each and every, from whence, consensus of opinion, join together, old antique, current incumbent, autobiography of his own life.","Endorse already means to sign on the back; shuttle already means to go back and forth.","Train your ear: once you start hearing redundancies, you'll hear them everywhere."],"quiz":[{"q":"Which is redundant?","o":["Could you repeat that again?","Could you repeat that?"],"a":0,"why":"Repeat means say again."},{"q":"Which needs no extra word?","o":["consensus","consensus of opinion"],"a":0,"why":"A consensus is a shared opinion."},{"q":"Which is correct?","o":["The vote was unanimous.","The vote was completely unanimous."],"a":0,"why":"Unanimous is already complete."},{"q":"Which is better?","o":["They plan to continue.","They plan to continue on."],"a":0,"why":"Continue already means go on."}]},{"id":"va-sounds-like","lv":7,"kind":"confused","title":"Abusage 2: The sounds-like syndrome","points":["A refined word gets confused with a similar-sounding one and used as a pretentious substitute. Repeat the error enough and we lose a perfectly good word.","Fortuitous means by chance, not fortunate: 'A fortuitous meeting with Mr. Sneed was the cause of his death.'","Apprise means inform; appraise means estimate the worth of. You apprise a co-worker; you appraise antiques.","The whole comprises its parts; the parts compose the whole. Not 'is comprised of'.","Deprecate means disapprove of; depreciate means belittle or lessen in value.","Enormity is monstrous evil (the enormity of a crime); enormousness is great size.","Precipitous means steep; precipitate means rash or abrupt. A sudden decision is precipitate; a steep fall in sales is precipitous.","Parameter is a mathematical term. For limits, say perimeter or limits; for features, say features.","Dictionaries describe usage, so listing two words as synonyms doesn't make them interchangeable for careful writers."],"quiz":[{"q":"Which is correct?","o":["We apprised her of the news.","We appraised her of the news."],"a":0,"why":"Apprise means inform; appraise means estimate value."},{"q":"Which is correct?","o":["The United States comprises fifty states.","The United States is comprised of fifty states."],"a":0,"why":"The whole comprises the parts."},{"q":"A hasty, ill-considered decision is…","o":["precipitate","precipitous"],"a":0,"why":"Precipitous means steep."},{"q":"'The ____ of the crime shocked the town.'","o":["enormity","enormousness"],"a":0,"why":"Enormity means monstrous wickedness."},{"q":"Which uses fortuitous correctly?","o":["Their fortuitous meeting on a train led to a partnership.","We were fortuitous to have good weather."],"a":0,"why":"Fortuitous means by chance; for luck, say fortunate."}]},{"id":"va-vogue","lv":7,"kind":"usage","title":"Abusage 3: Vogue words","points":["Vogue words suddenly become fashionable and are worn out by mechanical repetition. Fowler: they owe their vogue 'to the joy of showing one has acquired them.'","Unique means one of a kind. Don't write 'very unique'.","Impact means a collision. Prefer effect, affect, influence. Avoid 'impactful'.","Viable means able to live and grow. For a plan, say workable, practicable or feasible.","Beware needless -ize verbs: prioritize, finalize, incentivize. Criticize and sterilize earn their keep; incentivize doesn't (say encourage).","People talk; they don't 'dialogue'. Keep interface for computers, say method rather than methodology, decided rather than decisioned.","Worn-out catchphrases: bottom line, quantum leap, cutting edge, state of the art, learning experience, cautiously optimistic, it remains to be seen, 'in regards to' (say in regard to)."],"quiz":[{"q":"Which is plainer and better?","o":["The new rules affected sales.","The new rules impacted sales."],"a":0,"why":"Impact is a collision; prefer affect or influence."},{"q":"Which is better?","o":["a workable plan","a viable plan"],"a":0,"why":"Viable means able to live."},{"q":"Which is correct?","o":["in regard to","in regards to"],"a":0,"why":"Regards is for greetings: give her my regards."},{"q":"Which is better?","o":["We talked about it over lunch.","We dialogued about it over lunch."],"a":0,"why":"Plain verbs beat vogue verbs."}]},{"id":"va-adverbiage","lv":7,"kind":"usage","title":"Abusage 4: Adverbiage","points":["Adverbiage is the overuse or awkward use of adverbs: in clichés, in clumsy coinages like procedurally or experientially, and piled on in bunches.","Clichés where the adverb adds nothing: seriously consider, utterly reject, thoroughly examine, absolutely right, perfectly clear, definitely interested.","'Let me make one thing clear' is stronger than 'perfectly clear', which sounds condescending or defensive.","Facilitate is overworked. Try help, support, assist or encourage.","Not every need is critical, and learning doesn't have to be a process, an activity or an experience."],"quiz":[{"q":"Which is stronger?","o":["I reject the allegation.","I utterly reject the allegation."],"a":0,"why":"The adverb only weakens it."},{"q":"Which is better?","o":["We will help you train staff.","We will facilitate the staff training process."],"a":0,"why":"Plain verbs, no vogue words."},{"q":"Which phrase has a needless adverb?","o":["absolutely right","right"],"a":0,"why":"Rightness has no degrees."}]},{"id":"va-jargon","lv":7,"kind":"usage","title":"Abusage 5: Jargon","points":["Jargon is specialized, pretentious language that's needlessly hard to understand: 'the refuge of the timid writer and the smokescreen of the self-important one.'","'People learn best when the instruction is designed so that it facilitates the learning process' means 'People learn best when learning is fun.'","'Scoping the nature of the instructional requirements…' means 'We create courses that fit your needs.'","Bernstein: don't 'wrap a paucity of information in a plethora of words.'","Donald Hall: 'The heavier the subject, the paler the prose.' Say what you mean, simply and directly.","Elster's advice at the end of each level: listen to the whole level again before moving on."],"quiz":[{"q":"Plain English for 'We facilitate the learning process':","o":["We help people learn.","We optimize learner outcomes."],"a":0,"why":"Short, concrete words win."},{"q":"Which is jargon?","o":["interactive verbal processing ability","ability to talk"],"a":0,"why":"Inflated, abstract and vague."}]},{"id":"va-feel-bad","lv":8,"kind":"usage","title":"Feel bad, not badly","points":["When you're ill, upset or sorry, you feel bad. Feel is a linking verb, like smell and taste, so it takes an adjective.","Kilpatrick: if you feel badly, something is wrong with your sense of touch. Your fingers may be numb or gloved.","Likewise: if you smell badly, your nose is stopped up. If you smell bad, take a shower.","Three quarters of the Harper usage panel preferred 'I feel bad'.","Memory key (Barry Tarshis): we feel bad when we perform badly."],"quiz":[{"q":"Which is correct?","o":["I feel bad about missing your party.","I feel badly about missing your party."],"a":0,"why":"Feel takes an adjective when it describes your state."},{"q":"Which is correct?","o":["The milk smells bad.","The milk smells badly."],"a":0,"why":"Linking verbs take adjectives."},{"q":"Which is correct?","o":["She sang badly and felt bad afterward.","She sang bad and felt badly afterward."],"a":0,"why":"We feel bad when we perform badly."}]},{"id":"va-mispronounced-2","lv":8,"kind":"pronunciation","title":"More commonly mispronounced words","points":["Query: KWEER-ee, not KWAIR-ee.","Consul and consulate begin with con-, not coun-.","Library: there's no 'berry' in it. Say LY-brer-ee.","Don't transpose sounds (metathesis): irrelevant, not irrevelant; jewelry (JOO-ul-ree), not jewelery.","Grievous has two syllables, GREE-vus. There's no 'grievious'.","Pronounce, but pronunciation (pro-NUN-see-AY-shun). There's no 'pronounciate'.","Siege, refuge and refugee take a soft g, as in cage, not the zh of collage.","Double c before e or i sounds like ks: succinct (suk-SINGKT), flaccid (FLAK-sid), accessory, accept, accident.","Juror, vendor, defendant: don't over-pronounce the final syllable as 'or' or 'dant'.","A strong point is a forte said as one syllable, 'fort'. The musical forte, meaning loud, has two."],"quiz":[{"q":"How do you say 'succinct'?","o":["suk-SINGKT","suh-SINGKT"],"a":0,"why":"The first c is hard, the second soft."},{"q":"How do you say 'forte' meaning a strong point?","o":["fort","FOR-tay"],"a":0,"why":"FOR-tay is the musical term."},{"q":"Which spelling is right?","o":["grievous","grievious"],"a":0,"why":"Two syllables: GREE-vus."},{"q":"Which is a real word?","o":["pronunciation","pronounciation"],"a":0,"why":"The verb has 'noun', the noun doesn't."},{"q":"How do you say 'flaccid'?","o":["FLAK-sid","FLAS-id"],"a":0,"why":"The double c rule: first k, then s."}]},{"id":"va-convince-persuade","lv":9,"kind":"confused","title":"Convince versus persuade","points":["You convince someone that something is true. You persuade someone to do something.","Persuade takes an infinitive: persuade her to go.","Convince takes 'of' or 'that': convinced of the truth, convinced that it matters. Never 'convince someone to'.","Witherspoon: persuade emphasizes winning over; convince emphasizes proof by argument.","'They convinced me their candidate was best, and persuaded me to vote for him.'","Kilpatrick: an argument that's persuasive may not be convincing, but once we're convinced, persuasion has done its job."],"quiz":[{"q":"Which is correct?","o":["She persuaded him to take her to Monte Carlo.","She convinced him to take her to Monte Carlo."],"a":0,"why":"Persuade + to."},{"q":"Which is correct?","o":["I'm convinced that he's right.","I'm persuaded to that he's right."],"a":0,"why":"Convince + that."},{"q":"Fill in: 'Can you ___ the bank to lend us the money?'","o":["persuade","convince"],"a":0,"why":"Getting someone to act calls for persuade."},{"q":"Fill in: 'The evidence ___ the jury of his guilt.'","o":["convinced","persuaded"],"a":0,"why":"Bringing someone to believe calls for convince."}]},{"id":"va-foreign","lv":9,"kind":"foreign","title":"Foreign words and phrases","points":["Faux pas (foh PAH): a social blunder, literally 'false step'. The plural is spelled the same but said foh PAHZ.","Bête noire (bet NWAHR): something or someone you especially dislike or dread.","Bon mot (bohn MOH): a witty remark. The plural, bons mots, is said bohn MOHZ.","Élan (ay-LAHN): spirited self-assurance or verve. Its brassy cousin is the Yiddish chutzpah: shameless nerve.","On the qui vive (kee VEEV): on the alert.","Coup de grâce (koo duh GRAHS): the finishing blow. Literally a stroke of mercy, so don't drop the s.","Ad infinitum: endlessly. Pro tempore (pro tem): for the time being.","Sine qua non: an indispensable thing. Quid pro quo: something given in return.","Caveat emptor: let the buyer beware. Pro bono (publico): for the public good, free of charge."],"quiz":[{"q":"'Math was my ___ in high school.'","o":["bête noire","bon mot"],"a":0,"why":"A bête noire is a thing you dread."},{"q":"The finishing blow is…","o":["the coup de grâce","the faux pas"],"a":0,"why":"Literally a stroke of mercy."},{"q":"Something absolutely essential is a…","o":["sine qua non","quid pro quo"],"a":0,"why":"Literally 'without which not'."},{"q":"Lawyers who work free for the public good do it…","o":["pro bono","pro tem"],"a":0,"why":"Pro tem means temporarily."}]},{"id":"va-effete","lv":9,"kind":"confused","title":"The case of effete","points":["Effete properly means worn out, exhausted, no longer productive: 'If they find the old governments effete, they may seek new ones.' (Burke)","It comes from Latin effetus, worn out from bearing young, and was once used of animals past breeding and barren land.","The sounds-like syndrome confuses it with effeminate (unmanly) and with elite (the choice part, or snobbish).","Spiro Agnew's 'an effete corps of impudent snobs' fixed the mistaken sense of snobbery in millions of minds.","Careful speakers keep the precise sense: exhausted, ineffective, washed up."],"quiz":[{"q":"What does effete precisely mean?","o":["worn out","snobbish","womanly","elegant"],"a":0,"why":"Latin effetus, exhausted from bearing young."},{"q":"Which uses effete precisely?","o":["The empire's effete institutions could no longer govern.","The effete critics sneered at popular films."],"a":0,"why":"Effete means exhausted, not snobbish."}]},{"id":"va-phobias","lv":10,"kind":"essay","title":"Talking about fear","points":["A phobia is an exaggerated or unnatural fear, from Greek phobos. Its opposite combining form is -philia, love: bibliophilia, bibliophobia.","Familiar ones: claustrophobia (enclosed spaces), agoraphobia (open or public spaces; agora was the Greek marketplace), xenophobia (foreigners).","Easy to decode: neophobia (anything new), zoophobia (animals), pyrophobia (fire), thanatophobia (death).","Rarer: ablutophobia (bathing), sophophobia (learning), allodoxaphobia (other people's opinions), chronophobia (time), pantophobia (everything).","And the ultimate: phobophobia, the fear of fear itself."],"quiz":[{"q":"Fear of open or public spaces is…","o":["agoraphobia","claustrophobia"],"a":0,"why":"Agora was the Greek marketplace."},{"q":"A neophobe fears…","o":["anything new","night"],"a":0,"why":"Greek neos, new."},{"q":"Thanatophobia is fear of…","o":["death","water"],"a":0,"why":"Greek thanatos, death."}]},{"id":"va-number-amount","lv":10,"kind":"usage","title":"Number and amount","points":["Use number for things you can count: the number of people, the number of papers on your desk.","Use amount for things taken as a mass: the amount of sugar, the amount of paper, the amount of trouble.","'A number of' takes a plural verb: A number of people are here.","'The number of' takes a singular verb: The number of members has decreased.","Remember: a number is plural; the number is singular."],"quiz":[{"q":"Which is correct?","o":["the number of people at the party","the amount of people at the party"],"a":0,"why":"People can be counted."},{"q":"Which is correct?","o":["A number of boxes were sent.","A number of boxes was sent."],"a":0,"why":"'A number of' is plural."},{"q":"Which is correct?","o":["The number of tasks is small.","The number of tasks are small."],"a":0,"why":"'The number' is singular."},{"q":"Which is correct?","o":["the amount of food we buy","the number of food we buy"],"a":0,"why":"Food, as a mass, is measured, not counted."}]},{"id":"va-long-word","lv":10,"kind":"essay","title":"The long word","points":["The long word for long words is sesquipedalian, from Horace's sesquipedalia verba, 'words a foot and a half long'.","Fancy words for simple things: chryselephantine (made of gold and ivory), borborygmus (a rumbling in the gut), bruxomania (grinding the teeth).","Some of the longest pronounceable words: bathysiderodromophobia (fear of subways), floccinaucinihilipilification (judging something worthless) and hippopotomonstrosesquipedalian (to do with very long words).","Writing all of those out may give you graphospasm, writer's cramp."],"quiz":[{"q":"A 'sesquipedalian' word is…","o":["very long","very old"],"a":0,"why":"Literally a foot and a half long."},{"q":"Floccinaucinihilipilification means…","o":["judging something worthless","fear of long words"],"a":0,"why":"From Latin words for trifles: floccus, naucum, nihil, pilus."}]},{"id":"va-final","lv":10,"kind":"pronunciation","title":"Final suggestions on pronunciation","points":["Nuclear is NOO-klee-ur. There's no 'nucular'.","Exquisite and hospitable are traditionally stressed on the first syllable: EKS-kwi-zit, HAHS-pi-tuh-bul.","Atmospheric is at-mus-FER-ik.","Envelope and envoy are English words: EN-vuh-lohp, EN-voy, not the pseudo-French AHN-.","Zoology is zoh-AHL-uh-jee: there's no 'zoo' in it.","Extraordinary has five syllables: ik-STROR-di-ner-ee.","Pronounce the h in huge and human.","Et cetera begins with et, not ek.","Schism is traditionally SIZ-um.","Visa takes a z sound: VEE-zuh.","Elster's parting advice: review the hardest parts, read widely, use your dictionary, and keep expanding your vocabulary for life."],"quiz":[{"q":"How is 'nuclear' pronounced?","o":["NOO-klee-ur","NOO-kyuh-lur"],"a":0,"why":"New + clear."},{"q":"How many syllables does 'extraordinary' have?","o":["five","six"],"a":0,"why":"ik-STROR-di-ner-ee."},{"q":"How does 'et cetera' begin?","o":["et","ek"],"a":0,"why":"Latin et, and."}]}]}</script>
<script>
(function(){
"use strict";
/* ---------- data ---------- */
const DATA = JSON.parse(document.getElementById('wh-data').textContent);
const W = {}; DATA.words.forEach(w => { W[w.id] = w; });
const COURSES = {
  ttc:{name:"Building a Better Vocabulary", short:"Better Vocabulary", by:"Prof. Kevin Flanigan · The Great Courses · 36 lectures", unit:"Lecture"},
  bri:{name:"Vocabulary Words Brilliance", short:"Brilliance", by:"Lewis Angel · picture-story memory method · 33 sections", unit:"Section"},
  va:{name:"Verbal Advantage", short:"Verbal Advantage", by:"Charles Harrington Elster · 10 levels, from everyday words to rare ones", unit:"Level"}
};
const CKEYS = ['ttc','bri','va'];
const NOTE = {}; (DATA.notes || []).forEach(n => { NOTE[n.id] = n; });
const KIND = {usage:'Usage', pronunciation:'Pronunciation', redundancy:'Redundancy', essay:'Elster on words', confused:'Often confused', foreign:'Borrowed words'};
function lessonName(c, L){ if(c === 'ttc') return 'Lecture ' + L.n; if(c === 'bri') return L.n === 0 ? 'Warm-up' : 'Section ' + L.n; return 'Level ' + L.unit + ' · ' + L.title; }
const LEVELS = ["Not started","Heard it","Recognize it","Know it","Own it"];
const LEVEL_HELP = ["You haven't studied it yet.","You've met it once.","You recognize it when you read it.","You know it well.","You can use it in your own speech and writing."];
const INTERVAL = [0,1,3,8,21];
const lessonsOf = c => DATA.lessons[c];
const findLesson = (c,n) => DATA.lessons[c].find(L => L.n === n);
const rootsByWord = {};
DATA.roots.forEach(r => r.ex.forEach(x => { const id = slug(x); (rootsByWord[id] = rootsByWord[id] || []).push(r); }));
function slug(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }

/* ---------- utils ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'');
function dayKey(d){ d = d || new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(k,n){ const [y,m,d] = k.split('-').map(Number); const t = new Date(y,m-1,d+n); return dayKey(t); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function hash(s){ let h = 2166136261; for(const c of s){ h ^= c.charCodeAt(0); h = Math.imul(h,16777619); } return h >>> 0; }
const firstSentence = s => { const m = String(s||'').match(/^.*?[.!?](\s|$)/); return m ? m[0].trim() : s; };
function trunc(s,n){ s = String(s||''); return s.length > n ? s.slice(0,n-1).replace(/\s+\S*$/,'')+'…' : s; }

/* ---------- icons ---------- */
const I = {
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>',
  lessons:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 7h7M9 11h5"/></svg>',
  practice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/><path d="M7 13l2.5 2.5L14 11"/></svg>',
  words:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h6M8 11h6M8 15h3"/></svg>',
  speak:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>',
  starOn:'<svg viewBox="0 0 24 24" fill="var(--lamp)" stroke="var(--lamp)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>'
};

/* ---------- state & storage ---------- */
const KEY = 'wordhoard.v1';
function defaults(){ return {v:1, w:{}, days:{}, star:{}, hp:{}, set:{goal:10, rate:0.9, course:'both'}, setT:0, ts:0}; }
let S = defaults();
try { const raw = localStorage.getItem(KEY); if(raw){ const o = JSON.parse(raw); if(o && o.v === 1) S = Object.assign(defaults(), o); } } catch(e){}
if(S.set.course === 'both' || !ORDER_KEYS_OK(S.set.course)) S.set.course = 'all';
function ORDER_KEYS_OK(c){ return ['all','ttc','bri','va'].includes(c); }
let syncMode = 'local', remoteRef = null, saveTimer = null, writing = false, dirty = false;
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function persist(){ S.ts = Date.now(); saveLocal(); dirty = true; if(remoteRef){ clearTimeout(saveTimer); saveTimer = setTimeout(pushRemote, 2200); } }
async function pushRemote(){
  if(!remoteRef || writing || !dirty) return;
  writing = true; dirty = false;
  try { await remoteRef.set(JSON.parse(JSON.stringify(S))); }
  catch(e){
    const code = e && e.code;
    if(['invalid_argument','not_granted','revoked','capability_disabled','capability_removed','transform_error','quota_exceeded'].includes(code)){ remoteRef = null; syncMode = 'local'; refreshSync(); }
    else { dirty = true; setTimeout(pushRemote, 5000 + Math.random()*3000); }
  }
  writing = false;
  if(dirty && remoteRef){ clearTimeout(saveTimer); saveTimer = setTimeout(pushRemote, 1500); }
}
function mergeIn(R){
  if(!R || R.v !== 1) return false;
  let changed = false;
  for(const [id,e] of Object.entries(R.w || {})){ const l = S.w[id]; if(!l || (e.t||0) > (l.t||0)){ S.w[id] = e; changed = true; } }
  for(const [d,v] of Object.entries(R.days || {})){ const l = S.days[d] || {a:0,n:0}; const m = {a:Math.max(l.a||0,v.a||0), n:Math.max(l.n||0,v.n||0)}; if(m.a !== l.a || m.n !== l.n){ S.days[d] = m; changed = true; } }
  for(const id of Object.keys(R.star || {})) if(!S.star[id]){ S.star[id] = 1; changed = true; }
  for(const id of Object.keys(R.hp || {})) if(!S.hp[id]){ S.hp[id] = 1; changed = true; }
  if((R.setT||0) > (S.setT||0) && R.set){ S.set = Object.assign(S.set, R.set); S.setT = R.setT; changed = true; }
  return changed;
}
async function initSync(){
  if(!window.claude || typeof window.claude.use !== 'function') return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db || !user) return;
    const uid = await user.id();
    if(!uid) return;
    const ref = db.doc('data/users/' + uid + '/progress');
    const snap = await ref.get();
    let remoteHadMore = false;
    if(snap.exists){ remoteHadMore = mergeIn(JSON.parse(JSON.stringify(snap.data() || {}))); }
    remoteRef = ref; syncMode = 'account';
    if(remoteHadMore){ saveLocal(); render(); }
    dirty = true; pushRemote();
    refreshSync();
  } catch(e){ syncMode = 'local'; }
}

/* ---------- progress model ---------- */
const today = () => dayKey();
const lvl = id => (S.w[id] && S.w[id].b) || 0;
function touchDay(newWord){ const k = today(); const d = S.days[k] || {a:0,n:0}; d.a++; if(newWord) d.n++; S.days[k] = d; }
function grade(id, ok, opts){
  opts = opts || {};
  const e = S.w[id] || {b:0, d:today(), n:0, c:0};
  const wasNew = !e.b;
  if(opts.known){ e.b = 4; e.b4 = 1; e.d = addDays(today(), INTERVAL[4]); }
  else if(ok){
    if(wasNew){ e.b = 1; }
    else if(e.d <= today() || opts.force){ e.b = Math.min(4, e.b + 1); }
    e.d = addDays(today(), e.b === 4 && !wasNew && e.b4 ? 45 : INTERVAL[e.b]);
    if(e.b === 4) e.b4 = 1;
    e.c++;
  } else { e.b = 1; e.d = today(); delete e.b4; }
  e.n++; e.t = Date.now();
  S.w[id] = e; touchDay(wasNew); persist();
}
const startedIds = () => Object.keys(S.w).filter(id => W[id] && S.w[id].b > 0);
const dueIds = () => startedIds().filter(id => S.w[id].d <= today()).sort((a,b) => S.w[a].b - S.w[b].b || (S.w[a].d < S.w[b].d ? -1 : 1));
function courseOrder(c){ const out = []; const seen = new Set(); for(const L of lessonsOf(c)) for(const it of L.items){ if(!seen.has(it.id)){ seen.add(it.id); out.push(it.id); } } return out; }
const ORDER = {ttc:courseOrder('ttc'), bri:courseOrder('bri'), va:courseOrder('va')};
ORDER.all = (function(){ const out=[], seen=new Set(); const Ls = CKEYS.map(lessonsOf); const n = Math.max(...Ls.map(x => x.length)); for(let i=0;i<n;i++){ for(const A of Ls){ const L = A[i]; if(!L) continue; for(const it of L.items) if(!seen.has(it.id)){ seen.add(it.id); out.push(it.id); } } } return out; })();
ORDER.both = ORDER.all;
const newQueue = c => ORDER[c || S.set.course].filter(id => !lvl(id));
const newToday = () => (S.days[today()] || {n:0}).n;
function streak(){ let k = today(), n = 0; if(!(S.days[k] && S.days[k].a)) k = addDays(k,-1); while(S.days[k] && S.days[k].a){ n++; k = addDays(k,-1); } return n; }
function levelCounts(ids){ const c = [0,0,0,0,0]; for(const id of ids) c[lvl(id)]++; return c; }
function nextLesson(c){ const L = lessonsOf(c).find(L => L.items.some(it => !lvl(it.id))); return L || lessonsOf(c)[0]; }

/* ---------- speech ---------- */
let voice = null;
function pickVoice(){ try { const vs = speechSynthesis.getVoices(); voice = vs.find(v => /en-US/i.test(v.lang) && /natural|premium|enhanced|samantha|google/i.test(v.name)) || vs.find(v => /en-US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; } catch(e){} }
const canSpeak = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
if(canSpeak){ pickVoice(); try { speechSynthesis.onvoiceschanged = pickVoice; } catch(e){} }
function say(text){ if(!canSpeak) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = voice ? voice.lang : 'en-US'; if(voice) u.voice = voice; u.rate = S.set.rate || 0.9; speechSynthesis.speak(u); } catch(e){} }
const sayBtn = (text, label) => canSpeak ? `<button class="say" data-say="${esc(text)}" aria-label="Hear ${esc(text)}">${I.speak}<span>${label || 'Hear it'}</span></button>` : '';

/* ---------- router ---------- */

const TABS = [['today','Today'],['lessons','Lessons'],['practice','Practice'],['words','Words']];
let tabCourse = 'ttc', wordsMode = 'dict', wordFilter = 'all', wordQuery = '';
function go(name, params, replace){ if(!replace) stack.push(view); view = Object.assign({name}, params || {}); render(true); }
function back(){ view = stack.pop() || {name:'today'}; render(true); }
function tabOf(v){ const n = v.name; if(['lessons','lesson'].includes(n)) return 'lessons'; if(['words','word'].includes(n)) return 'words'; if(n === 'practice') return 'practice'; if(n === 'today') return 'today'; return null; }

const app = document.getElementById('app');
function render(scrollTop){
  stopTimer();
  const focus = !!SESSION_VIEWS[view.name];
  document.body.classList.toggle('focus', focus);
  const t = tabOf(view) || (stack.slice().reverse().map(tabOf).find(Boolean)) || 'today';
  const nav = TABS.map(([k,l]) => `<button data-tab="${k}" ${t===k?'aria-current="page"':''}>${I[k]}<span>${l}</span></button>`).join('');
  document.getElementById('bnav').innerHTML = nav;
  document.getElementById('toptabs').innerHTML = TABS.map(([k,l]) => `<button data-tab="${k}" ${t===k?'aria-current="page"':''}>${l}</button>`).join('');
  const fn = VIEWS[view.name] || VIEWS.today;
  app.innerHTML = `<div class="fade">${fn(view)}</div>`;

  if(view.after) { const f = view.after; view.after = null; f(); }

/* ---------- shared bits ---------- */
function hwSize(t){ const n = Math.max(...String(t).split(/[ -]/).map(x => x.length)); return n >= 15 ? 'l3' : n >= 13 ? 'l2' : n >= 10 ? 'l1' : ''; }
const dim = b => `<span class="dim" title="${LEVELS[b]}" aria-label="${LEVELS[b]}">${[1,2,3,4].map(i => `<i class="${b>=i?'on':''}"></i>`).join('')}</span>`;
const backBtn = (label) => `<button class="back" data-act="back">${I.back}<span>${esc(label || 'Back')}</span></button>`;
function highlightRoots(w){
  const rs = rootsByWord[w.id]; let text = w.w; if(!rs) return esc(text);
  const low = text.toLowerCase(); let best = null;
  for(const r of rs){ for(let v of r.r.split('/')){ v = v.replace(/\(.*?\)/g,'').replace(/-/g,'').trim().toLowerCase(); if(v.length < 2) continue; const i = low.indexOf(v); if(i >= 0 && (!best || v.length > best.len)) best = {i, len:v.length}; } }
  if(!best) return esc(text);
  return esc(text.slice(0,best.i)) + '<span class="hl">' + esc(text.slice(best.i, best.i+best.len)) + '</span>' + esc(text.slice(best.i+best.len));
}
function srcLabel(s){ const L = findLesson(s.c, s.n); if(s.c === 'va') return `Verbal Advantage · Level ${L.unit}, ${L.title.toLowerCase()}`; return s.c === 'ttc' ? `Lecture ${s.n}: ${L.title}` : (s.n === 0 ? 'Brilliance warm-up' : `Brilliance · Section ${s.n}`); }
function wordRow(id, note){
  const w = W[id]; if(!w) return '';
  return `<button class="li" data-word="${id}"><span class="li-main"><span class="li-title"><span class="w">${esc(w.w)}</span> <span class="pos small">${esc(w.pos||'')}</span></span><span class="li-sub">${esc(note || w.d)}</span></span>${dim(lvl(id))}</button>`;
}
function lessonNotes(id){ // ref notes attached to the word anywhere
  const notes = []; for(const c of CKEYS) for(const L of lessonsOf(c)) for(const it of L.items) if(it.id === id && it.note) notes.push({c, n:L.n, note:it.note});
  return notes;
}
function notebookPage(w, opts){
  opts = opts || {};
  const b = lvl(w.id);
  const rs = rootsByWord[w.id] || [];
  const notes = lessonNotes(w.id);
  const parts = [];
  parts.push(`<div><div class="lbl">Meaning</div><p class="def">${esc(w.d)}</p>${w.d2 && w.d2 !== w.d ? `<p class="small muted" style="margin-top:4px">Also: ${esc(w.d2)}</p>`:''}</div>`);
  if(w.ex) parts.push(`<div><div class="lbl">In a sentence</div><p class="ex">${esc(w.ex)}</p></div>`);
  if(w.ety) parts.push(`<div><div class="lbl">Word story</div><p>${esc(w.ety)}</p>${w.ety2?`<p style="margin-top:6px">${esc(w.ety2)}</p>`:''}</div>`);
  if(w.pic || w.hook) parts.push(`<div class="hook"><span class="note">Picture it</span>${w.pic?`<p><span class="picchip">${esc(w.pic)}</span></p>`:''}${w.hook?`<p>${esc(w.hook)}</p>`:''}</div>`);
  if(w.tip) parts.push(`<div class="tipbox"><span class="note">Usage tip</span><p>${esc(w.tip)}</p></div>`);
  if(w.rel && w.rel.length && !opts.compact) parts.push(`<div><div class="lbl">Word family</div>${w.rel.map(r => `<p class="small">${esc(r)}</p>`).join('')}</div>`);
  if(notes.length && !opts.compact) parts.push(`<div><div class="lbl">Seen in</div>${notes.map(n => `<p class="small">${esc(n.note)}</p>`).join('')}</div>`);
  if((w.syn && w.syn.length) || (w.ant && w.ant.length)) parts.push(`<div class="fieldset">${w.syn && w.syn.length ? `<div><div class="lbl">Similar</div><p>${esc(w.syn.join(' · '))}</p></div>`:''}${w.ant && w.ant.length ? `<div><div class="lbl">Opposite</div><p>${esc(w.ant.join(' · '))}</p></div>`:''}</div>`);
  if(rs.length && !opts.compact) parts.push(`<div><div class="lbl">Roots</div>${rs.map(r => `<p><b>${esc(r.r)}</b> = ${esc(r.m)} <span class="muted small">(keyword: ${esc(r.key)})</span></p>`).join('')}</div>`);
  return `<article class="page wide"><div class="page-in"><div class="cornell">
    <div class="hw-col"><h2 class="headword ${hwSize(w.w)}">${highlightRoots(w)}</h2><p class="pos">${esc(w.pos||'')}</p>${w.pr?`<p class="pron" aria-label="Pronunciation">${esc(w.pr)}</p>`:''}<div class="row" style="gap:8px">${sayBtn(w.w)}</div>
      <div class="row small muted" style="gap:8px">${dim(b)}<span>${LEVELS[b]}</span></div></div>
    <div class="fieldset">${parts.join('')}</div></div></div></article>`;
}

function connectPair(){ const pool = startedIds().length >= 4 ? startedIds() : ORDER.both.slice(0,40); const h = hash(today() + ':' + pairSeed); const a = pool[h % pool.length]; let b = pool[(h >>> 8) % pool.length]; if(b === a) b = pool[(pool.indexOf(a)+1) % pool.length]; return [a,b]; }

function wordListHTML(){

}

}

function cardsSummary(){

function relearned(id){ const e = S.w[id]; if(!e) return; e.b = Math.max(1, e.b); e.d = addDays(today(), 1); e.t = Date.now(); touchDay(false); persist(); }
function cardAnswer(ok){
  const s = SESS; const id = s.queue.shift();
  const first = !s.again.has(id);
  if(first){ s.done++; if(ok) s.got++; grade(id, ok); }
  else if(ok){ relearned(id); }

/* ---------- quiz ---------- */
let QZ = null;
function blankFor(w){
  if(!w.ex) return null; const ex = w.ex; const low = ex.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const head = w.w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  let i = low.indexOf(head), len = head.length;
  if(i < 0){ const first = head.split(/[ -]/)[0]; if(head.includes(' ')) return null; const stem = first.slice(0, Math.max(4, Math.min(first.length - 2, 6))); i = low.indexOf(stem); if(i < 0) return null; len = stem.length; }
  let st = i; while(st > 0 && /[a-z]/i.test(ex[st-1])) st--;
  let en = i + len; while(en < ex.length && /[a-zà-ÿ]/i.test(ex[en])) en++;
  return {before: ex.slice(0, st), after: ex.slice(en), answer: ex.slice(st, en)};
}
function distractors(id, n, pool){
  const w = W[id]; const p0 = (w.pos||'').split(/[ /]/)[0];
  let cands = shuffle((pool && pool.length > 12 ? pool : DATA.words.map(x => x.id)).filter(x => x !== id && W[x].d !== w.d && norm(W[x].w) !== norm(w.w)));
  const same = cands.filter(x => (W[x].pos||'').split(/[ /]/)[0] === p0);
  const out = same.slice(0, n); for(const x of cands){ if(out.length >= n) break; if(!out.includes(x)) out.push(x); }
  if(out.length < n){ for(const x of shuffle(DATA.words.map(x => x.id))){ if(out.length >= n) break; if(x !== id && !out.includes(x)) out.push(x); } }
  return out;
}
function startQuiz(ids, title){
  ids = ids.filter(id => W[id]);
  if(ids.length < 1){ toast('Start a few words first, then quiz yourself.'); return; }
  const pick = shuffle(ids).sort((a,b) => (S.w[a]?S.w[a].b:0) - (S.w[b]?S.w[b].b:0)).slice(0, 10);
  const qs = shuffle(pick).map(id => {
    const types = ['def','word']; if(blankFor(W[id])) types.push('blank','blank');
    const t = types[Math.floor(Math.random()*types.length)];
    const opts = shuffle([id].concat(distractors(id, 3, ids)));
    return {id, t, opts};
  });
  QZ = {title, qs, i:0, score:0, picked:null, wrong:[]};
  go('quiz', {}, false);
}
VIEWS.quiz = function(){
  const z = QZ; if(!z) return '';
  if(z.i >= z.qs.length) return quizSummary();
  const q = z.qs[z.i], w = W[q.id];
  let prompt = '';
  if(q.t === 'def') prompt = `<p class="eyebrow">What does it mean?</p><p class="q"><span class="w">${esc(w.w)}</span> <span class="pos" style="font-size:1rem">${esc(w.pos||'')}</span></p>${sayBtn(w.w)}`;
  else if(q.t === 'word') prompt = `<p class="eyebrow">Which word means…</p><p class="q">${esc(w.d)}</p>`;
  else { const b = blankFor(w); prompt = `<p class="eyebrow">Fill the gap</p><p class="q" style="font-weight:400;font-family:var(--f-head)">${esc(b.before)}<span class="blank">_____</span>${esc(b.after)}</p>`; }
  const answered = z.picked !== null;
  const opts = q.opts.map((o,k) => {
    const cls = answered ? (o === q.id ? 'right' : (o === z.picked ? 'wrong' : '')) : '';
    const label = q.t === 'def' ? esc(trunc(W[o].d, 120)) : esc(W[o].w);
    return `<button class="opt ${q.t!=='def'?'w':''} ${cls}" data-pick="${o}" ${answered?'disabled':''}><span class="k">${k+1}</span><span>${label}</span></button>`;
  }).join('');
  const ok = z.picked === q.id;
  const fb = answered ? `<div class="feedback ${ok?'good':'bad'}"><b class="t">${ok ? 'Right.' : 'Not quite.'}</b><p><b class="w" style="font-family:var(--f-head)">${esc(w.w)}</b>: ${esc(w.d)}</p>${w.pic?`<p class="small"><span class="picchip">${esc(w.pic)}</span>${esc(w.hook||'')}</p>`: (w.ety?`<p class="small muted">${esc(trunc(w.ety,200))}</p>`:'')}<div class="row"><button class="btn btn-primary" data-act="qnext" data-autofocus>${z.i+1 < z.qs.length ? 'Next question' : 'See results'}</button></div></div>` : '';
  return `<div class="sess"><div class="sess-top"><button class="iconbtn" data-act="end" aria-label="End quiz">${I.close}</button><div class="prog"><span style="width:${Math.round(z.i/z.qs.length*100)}%"></span></div><span class="count">${z.i+1}/${z.qs.length}</span></div>
    <div style="display:grid;gap:10px">${prompt}</div><div class="opts">${opts}</div>${fb}</div>`;
};
function quizPick(o){
  const z = QZ; if(z.picked !== null) return; z.picked = o; const q = z.qs[z.i]; const ok = o === q.id;
  if(ok) z.score++; else z.wrong.push(q.id);
  const e = S.w[q.id];
  if(e && e.b){ if(!ok) grade(q.id, false); else if(e.d <= today()) grade(q.id, true); else { e.t = Date.now(); touchDay(false); persist(); } }
  else if(ok){ grade(q.id, true); } else { touchDay(false); persist(); }
  render();
}
function quizSummary(){
  const z = QZ; const n = z.qs.length;
  return `<div class="sess"><div class="summary card"><p class="eyebrow">${esc(z.title)} · results</p><p class="big">${z.score}/${n}</p><p>${z.score === n ? 'A perfect round.' : z.score >= n*0.7 ? 'Strong round.' : 'Keep at it — misses come back in your reviews.'}</p>
    ${z.wrong.length ? `<div><div class="lbl">To look at again</div>${z.wrong.map(id => `<p><button class="linkbtn" data-word="${id}">${esc(W[id].w)}</button> <span class="muted small">— ${esc(trunc(W[id].d,70))}</span></p>`).join('')}</div>` : ''}
