<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jàng Wolof</title>
<meta name="description" content="Apprendre et mémoriser le wolof : flashcards à répétition espacée, leçons, quiz et suivi de progression. Fonctionne hors ligne.">
<meta name="theme-color" content="#16233B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1420" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jàng Wolof">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="../lm.css">
</head>
<body>
<div class="weave" aria-hidden="true"></div>
<div class="app">
  <header class="top">
    <a class="lm-home lm-sb" href="../index.html" aria-label="Language Mastery" title="Language Mastery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg></a><a class="lm-home lm-mem lm-sb2" href="../memory/index.html?l=wo" aria-label="Memory Method" title="Memory Method"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg></a>
    <div><div class="brand">Jàng <span>Wolof</span></div><div class="sync" id="sync" data-s="local">Enregistré sur cet appareil</div></div>
    <button class="icon-btn" id="b-settings" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
  </header>
  <main>
    <div class="view" id="v-home"></div>
    <div class="view" id="v-decks" hidden></div>
    <div class="view" id="v-lessons" hidden></div>
    <div class="view" id="v-stats" hidden></div>
  </main>
</div>

<nav class="nav" aria-label="Navigation"><div class="nav-in">
  <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Aujourd'hui</button>
  <button data-tab="decks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="6" y="3" width="13" height="16" rx="2"/><path d="M3 7v12a2 2 0 002 2h11"/></svg>Paquets</button>
  <button data-tab="lessons"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 5h7a2 2 0 012 2v13a2 2 0 00-2-2H3zM21 5h-7a2 2 0 00-2 2v13a2 2 0 012-2h7z"/></svg>Leçons</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>Progrès</button>
</div></nav>

<div class="study" id="study" hidden role="dialog" aria-label="Séance d'étude">
  <div class="study-top">
    <button class="icon-btn" id="study-close" aria-label="Quitter la séance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="prog"><div id="prog-bar"></div></div><span id="prog-txt"></span>
  </div>
  <div class="study-mid"><div class="card" id="card" aria-live="polite"></div></div>
  <div class="actions" id="actions"></div>
</div>

<div class="sheet" id="sheet" hidden><div class="sheet-in" role="dialog" aria-modal="true">
  <div class="sheet-grip"><button class="icon-btn" id="sheet-close" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="sheet-body"></div>
</div></div>
<div class="toast" id="toast" hidden role="status"></div>
<div class="update" id="update" hidden role="status"><span>Une nouvelle version de l'app est prête.</span><button class="btn primary small" id="b-update">Mettre à jour</button></div>
<noscript><p style="padding:16px">Active JavaScript pour utiliser Jàng Wolof.</p></noscript>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
