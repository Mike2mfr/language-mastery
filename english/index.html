[{"c":"va","n":49}]},{"id":"faineant","w":"faineant","pos":"noun / adjective","d":"an idler; lazy and good for nothing","ex":"Her faineant son refused to look for work.","ety":"French fait-néant, does nothing.","syn":["idler","sluggard","lazybones","indolent","otiose","slothful"],"pr":"FAY-nee-unt","tip":"Elster prefers the anglicized FAY-nee-unt over the French fay-nay-AHN.","rel":["faineance — idleness","lackadaisical — listless (no 'lax' in it)"],"src":[{"c":"va","n":49}]},{"id":"hispid","w":"hispid","pos":"adjective","d":"covered with stiff, bristly hairs","ex":"The caterpillar's hispid back stung his fingers.","ety":"Latin hispidus, shaggy, bristly.","syn":["bristly","shaggy","hirsute","prickly"],"ant":["glabrous","smooth","bald"],"pr":"HIS-pid","tip":"(This track is blank on your drive; entry written from the standard meaning.)","src":[{"c":"va","n":49}]},{"id":"longanimity","w":"longanimity","pos":"noun","d":"long-suffering patience under hardship","ex":"She bore her long illness with remarkable longanimity.","ety":"Latin longus (long) + animus (spirit).","syn":["forbearance","patience","endurance","fortitude","stoicism"],"pr":"long-guh-NIM-i-tee","src":[{"c":"va","n":49}]},{"id":"sciolist","w":"sciolist","pos":"noun","d":"a person with only superficial knowledge who pretends to know more","ex":"The sciolist bluffed his way through the wine tasting.","ety":"Latin sciolus, a smatterer; scire, to know.","syn":["dilettante","dabbler","charlatan","poseur","know-it-all"],"pr":"SY-uh-list","tip":"'A little learning is a dangerous thing.'","rel":["sciolism — superficial knowledge"],"src":[{"c":"va","n":49}]},{"id":"propinquity","w":"propinquity","pos":"noun","d":"nearness in place, time or relationship","ex":"Propinquity, more than passion, explains many office romances.","ety":"Latin propinquus, near.","syn":["proximity","closeness","kinship","adjacency"],"ant":["remoteness","distance"],"pr":"pruh-PING-kwi-tee","tip":"Proximity is simple nearness; propinquity implies close neighborhood or kinship.","src":[{"c":"va","n":49}]},{"id":"plexiform","w":"plexiform","pos":"adjective","d":"complicated and intricate, like a network","ex":"The novel's plexiform plot required a chart of characters.","ety":"From plexus (a network of nerves or vessels) + form.","syn":["intricate","complex","labyrinthine","reticulate"],"pr":"PLEK-suh-form","rel":["plexus — a network, as the solar plexus"],"src":[{"c":"va","n":49}]},{"id":"susurrus","w":"susurrus","pos":"noun","d":"a soft whispering or rustling sound","ex":"A susurrus passed through the audience as the lights dimmed.","ety":"Latin susurrare, to whisper.","syn":["whisper","murmur","rustle","susurration"],"pr":"soo-SUR-us","rel":["susurrate — to whisper","susurrant — softly murmuring"],"src":[{"c":"va","n":49}]},{"id":"triturate","w":"triturate","pos":"verb","d":"to grind into a fine powder","ex":"The pharmacist triturated the tablets with a mortar and pestle.","ety":"Latin triturare, to thresh, grind.","syn":["pulverize","grind","comminute","levigate","crush"],"pr":"TRICH-uh-rayt","rel":["trituration — grinding to powder"],"src":[{"c":"va","n":49}]},{"id":"crepitate","w":"crepitate","pos":"verb","d":"to crackle, snap or pop","ex":"Logs crepitated in the fireplace.","ety":"Latin crepitare, to crackle — also decrepit (with creaking bones).","syn":["crackle","snap","pop","sputter"],"pr":"KREP-i-tayt","rel":["crepitant — crackling","crepitation — crackling (in medicine, the grating of broken bone ends)"],"src":[{"c":"va","n":50}]},{"id":"noctivagant","w":"noctivagant","pos":"adjective","d":"wandering at night","ex":"Owls and noctivagant revelers had the streets to themselves.","ety":"Latin nox (night) + vagari (to wander) — also vague, vagabond, vagary.","pr":"nahk-TIV-uh-gunt","rel":["noctivagation — wandering at night","vagary — an unpredictable whim or event"],"src":[{"c":"va","n":50}]},{"id":"fuliginous","w":"fuliginous","pos":"adjective","d":"sooty or smoky; figuratively, murky and obscure","ex":"They met in a fuliginous back room of the bar.","ety":"Latin fuligo, soot.","syn":["sooty","smoky","murky","dusky","caliginous"],"ant":["bright","clear","limpid"],"pr":"fyoo-LIJ-uh-nus","src":[{"c":"va","n":50}]},{"id":"hortatory","w":"hortatory","pos":"adjective","d":"urging or encouraging; giving earnest advice","ex":"The coach's hortatory halftime speech fired up the team.","ety":"Latin hortari, to urge — also exhort.","syn":["exhortative","encouraging","admonitory","didactic"],"pr":"HOR-tuh-tor-ee","rel":["exhort — to urge earnestly","exhortation — an urging speech"],"src":[{"c":"va","n":50}]},{"id":"heliolatry","w":"heliolatry","pos":"noun","d":"sun worship","ex":"Every summer the beach fills with devotees of heliolatry.","ety":"Greek helios (sun) + latreia (worship).","pr":"hee-lee-AHL-uh-tree","rel":["heliolater — a sun worshiper","heliocentric — sun-centered","heliotropism — a plant's turning toward light"],"src":[{"c":"va","n":50}]},{"id":"sciamachy","w":"sciamachy","pos":"noun","d":"shadowboxing; fighting an imaginary enemy","ex":"The debate was sciamachy: each side attacked positions no one held.","ety":"Greek skia (shadow) + mache (battle).","pr":"sy-AM-uh-kee","rel":["logomachy — a battle of words","theomachy — a battle of gods","gigantomachy — a war of giants"],"src":[{"c":"va","n":50}]},{"id":"glabrous","w":"glabrous","pos":"adjective","d":"smooth and hairless","ex":"The cactus is glabrous, unlike its fuzzy cousin.","ety":"Latin glaber, bald, smooth.","syn":["smooth","hairless","bald"],"ant":["hispid","hirsute","pubescent"],"pr":"GLAY-brus","tip":"Chiefly a biology term, but fun elsewhere.","src":[{"c":"va","n":50}]},{"id":"pettifogger","w":"pettifogger","pos":"noun","d":"a petty, tricky, unscrupulous lawyer","ex":"The pettifogger dragged out the case over a $40 fence.","syn":["shyster","ambulance chaser","quibbler"],"pr":"PET-ee-fahg-ur","rel":["pettifog — to quibble or use legal trickery","pettifoggery — chicanery"],"src":[{"c":"va","n":50}]},{"id":"epicene","w":"epicene","pos":"adjective","d":"having characteristics of both sexes, or of neither; sexless","ex":"The model's epicene look blurred the line between menswear and womenswear.","ety":"Greek epikoinos, common to both.","syn":["androgynous","sexless","neuter","unisex"],"pr":"EP-i-seen","tip":"Applied to style, it can be disparaging: weak, feeble.","src":[{"c":"va","n":50}]}],"lessons":{"ttc":[{"n":1,"title":"Five Principles for Learning Vocabulary","idea":"Word knowledge grows like a dimmer switch, not an on/off switch: it takes many encounters in different contexts. Learn each word with five tools — a clear definition, a real context sentence, a personal connection, its morphology (roots and affixes), and semantic chunking (studying related words together instead of alphabetical lists).","tips":["Rate words 1–4: never seen it · heard it · recognize it when reading · can use it myself.","Connect every new word to someone or something you know (the 'new-to-known' link).","Break words into roots: fac (make/do, as in factory) + totum (all) = factotum.","Group words by meaning so you can find them again — avoid the 'mental junk drawer'."],"roots":[],"items":[{"id":"gnarled"},{"id":"factotum"},{"id":"procrustean"},{"id":"decimate"},{"id":"kerfuffle"},{"id":"semantic-chunking"},{"id":"etymology"},{"id":"morphology"}]},{"n":2,"title":"The Spelling-Meaning Connection","idea":"About 70% of English words (and over 90% of scientific words) are built from Greek and Latin parts. Words related in spelling are often related in meaning, even when the sound changes — so silent letters are clues, not mistakes. Learn one root and you unlock ten words.","tips":["Silent letters point to relatives: health → heal, column → columnist, hymn → hymnal, crumb → crumble, resign → resignation.","Keep a vocabulary notebook organized by topic, with a narrow word column and a wide notes column (Cornell style).","For each word: definition, your own sentence, a personal connection or sketch, and its roots."],"roots":[{"r":"fac / fact","m":"make, do","key":"factory","ex":["fact","manufacture","facsimile","benefactor","artifact","facilitate","factitious"]},{"r":"sign","m":"mark, sign","key":"signature","ex":["resign","design","insignia","signal","significant","signatory"]},{"r":"spect","m":"look, see","key":"spectacles","ex":["inspector","spectator","speculate","retrospect","introspection","spectrum","circumspect"]},{"r":"circum","m":"around","key":"circle","ex":["circumference","circumnavigate","circumspect"]},{"r":"manu","m":"hand","key":"manual","ex":["manufacture","manuscript","manicure"]}],"items":[{"id":"factitious"},{"id":"facetious"},{"id":"circumspect"},{"id":"receptive-vocabulary"},{"id":"orthography"},{"id":"affix"}]},{"n":3,"title":"Words for Lying, Swindling, and Conniving","idea":"A family of words for cheats and their tricks: fake experts, clever-but-dishonest arguers, false claims, unverifiable tales, cheap substitutes and shady schemes. Learn the shades of difference — no two 'synonyms' mean exactly the same thing.","tips":["Related-word strategy: link a new word to one you know with the same spelling — sophist ↔ sophomore.","Learn collocates (words that usually go together): specious argument, spurious charges, political machinations.","Use a new word several times in the next 2–3 days, and watch for it 'out in the world'."],"roots":[{"r":"soph","m":"wise, clever","key":"sophomore ('wise fool')","ex":["sophist","sophistry","sophisticated","philosophy"]},{"r":"spec","m":"look, appearance","key":"spectacles","ex":["specious","spectacle","inspect"]}],"items":[{"id":"mountebank"},{"id":"sophist"},{"id":"specious"},{"id":"spurious"},{"id":"apocryphal"},{"id":"ersatz"},{"id":"skulduggery"},{"id":"machinations"},{"id":"hornswoggle"}]},{"n":4,"title":"Words That Express Annoyance and Disgust","idea":"Words for three kinds of people and things we all meet: the annoying (gadflies and complainers), the sickly sweet (maudlin, mawkish, treacle) and the offensive (scabrous, noisome). Plus a 'skunked' word whose meaning is in dispute right now.","tips":["Similar-looking words can have different roots: querulous (complain → quarrel) is not related to query (ask → question).","Noisome has nothing to do with noise — it's related to annoy.","Avoid 'skunked terms' (words in mid-shift, like fulsome) when you need to be understood precisely."],"roots":[{"r":"ques / quir / quer","m":"ask, seek","key":"question","ex":["query","inquire","inquiry","request","quest"]},{"r":"naus / nau / nav","m":"ship","key":"nautical","ex":["nausea","astronaut","Argonaut","navy","navigate"]}],"items":[{"id":"gadfly"},{"id":"querulous"},{"id":"maudlin"},{"id":"mawkish"},{"id":"treacle"},{"id":"scabrous"},{"id":"noisome"},{"id":"fulsome"},{"id":"nudnik"}]},{"n":5,"title":"Fighting Words and Peaceful Words","idea":"English has a rich scale of words for conflict — from a mild spat to a full-scale donnybrook — plus words for aggressive people and, on the other side, words for peace and calm. Two Latin roots anchor the lecture: bell (war) and pac (peace).","tips":["Sort fight words into three folders: serious brawls (melee, donnybrook, fracas), small scuffles (scrap, tussle, dust-up), and confused commotions (kerfuffle, imbroglio, brouhaha, hullabaloo, hurly-burly).","Move words from receptive to expressive vocabulary by actually saying them: 'That meeting caused quite a kerfuffle.'"],"roots":[{"r":"bell","m":"war","key":"rebellion","ex":["bellicose","belligerent","antebellum","postbellum","rebel"]},{"r":"pac / pax","m":"peace","key":"pacifier","ex":["pacify","pacifist","Pacific","Pax Romana"]},{"r":"ante-","m":"before","key":"antebellum","ex":["antecedent","anteroom"]},{"r":"post-","m":"after","key":"postpone","ex":["postbellum","postscript","postwar"]}],"items":[{"id":"donnybrook"},{"id":"imbroglio"},{"id":"bellicose"},{"id":"truculent"},{"id":"contumacious"},{"id":"rapacious"},{"id":"halcyon"},{"id":"quiescent"},{"id":"propitiate"},{"id":"mollycoddle"}]},{"n":6,"title":"Going beyond Dictionary Meanings","idea":"A definition is only the tip of the iceberg — about 10% of what it means to know a word. To go deeper: use the word's roots first, then a word-part memory trick if needed; map the word in a four-square (definition · synonyms · examples · non-examples); practice by connecting words in sentences; and use one new word in conversation each day. Little and often beats cramming — 'the law of the farm'.","tips":["Word-part connection: say the word, spot a part that jumps out, link it to the meaning (castigate → you cast criticism at someone).","Four-square map: definition | synonyms — your examples | non-examples (add boxes for a picture and the roots).","Connect Two: pick two words and use both in one sentence. Feeling bold? Connect three.","Use-it-or-lose-it challenge: slip one target word into a real conversation every day."],"roots":[{"r":"loc / loqu","m":"speak","key":"elocution","ex":["circumlocution","eloquent","loquacious","interlocutor"]},{"r":"mal-","m":"bad, evil","key":"malfunction","ex":["malefactor","malicious","malign","malady"]}],"items":[{"id":"castigate"},{"id":"toothsome"},{"id":"captious"},{"id":"circumlocution"},{"id":"mnemonic"},{"id":"malefactor"}]},{"n":7,"title":"Wicked Words","idea":"One little prefix — mal (bad, evil) — unlocks at least sixteen words, from malfunction to malfeasance. Its opposite, bene (good), gives us benefactor and benediction. The lecture ends with tricky look-alike pairs: venal vs. venial, insidious vs. invidious.","tips":["Silent–sounded pairs: malign (silent g) ↔ malignant (sounded g) — the spelling shows the family.","-ous means 'full of' (malodorous = full of bad smell); -or means 'one who' (doctor, author, malefactor).","Use spelling hooks for confusable pairs: insidious looks like INSIDE; invidious contains NV — envy."],"roots":[{"r":"mal-","m":"bad, badly, evil","key":"malfunction","ex":["malpractice","malodorous","malign","malignant","malevolent","malice","malware","malcontent","maladroit","malinger","malefactor","malediction","malfeasance","malaise"]},{"r":"bene-","m":"good, well","key":"benefit","ex":["benediction","benefactor","benign","benevolent"]},{"r":"dic / dict","m":"say, speak","key":"dictionary","ex":["dictate","dictator","diction","malediction","benediction","predict"]},{"r":"ven","m":"sell, for sale","key":"vending machine","ex":["vendor","venal"]}],"items":[{"id":"malediction"},{"id":"malcontent"},{"id":"malaise"},{"id":"maladroit"},{"id":"malefactor"},{"id":"malfeasance"},{"id":"malinger"},{"id":"venal"},{"id":"venial"},{"id":"insidious"},{"id":"invidious"},{"id":"turpitude"},{"id":"snollygoster"}]},{"n":8,"title":"Words for Beginnings and Endings","idea":"Words for things just starting (nascent, inchoate), for inexperienced people (callow, tyro, ingenue, dilettante, puerile) and for things dying out (moribund). Plus a spelling secret: absorbed prefixes — why immortal has two m's.","tips":["Absorbed prefixes: in- (not) changes to match the next letter — im+mortal, ir+rational, il+logical — which is why those words have double letters.","Nascent stresses growth and promise; inchoate stresses what's still missing or disorganized.","A tyro is simply a beginner; a dilettante is a dabbler who pretends to know more."],"roots":[{"r":"nasc / nat","m":"be born","key":"nativity","ex":["nascent","natal","prenatal","neonatal","innate","native","nation"]},{"r":"mort / mori","m":"death, die","key":"mortal","ex":["immortal","mortality","mortuary","postmortem","mortify","rigor mortis","moribund"]},{"r":"in- / im- / ir- / il-","m":"not","key":"incorrect","ex":["immature","immodest","immovable","irregular","irrelevant","illegal","illegible","illiterate"]}],"items":[{"id":"nascent"},{"id":"inchoate"},{"id":"callow"},{"id":"dilettante"},{"id":"tyro"},{"id":"ingenue"},{"id":"puerile"},{"id":"moribund"},{"id":"neophyte"}]},{"n":9,"title":"Words Expressing Fear, Love, and Hatred","idea":"Phobias are 'gateway roots': every fear word teaches another Greek root (xeno, agora, gloss, acro, log, pan). Then love roots (phil, amor), hate roots (miso), and words for passionate denunciation.","tips":["Don't confuse the two 'mis' parts: Greek mis/miso = hate (misanthrope, misogyny); English mis- = wrongly (misspell, mistrust).","Use related words to anchor roots: acro = high → acrobat, Acropolis; gloss/glot = tongue → polyglot."],"roots":[{"r":"phob","m":"fear","key":"phobia","ex":["xenophobia","agoraphobia","glossophobia","acrophobia","claustrophobia","arachnophobia","triskaidekaphobia"]},{"r":"xeno","m":"strange, foreign","key":"xenon ('strange gas')","ex":["xenophobia","xenophobe"]},{"r":"gloss / glot","m":"tongue, language","key":"polyglot","ex":["glossophobia","glossary","glottis","glottal"]},{"r":"acro","m":"high, top, tip","key":"acrobat","ex":["acrophobia","Acropolis","acronym"]},{"r":"log","m":"word, reason, speech","key":"logic","ex":["monologue","prologue","logophobia","dialogue"]},{"r":"pan","m":"all","key":"Pan-American","ex":["panacea","panoply","panorama","pandemic"]},{"r":"phil","m":"love, friendship","key":"Philadelphia","ex":["philosophy","philharmonic","bibliophile","anglophile","francophile","oenophile","philatelist"]},{"r":"amor","m":"love","key":"amorous","ex":["enamored","paramour"]},{"r":"mis / miso","m":"hate","key":"misanthrope","ex":["misogyny","misandry"]},{"r":"anthrop","m":"human being","key":"anthropology","ex":["misanthrope","philanthropy"]}],"items":[{"id":"xenophobia"},{"id":"agoraphobia"},{"id":"glossophobia"},{"id":"acrophobia"},{"id":"panacea"},{"id":"panoply"},{"id":"oenophile"},{"id":"philatelist"},{"id":"canoodle"},{"id":"misanthrope"},{"id":"execrate"},{"id":"anathema"}]},{"n":10,"title":"Words for the Everyday and the Elite","idea":"Three shades of dull (insipid, vapid, prosaic), words for the everyday and the overused (quotidian, hoi polloi, banal, bromide), and words for the elite (patrician, nonpareil).","tips":["Insipid = dull from lack of flavor or interest; vapid = dull from lack of life and spirit; prosaic = dull from lack of imagination (or simply ordinary).","Hoi polloi means the common people — not the snobs ('hoity-toity'). Saying 'the hoi polloi' is accepted usage."],"roots":[{"r":"di / dies","m":"day","key":"diary","ex":["quotidian","diurnal","meridian"]},{"r":"poly","m":"many","key":"polygon","ex":["hoi polloi","polyglot","polygamy"]},{"r":"pater / patr","m":"father","key":"paternal","ex":["patrician","paternity","patriarch","patriot"]}],"items":[{"id":"insipid"},{"id":"vapid"},{"id":"prosaic"},{"id":"quotidian"},{"id":"hoi-polloi"},{"id":"banal"},{"id":"bromide"},{"id":"patrician"},{"id":"nonpareil"},{"id":"hackneyed"}]},{"n":11,"title":"Words from Gods and Heroes","idea":"Myths survive because their stories still matter — and they left us vivid words. Each word below carries a whole story: a boulder that always rolls back, a sword on a single hair, an impossible knot, a quicksilver messenger god, a festive and a gloomy Saturn, and the Titan who stole fire.","tips":["Learn the story and the word sticks: retell the myth in one sentence in your notebook and sketch it (a boulder, a sword, a knot).","Myth words are often capitalized: Sisyphean, Herculean, Promethean."],"roots":[],"items":[{"id":"sisyphean"},{"id":"herculean"},{"id":"sword-of-damocles"},{"id":"gordian-knot"},{"id":"mercurial"},{"id":"saturnalia"},{"id":"saturnine"},{"id":"promethean"}]},{"n":12,"title":"Humble Words and Prideful Words","idea":"Words for excessive pride (supercilious, bumptious, hubris), for inflated talk (bombast, bloviate), and for fake humility and sucking up (sycophant, obsequious, wheedle, blandishments, unctuous). 'Humble' itself comes from humus, earth — humble people are down to earth.","tips":["Supercilious = cold, eyebrow-raising disdain; bumptious = loud, pushy arrogance.","Choose the right 'wordy' word: verbose/prolix = too many words; flowery/florid = too ornate; pretentious = inflated to impress; orotund = booming (good for a voice, bad for prose)."],"roots":[{"r":"super-","m":"above, beyond","key":"superior","ex":["supervisor","superabundance","supercilious"]},{"r":"sequ / sec","m":"follow","key":"sequence","ex":["sequel","consecutive","consequence","subsequent","persecute","second","sect","non sequitur","obsequious"]},{"r":"hum","m":"earth, ground","key":"humus","ex":["humble","humility","humiliate","exhume"]}],"items":[{"id":"supercilious"},{"id":"bumptious"},{"id":"hubris"},{"id":"bombast"},{"id":"bloviate"},{"id":"sycophant"},{"id":"obsequious"},{"id":"wheedle"},{"id":"blandishments"},{"id":"unctuous"},{"id":"orotund"}]},{"n":13,"title":"High-Frequency Greek and Latin Roots","idea":"Latin and Greek aren't dead — they live inside 70% of English words. Turn on your 'morphological radar': spot common prefixes (eu-, dis-, in-, dys-, pre-, post-) and roots (man, umbr, tract, therm) and you can unlock unfamiliar words like prescient, manumit and adumbrate.","tips":["You don't need to memorize every root — just start looking for them. You can always look up a part once you've spotted it.","Latin dis- = not, apart, away (disagree, discard); Greek dys- = bad, difficult (dysfunctional, dystopia, dyslexia)."],"roots":[{"r":"eu-","m":"good, well, pleasant","key":"eulogy","ex":["euphemism","euphonious","eugenics","euthanasia"]},{"r":"dis-","m":"not, opposite, apart, away","key":"disagree","ex":["discard","dishabille","distract"]},{"r":"dys-","m":"bad, abnormal, difficult","key":"dysfunctional","ex":["dystopia","dyslexia","dysentery"]},{"r":"pre- / post-","m":"before / after","key":"preview / postgame","ex":["prescient","premature","prefix","postmortem"]},{"r":"man / manu","m":"hand","key":"manicure","ex":["manual","manufacture","manipulate","manacle","manuscript","manumit","emancipate","manure"]},{"r":"mit / miss","m":"send, let go","key":"transmit","ex":["manumit","manumission","emit","dismiss"]},{"r":"umbr","m":"shade, shadow","key":"umbrella","ex":["umbra","penumbra","sombrero","somber","umbrage","adumbrate"]},{"r":"tract","m":"pull, drag, draw","key":"tractor","ex":["attract","distract","extract","retract","traction","intractable"]},{"r":"therm","m":"heat, temperature","key":"thermometer","ex":["thermal","hypothermia","hyperthermia","thermodynamics","geothermal","thermos"]},{"r":"hypo- / hyper-","m":"under, below / over, beyond","key":"hypothermia / hyperactive","ex":["hypodermic","hyperbole"]}],"items":[{"id":"prescient"},{"id":"manumit"},{"id":"adumbrate"},{"id":"umbrage"},{"id":"ineluctable"},{"id":"ineffable"},{"id":"euphemism"},{"id":"euphonious"}]},{"n":14,"title":"Words Relating to Belief and Trust","idea":"Words for arrogant belief (dogmatic, pontificate), for abandoning belief (apostate), for propaganda (agitprop), and for people you can't trust (perfidious, equivocal, dissemble). Two Latin roots anchor it all: fid (faith, trust) and cred (believe).","tips":["Ambiguous = unclear, possibly by accident; equivocal = deliberately vague to mislead; ambivalent = having mixed feelings.","Portmanteau words blend two words: smoke + fog = smog; agitation + propaganda = agitprop."],"roots":[{"r":"fid","m":"faith, trust","key":"Fido (the faithful dog)","ex":["fidelity","confident","infidelity","infidel","affidavit","bona fide","diffident","perfidious"]},{"r":"cred","m":"believe","key":"credible","ex":["incredible","credit","credentials","accredited","credulous","incredulous"]},{"r":"equ","m":"equal","key":"equality","ex":["equator","equilibrium","equidistant","equivocal"]},{"r":"voc / vok","m":"call, voice","key":"vocal","ex":["vociferous","revoke","equivocal","advocate"]},{"r":"ambi-","m":"both","key":"ambidextrous","ex":["ambiguous","ambivalent"]}],"items":[{"id":"dogmatic"},{"id":"pontificate"},{"id":"apostate"},{"id":"agitprop"},{"id":"perfidious"},{"id":"equivocal"},{"id":"ambiguous"},{"id":"ambivalent"},{"id":"dissemble"},{"id":"diffident"},{"id":"credulous"}]},{"n":15,"title":"Words for the Way We Talk","idea":"Part one of two on speech. Words for saying very little (laconic, pithy), and a whole arsenal for negative speech: public abuse (obloquy), stirring up trouble (foment), thundering denunciations (fulminate, philippic), smears (vilify, calumny) — and the man who 'cleaned up' Shakespeare.","tips":["Laconic = brief; pithy = brief AND full of meaning.","Foment = stir up trouble (think: whip up foam); fulminate = thunder against something (Latin fulmen, lightning).","Rant family: invective, vituperation, diatribe, tirade (long), harangue (scolding), broadside."],"roots":[{"r":"loq / loc","m":"speak","key":"ventriloquist","ex":["soliloquy","loquacious","eloquent","obloquy","circumlocution"]},{"r":"ob-","m":"against","key":"objection","ex":["obloquy","obstacle","obstruct"]},{"r":"vil","m":"worthless, base","key":"vile","ex":["vilify","revile"]}],"items":[{"id":"laconic"},{"id":"pithy"},{"id":"obloquy"},{"id":"foment"},{"id":"fulminate"},{"id":"philippic"},{"id":"vilify"},{"id":"calumny"},{"id":"bowdlerize"},{"id":"loquacious"},{"id":"invective"}]},{"n":16,"title":"Words for Praise, Criticism, and Nonsense","idea":"Part two on speech: rambling (maunder), public scorn (pillory), long laments (jeremiad), playful teasing (badinage), formal and joyful praise (panegyric, paean), and a feast of words for nonsense — claptrap, bunk, palaver, pablum. English has at least forty words for nonsense!","tips":["Eponyms come from people (jeremiad, bowdlerize); toponyms come from places (bunk, from Buncombe County).","Three 'speak' roots unlock dozens of words: loq/loc, dic/dict, voc."],"roots":[{"r":"loq / loc","m":"speak","key":"ventriloquist","ex":["elocution","eloquent","colloquium","colloquial","grandiloquent","interlocutor"]},{"r":"dic / dict","m":"say, speak","key":"diction","ex":["dictate","dictionary","predict","verdict","benediction","edict","indict"]},{"r":"voc","m":"call, voice","key":"vocal","ex":["vociferous","advocate","avocation","convocation","invocation","equivocal"]},{"r":"pan","m":"all","key":"Pan-American","ex":["panegyric","pantheon","pandemic"]}],"items":[{"id":"maunder"},{"id":"pillory"},{"id":"jeremiad"},{"id":"badinage"},{"id":"panegyric"},{"id":"paean"},{"id":"claptrap"},{"id":"bunk"},{"id":"palaver"},{"id":"pablum"},{"id":"interlocutor"},{"id":"riposte"}]},{"n":17,"title":"Eponyms from Literature and History","idea":"An eponym is a word built on a person's name (Greek epi, upon + onym, name): sandwich, sideburns, bloomers. A true eponym takes on a life of its own — most people say 'sandwich' without thinking of the Earl. Here are eight memorable ones, plus a toponym (a word from a place).","tips":["Learn the person or place behind the word and the meaning follows.","Gerrymander is both an eponym and a portmanteau (Gerry + salamander)."],"roots":[{"r":"onym","m":"name","key":"synonym","ex":["eponym","toponym","antonym","pseudonym","anonymous"]},{"r":"epi-","m":"on, upon","key":"epidermis","ex":["eponym","epitaph","epilogue"]}],"items":[{"id":"draconian"},{"id":"quixotic"},{"id":"gerrymander"},{"id":"quisling"},{"id":"bedlam"},{"id":"luddite"},{"id":"billingsgate"},{"id":"malapropism"},{"id":"eponym"},{"id":"apropos"}]},{"n":18,"title":"Thinking, Teaching, and Learning Words","idea":"Our minds are pattern detectors, not tape recorders — that's why a nonsense word like 'nibberflutz' is easy to spell and a random string of the same letters isn't. This lecture gives words for reasoning (induction, deduction), explaining (exegesis), sharp thinkers (perspicacious), over-teachers (didactic, pedantic), the anti-intellectual (philistine) and deep or secret knowledge (erudite, recondite, esoteric).","tips":["Induction = bottom-up (specific cases → general rule); deduction = top-down (general rule → specific conclusion).","Didactic = preachy, over-instructive; pedantic = showing off trivial knowledge and rules.","Recondite = hard to understand because it's deep; esoteric = known only to an inner circle."],"roots":[{"r":"duc / duct","m":"lead","key":"aqueduct","ex":["deduction","induction","conduct","educate","produce"]},{"r":"ped (Greek)","m":"child","key":"pediatrician","ex":["pedagogy","pedantic"]},{"r":"ped (Latin)","m":"foot","key":"pedal","ex":["pedestal","pedicure","centipede","pedestrian"]},{"r":"gn / gno","m":"know","key":"cognition","ex":["recognize","incognito","cognizant","agnostic","diagnosis","ignorant","prognosis","prognosticate"]},{"r":"per-","m":"through","key":"perspire","ex":["perspicacious","perfidious","permeate"]}],"items":[{"id":"induction"},{"id":"deduction"},{"id":"exegesis"},{"id":"perspicacious"},{"id":"didactic"},{"id":"pedantic"},{"id":"philistine"},{"id":"erudite"},{"id":"recondite"},{"id":"esoteric"}]},{"n":19,"title":"Words for the Diligent and the Lazy","idea":"Words for hard workers (sedulous), skilled workers (facile), eager workers (alacrity) and the lazy (indolent, torpor) — plus three look-alikes that people confuse: torpid (sluggish), turbid (muddy, confused) and turgid (swollen, pompous). Finishes with the Latin and Greek roots for 'work'.","tips":["Tenacious = admirably determined; pertinacious = stubbornly, annoyingly persistent.","Facile can be a compliment (effortless skill) or a criticism (shallow, glib) — context decides.","Torpid → torpedo (numbing); turbid → turbulent; turgid → 'I URGe you not to write swollen prose'."],"roots":[{"r":"fac / fec / fic / -fy","m":"make, do","key":"factory","ex":["facile","facility","facilitate","effective","artificial","sanctify","magnify","stupefy"]},{"r":"turb","m":"confusion, turmoil, whirl","key":"turbulent","ex":["turbid","disturb","perturbed","imperturbable","turbine"]},{"r":"oper","m":"work","key":"operate","ex":["cooperate","inoperable","opus","magnum opus","opera"]},{"r":"erg","m":"work","key":"energy","ex":["erg","ergonomics","synergy","metallurgy","ergophobia"]}],"items":[{"id":"sedulous"},{"id":"facile"},{"id":"alacrity"},{"id":"indolent"},{"id":"torpor"},{"id":"torpid"},{"id":"turbid"},{"id":"turgid"},{"id":"pertinacious"},{"id":"stupefy"}]},{"n":20,"title":"Words That Break and Words That Join","idea":"Words for splitting and scattering (schism, diaspora), for gaps and openings (lacuna, maw), a word that means both (cleave), and words for linking and grouping (concatenation, cabal, coterie). Anchored by two roots: rupt (break) and junct (join).","tips":["Contronyms (or 'Janus words') are their own opposites: cleave (split / cling), buckle (fasten / collapse), bolt (lock / run).","A cabal plots in secret; a coterie is simply a close-knit group with shared interests."],"roots":[{"r":"rupt","m":"break","key":"rupture","ex":["bankrupt","disrupt","interrupt","erupt","irruption","corrupt"]},{"r":"junct / join","m":"join","key":"juncture","ex":["conjunction","junction","adjunct","conjoin"]},{"r":"schis / schiz","m":"split","key":"scissors","ex":["schism","schizophrenia"]}],"items":[{"id":"schism"},{"id":"diaspora"},{"id":"lacuna"},{"id":"maw"},{"id":"cleave"},{"id":"concatenation"},{"id":"cabal"},{"id":"coterie"},{"id":"contronym"}]},{"n":21,"title":"Some High-Utility Greek and Latin Affixes","idea":"Our minds organize words by pattern and meaning (say 'silk' three times, then answer 'what do cows drink?'). Roots give a word its core meaning, prefixes modify it, and suffixes usually set its part of speech. This lecture works with de-, ab-, the 'wash' root lu, and the suffixes -ism and -ist.","tips":["de- = remove/undo (defrost, defuse) or down/away (deflate).","ab- = away, off (absent, abnormal, abduct).","-ism = a belief or condition (capitalism); -ist = a person who does or believes (chemist, capitalist)."],"roots":[{"r":"de-","m":"remove, undo; down, away","key":"defrost / deflate","ex":["decaffeinate","defuse","denude","deluge","deduction"]},{"r":"ab-","m":"away, off","key":"absent","ex":["abnormal","abduct","abdicate","abnegate","ablution","absquatulate"]},{"r":"lu / lav / lau","m":"wash","key":"deluge","ex":["ablution","antediluvian","laundry","launder","lavatory"]},{"r":"-ism / -ist","m":"belief, doctrine / one who does or believes","key":"capitalism / capitalist","ex":["atheism","agnosticism","nihilism","solipsism","chemist"]},{"r":"theo","m":"god","key":"theology","ex":["atheism","monotheism","pantheon"]}],"items":[{"id":"denude"},{"id":"abdicate"},{"id":"abnegate"},{"id":"ablution"},{"id":"antediluvian"},{"id":"absquatulate"},{"id":"discombobulate"},{"id":"nihilism"},{"id":"solipsism"},{"id":"agnosticism"},{"id":"protean"}]},{"n":22,"title":"Cranky Words and Cool Words","idea":"Two ends of the emotional spectrum: cranks who can't control their bad temper (splenetic, fractious, asperity, importune) and the cool, who show little emotion at all (phlegmatic, stoic, stolid, inured). Several come from old medicine, which blamed moods on the spleen and on phlegm.","tips":["Phlegmatic = unemotional by nature; stoic = unemotional by self-discipline; stolid = dull, plodding and unresponsive.","Fractious people break rules; splenetic people are simply bad-tempered."],"roots":[{"r":"fract / frag","m":"break","key":"fracture","ex":["fraction","infraction","fractious","refractory","fragile","fragment"]},{"r":"asper","m":"rough, harsh","key":"exasperate","ex":["asperity"]}],"items":[{"id":"splenetic"},{"id":"fractious"},{"id":"asperity"},{"id":"importune"},{"id":"phlegmatic"},{"id":"stoic"},{"id":"stolid"},{"id":"inure"},{"id":"irascible"}]},{"n":23,"title":"Words for Courage and Cowardice","idea":"'Courage' comes from Latin cor (heart). This lecture covers enduring courage (intrepid, fortitude), scrappy courage (moxie), reckless courage (temerity), shocking boldness (chutzpah), fake courage (bravado, braggadocio) — and three words for cowards (timorous, craven, pusillanimous). Frederick Douglass, who taught himself to read in secret, is the model of intrepid fortitude.","tips":["Don't mix up temerity (reckless boldness) and timorous (timid, fearful). Timorous ↔ timid share 'tim'.","Craven rhymes with raven — remember the terrified narrator of Poe's poem.","Pusillanimous (small spirit) is the opposite of magnanimous (great spirit)."],"roots":[{"r":"cor / cord","m":"heart","key":"courage","ex":["core","cordial","encourage","discourage","discord","concord"]},{"r":"val","m":"strong, worth","key":"valor","ex":["valid","validate","invalidate","evaluate","valiant","convalescent"]},{"r":"anim","m":"spirit, mind, life","key":"animated","ex":["pusillanimous","magnanimous","animosity","unanimous"]},{"r":"tim","m":"fear","key":"timid","ex":["timorous","intimidate"]}],"items":[{"id":"intrepid"},{"id":"fortitude"},{"id":"moxie"},{"id":"temerity"},{"id":"chutzpah"},{"id":"bravado"},{"id":"braggadocio"},{"id":"timorous"},{"id":"craven"},{"id":"pusillanimous"},{"id":"magnanimous"}]},{"n":24,"title":"Reviewing Vocabulary through Literature","idea":"A review lecture: earlier target words come alive when you pin them on memorable characters — Sherlock Holmes, the Music Man, James Joyce, Wormtongue, the vets of All Creatures Great and Small. Try it yourself: when you meet a colorful character in a book, film or real life, ask which words fit them.","tips":["Character connections are powerful memory hooks: link a word to a person you'll never forget.","Learn word families on a spectrum: erudite (learned) → recondite (hard to understand) → abstruse (very hard)."],"roots":[],"items":[{"note":"Inspector Athelney Jones (The Sign of the Four) arrests the usual suspects, forcing the facts to fit his assumptions.","id":"procrustean"},{"note":"Sherlock Holmes — daringly original, eliminating the impossible to find the improbable truth.","id":"promethean"},{"note":"Holmes again: calm and unemotional, almost unmoved by people (Irene Adler impressed him with her mind, not her looks).","id":"phlegmatic"},{"note":"Molière's Alceste; or Oscar Wilde's Lord Goring: 'Other people are quite dreadful. The only possible society is oneself.'","id":"misanthrope"},{"note":"Dorothy Parker and the Algonquin Round Table — witty, snide, looking down their noses.","id":"supercilious"},{"note":"Professor Harold Hill in The Music Man, selling a whole town band instruments he can't teach.","id":"mountebank"},{"note":"James Joyce's early work (Dubliners) shows his erudition; Ulysses is recondite; Finnegans Wake is abstruse.","id":"erudite"},{"note":"Gríma Wormtongue in The Lord of the Rings — an obsequious, perfidious counselor whose blandishments poison King Théoden.","id":"sycophant"},{"note":"Siegfried Farnon in All Creatures Great and Small — preaches calm, then explodes at an ungrateful farmer.","id":"mercurial"},{"note":"Tristan Farnon — a facile mind used mainly to avoid work, usually in a state of torpor after a night at the pub.","id":"indolent"},{"note":"Tristan's carefree, devil-may-care approach to life — never querulous, never worried.","id":"insouciant"},{"id":"abstruse"},{"id":"epiphany"},{"note":"Dorothy Parker's trenchant wisecracks made her famous.","id":"trenchant"},{"note":"Harold Hill warns River City parents of the pernicious evils of the pool table.","id":"pernicious"},{"id":"surreptitious"}]},{"n":25,"title":"Words for Killing and Cutting","idea":"Naming terrible things lets us discuss — and prevent — them. This lecture explores the 'kill/cut' roots cide/cise and seg/sect, words for things ending or falling out of use (desuetude, perdition, extirpate, abrogate, fin de siècle), and the 'end' roots term and fin.","tips":["Watch for false friends: segregate, secede and sect are NOT from the 'cut' root sect.","A literal meaning often grows a figurative one: extirpate = pull up by the roots → wipe out; vivisection = dissecting a live animal → a merciless public critique."],"roots":[{"r":"cide / cise","m":"kill, cut","key":"suicide","ex":["homicide","matricide","patricide","fratricide","regicide","genocide","insecticide","herbicide","decide","incisive","incisor","incision","excise","scissors"]},{"r":"seg / sect","m":"cut","key":"segment / section","ex":["insect","intersect","bisect","transect","dissect","vivisection","sickle"]},{"r":"term","m":"end, limit","key":"terminal","ex":["terminus","terminate","exterminate","interminable"]},{"r":"fin","m":"end, boundary","key":"final","ex":["finale","finish","finite","infinite","define","fin de siècle"]}],"items":[{"id":"parricide"},{"id":"caesura"},{"id":"vivisection"},{"id":"desuetude"},{"id":"perdition"},{"id":"extirpate"},{"id":"abrogate"},{"id":"fin-de-siecle"},{"id":"incisive"},{"id":"smite"}]},{"n":26,"title":"A Vocabulary Grab Bag","idea":"Four great words that didn't fit elsewhere — Hobson's choice, stultify, frisson, detritus — then a review of earlier words. Review regularly: each time you meet a word again, the dimmer switch gets a little brighter.","tips":["Hobson's choice = take it or leave it (something or nothing). Not 'Hobbesian choice' — that's a confusion with the philosopher Hobbes.","Use the related-word strategy: detritus ↔ detriment (both from 'wear away'); frisson ↔ frigid (shiver)."],"roots":[],"items":[{"id":"hobson-s-choice"},{"id":"stultify"},{"id":"frisson"},{"id":"detritus"},{"note":"Review: a clever arguer playing fast and loose with the facts.","id":"sophist"},{"note":"Review: a generic shampoo with identical ingredients is NOT ersatz — ersatz means an inferior substitute.","id":"ersatz"},{"note":"Review: the student whining about her A-minus.","id":"querulous"},{"note":"Review: the student who refuses to hand in his exam.","id":"contumacious"},{"note":"Review: a sickly-sweet romantic film.","id":"treacle"},{"note":"Review: an aunt spoiling one niece rotten.","id":"mollycoddle"},{"note":"Review: complimenting the aunt's terrible French to win back her favor.","id":"propitiate"},{"note":"Review: spoiling for a fight at Thanksgiving dinner.","id":"truculent"}]},{"n":27,"title":"Words for Words","idea":"Part one of two on 'words for words'. Test words that reveal who you are (shibboleth), the special lingo of groups (argot, jargon), regional and everyday speech (dialect, vernacular), bridge languages (lingua franca), plus rambling talk, nicknames, very long words and sleep-talking.","tips":["Argot = a group's own lingo (soccer: boots, pitch, clean sheet); dialect = a regional or class variety (sub vs. hoagie, soda vs. pop); vernacular = everyday speech of ordinary people; jargon = specialized language that outsiders can't follow.","Sesquipedalian is itself a sesquipedalian word — a long word for long words."],"roots":[{"r":"somn","m":"sleep","key":"insomnia","ex":["somniloquy","somnambulist","somnolent"]},{"r":"cur / curr / curs","m":"run","key":"current","ex":["discursive","courier","excursion","precursor"]},{"r":"sesqui-","m":"one and a half","key":"sesquicentennial (150 years)","ex":["sesquipedalian"]}],"items":[{"id":"shibboleth"},{"id":"argot"},{"id":"dialect"},{"id":"vernacular"},{"id":"jargon"},{"id":"lingua-franca"},{"id":"discursive"},{"id":"sobriquet"},{"id":"sesquipedalian"},{"id":"somniloquy"}]},{"n":28,"title":"Specialty Words for Language","idea":"Part two on 'words for words': the categories linguists use. Slips of the tongue (spoonerism), the three confusing H-words (homophone, homograph, homonym), the -nyms (eponym, toponym, acronym), and two ways English packs more into less (portmanteau words, clipped words).","tips":["Homophones sound the same, spelled differently (blue/blew). Homographs are spelled the same, sound different (bass/bass). Homonyms are spelled and sound the same, different meanings (bear/bear).","Clipping can cut the end (exam), the start (net) or both (flu, fridge)."],"roots":[{"r":"homo","m":"same","key":"homogeneous","ex":["homophone","homograph","homonym"]},{"r":"phon","m":"sound","key":"telephone","ex":["phonics","homophone","euphonious","symphony"]},{"r":"graph","m":"write","key":"autograph","ex":["homograph","graphite","biography"]},{"r":"onym","m":"name, word","key":"synonym","ex":["eponym","toponym","acronym","homonym"]},{"r":"top","m":"place","key":"topography","ex":["toponym","topic","utopia"]}],"items":[{"id":"spoonerism"},{"id":"homophone"},{"id":"homograph"},{"id":"homonym"},{"id":"toponym"},{"id":"acronym"},{"id":"portmanteau-word"},{"id":"clipped-word"},{"id":"boycott"},{"id":"grundyism"},{"id":"snafu"}]},{"n":29,"title":"Nasty Words and Nice Words","idea":"'Nice' wasn't always nice: from Latin nescius (ignorant) it meant foolish, then wanton, then precise, and only in the 1700s 'pleasant'. Here are better words for the nasty (virulent, pernicious, mordant, officious) and the nice (piquant, salubrious, salutary, avuncular).","tips":["Virulent (from virus, poison) is unrelated to virile (from vir, man).","Don't confuse mord/mor (bite: mordant, morsel, remorse) with mort (death: mortal).","Salubrious = good for your health; salutary = beneficial more generally (a salutary lesson)."],"roots":[{"r":"mord / mors","m":"bite","key":"morsel","ex":["mordant","remorse"]},{"r":"salu / salv","m":"health, welfare","key":"salute","ex":["salubrious","salutary","salutation","salvation"]},{"r":"vir (virus)","m":"poison","key":"virus","ex":["virulent"]}],"items":[{"id":"virulent"},{"id":"pernicious"},{"id":"mordant"},{"id":"piquant"},{"id":"officious"},{"id":"salubrious"},{"id":"salutary"},{"id":"avuncular"},{"id":"virile"}]},{"n":30,"title":"Words for the Really Big and the Very Small","idea":"Words for scarcity and smallness (exiguous, diminuendo, Lilliputian) and for bigness (Brobdingnagian, magnum opus, commodious, capacious, juggernaut). Gulliver's Travels gave English one word for each extreme. Roots: min (small), magn and mega (great).","tips":["Commodious = conveniently, comfortably spacious (a commodious pantry); capacious = able to hold a lot (a capacious memory).","Lilliputian works literally (tiny) and figuratively (petty)."],"roots":[{"r":"min","m":"small","key":"minuscule","ex":["mince","minor","minimum","minus","minute","diminish","diminutive","diminuendo"]},{"r":"magn","m":"great, large","key":"magnificent","ex":["magnate","magna cum laude","Magna Carta","magnum","magnanimous","magnum opus","Charlemagne"]},{"r":"mega","m":"great, large; a million","key":"megaphone","ex":["megalopolis","megabyte","megahertz","megalomaniac"]}],"items":[{"id":"exiguous"},{"id":"diminuendo"},{"id":"lilliputian"},{"id":"brobdingnagian"},{"id":"magnum-opus"},{"id":"commodious"},{"id":"capacious"},{"id":"juggernaut"},{"id":"diminutive"},{"id":"megalomaniac"}]},{"n":31,"title":"Spelling as a Vocabulary Tool","idea":"English spelling is far more regular than people think. It has three layers, built up through history: an alphabet layer (one letter, one sound — from Anglo-Saxon Old English), a pattern layer (silent letters and vowel chunks — after the Norman Conquest of 1066) and a meaning layer (Greek and Latin roots — from the Renaissance). Children learning to spell retrace this same history.","tips":["Doubling rule: after a SHORT vowel, double the consonant (rabbit, sudden, 'fipping'); after a LONG vowel, don't (pilot, vacant, 'fiping').","-tch or -ch? After a short vowel use -tch (patch, pitch, botch); after a long vowel use -ch (peach, roach, coach). Exceptions: such, rich, much.","-able or -ible? If what's left is a real word, use -able (afford → affordable); if it's a root that can't stand alone, use -ible (cred → credible, vis → visible, aud → audible).","Words ending in silent e usually drop it before -able (debate → debatable), except after soft c/g (changeable).","Tip-of-the-tongue? Use a reverse dictionary such as OneLook: type 'urge to travel' and get 'wanderlust'."],"roots":[{"r":"-able / -ible","m":"capable of, likely to","key":"capable","ex":["affordable","reasonable","agreeable","credible","visible","audible","debatable","disposable"]},{"r":"struct","m":"build","key":"construct","ex":["structure","indestructible","infrastructure","instruct"]},{"r":"vis / vid","m":"see","key":"vision","ex":["visible","video","evident","provide"]},{"r":"aud","m":"hear","key":"audio","ex":["audible","audience","audition","auditorium"]}],"items":[{"note":"Phoneme awareness — hearing the separate sounds in a spoken word (c-a-t) — is the first step in learning to read and spell.","id":"phoneme"},{"note":"English orthography encodes sound, pattern and meaning all at once.","id":"orthography"},{"id":"wanderlust"},{"id":"invented-spelling"}]},{"n":32,"title":"A Medley of New Words","idea":"A second grab bag: truckle, tendentious, three sound words (tintinnabulation, susurration, harrumph) and trenchant — then a review that compares words in sets. Comparing and contrasting related words is one of the most powerful ways to learn them deeply.","tips":["Compare–contrast–connect: pick three related words, invent one situation that uses all three, then explain how they differ (draconian father, avuncular aunt, quixotic elopement).","Onomatopoeic words sound like what they mean — say them aloud."],"roots":[{"r":"tend / ten","m":"stretch, lean; hold","key":"tendency","ex":["tendentious","tenet","tenacious","extend"]}],"items":[{"id":"truckle"},{"id":"tendentious"},{"id":"tintinnabulation"},{"id":"susurration"},{"id":"harrumph"},{"id":"trenchant"},{"note":"Review: a secret society's test phrase.","id":"shibboleth"},{"note":"Review: the society's private lingo, seen from inside.","id":"argot"},{"note":"Review: the same lingo, seen from outside — incomprehensible.","id":"jargon"},{"note":"Review: the colleague with a rotary phone and no email.","id":"luddite"},{"note":"Review: the neighbor who has never finished a book.","id":"philistine"},{"note":"Review: the girlfriend's ultra-strict father.","id":"draconian"},{"note":"Review: the kind, indulgent aunt.","id":"avuncular"},{"note":"Review: eloping to find your own Shangri-La.","id":"quixotic"},{"note":"Review: the debater who wanders from topic to topic.","id":"discursive"},{"note":"Review: the debater with pompous, swollen language.","id":"turgid"},{"note":"Review: both students begging to be put on the team.","id":"importune"}]},{"n":33,"title":"Building Vocabulary through Games","idea":"Good vocabulary is broad (many words), deep (fine shades of meaning) and flexible (usable in new situations). Games build all three — especially flexibility. And reading widely is the biggest source of new words, if you use context and word parts together and then reinforce what you find.","tips":["Hink Pinks: rhyming-pair riddles. 'Hink pink' = two one-syllable words, 'hinky pinky' = two syllables each, 'hinkity pinkity' = three.","Clue Review (like the game Headbands): hold a word card to your forehead; your partner gives meaning clues (no 'sounds like' clues!) and you guess.","Taboo: describe a word without using the most obvious clue words — great for flexible thinking.","Meet an unfamiliar word while reading? Look inside the word (roots) and outside it (context); mark it; look it up later; note it in your notebook; then read 5–10 usage examples online and note its collocates.","Keep a 'Golden Lines' page for beautiful sentences you want to memorize, and 'vocabulary banks' of useful phrases (in short, taken as a whole, consequently, this gave rise to…) for your own writing."],"roots":[],"items":[{"note":"Hink pink: a pusillanimous blackbird is a craven raven.","id":"craven"},{"note":"Hink pink: a fractious young person is a wild child.","id":"fractious"},{"note":"Hinky pinky: a more erudite pugilist is a brighter fighter.","id":"erudite"},{"note":"Hinky pinky: an indolent flower is a lazy daisy.","id":"indolent"},{"note":"Hink pink: a callow legume is a green bean.","id":"callow"},{"note":"Context alone ('his bumptious boss') only tells you it's negative; the word part 'bump' tells you 'pushy'.","id":"bumptious"},{"id":"collocate"}],"hinkpinks":[{"q":"a mournful father","s":"hink pink","a":"sad dad"},{"q":"an ecstatic patriarch","s":"hinky pinky","a":"happy pappy"},{"q":"an evil preacher","s":"hinkity pinkity","a":"sinister minister"},{"q":"a short-tempered flower child","s":"hinky pinky","a":"snippy hippie"},{"q":"a pusillanimous blackbird","s":"hinky pinky","a":"craven raven"},{"q":"a fractious young person","s":"hink pink","a":"wild child"},{"q":"a more erudite pugilist","s":"hinky pinky","a":"brighter fighter"},{"q":"an indolent flower","s":"hinky pinky","a":"lazy daisy"},{"q":"a callow legume","s":"hink pink","a":"green bean"}]},{"n":34,"title":"Words English Borrowed and Never Returned","idea":"When English lacks a word, it either coins one (try 'frospiration' for the cloud of breath on a cold morning) or borrows one. More than half of English vocabulary comes from other languages — a cappella and graffiti from Italian, rendezvous from French, coyote from Spanish, karma and shampoo from Sanskrit, algebra from Arabic. Here are loanwords from German, French and an Algonquian language.","tips":["Loanwords often fill a 'lexical gap' — a feeling or idea English had no single word for (schadenfreude).","Split German compounds into their parts: Schaden + Freude = damage + joy; Zeit + Geist = time + spirit; Welt + Schmerz = world + pain."],"roots":[],"items":[{"id":"schadenfreude"},{"id":"zeitgeist"},{"id":"weltschmerz"},{"id":"eminence-grise"},{"id":"mugwump"},{"id":"bete-noire"},{"id":"doppelganger"},{"id":"loanword"},{"id":"faux-pas"}]},{"n":35,"title":"More Foreign Loan Words","idea":"A powerful vocabulary isn't about fancy words — it's about the exact right word. There are no perfect synonyms: words share a denotation (dictionary meaning) but differ in connotation (associations and feelings). 'Ask not what your country can do for you' would die if 'ask' became 'request'. Plus more loanwords from French, German and New Orleans Creole.","tips":["Denotation = literal dictionary meaning; connotation = the extra associations and feelings a word carries.","Don't confuse cachet (prestige — think 'sashay') with cache (a hidden store — think 'stash').","Mot juste = the exact right word; bon mot = a witty remark."],"roots":[],"items":[{"id":"mot-juste"},{"id":"bon-mot"},{"id":"insouciant"},{"id":"gestalt"},{"id":"cach
