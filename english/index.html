<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Wordhoard: 871 English words from three vocabulary courses, with spaced review.">
<meta name="theme-color" content="#F5F7FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1626" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wordhoard">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<link rel="stylesheet" href="../lm.css">
</head>
<body>
<title>Wordhoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one notebook column (max 46rem) — Cornell-style word pages with a red margin rule; bottom tab bar on phones, header tabs on wide screens. */
:root{
  --paper:#F5F7FB; --paper-2:#E9EEF7; --card:#FFFFFF; --ink:#17213A; --ink-2:#4B5672; --ink-3:#6D7791;
  --rule:#D3DDEE; --margin:#C9474E; --hi:#FFE15A; --hi-ink:#2A2200; --lamp:#D99A00; --lamp-off:#D7DEEB;
  --accent:#2445A6; --accent-ink:#FFFFFF; --good:#23774A; --good-bg:#E3F3EA; --bad:#B23A40; --bad-bg:#FBE8E9;
  --shadow:0 1px 2px rgba(23,33,58,.06),0 6px 20px rgba(23,33,58,.06);
  --f-head:"Libre Caslon Text","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-note:"Kalam","Segoe Print","Comic Sans MS",cursive;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1626; --paper-2:#172035; --card:#18223A; --ink:#E7ECF6; --ink-2:#A5B0CA; --ink-3:#8590AC;
  --rule:#2A3656; --margin:#E2777C; --hi:#E8C845; --hi-ink:#1C1600; --lamp:#FFD34D; --lamp-off:#2C3858;
  --accent:#93ABFF; --accent-ink:#0D1530; --good:#62C990; --good-bg:#16352A; --bad:#F2858A; --bad-bg:#3A1C22;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1626; --paper-2:#172035; --card:#18223A; --ink:#E7ECF6; --ink-2:#A5B0CA; --ink-3:#8590AC;
  --rule:#2A3656; --margin:#E2777C; --hi:#E8C845; --hi-ink:#1C1600; --lamp:#FFD34D; --lamp-off:#2C3858;
  --accent:#93ABFF; --accent-ink:#0D1530; --good:#62C990; --good-bg:#16352A; --bad:#F2858A; --bad-bg:#3A1C22;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-head);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:46rem;margin:0 auto;padding-inline:16px;padding-block:0 120px}
@media (min-width:760px){.wrap{padding-bottom:64px}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.top-in{max-width:46rem;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;margin-right:auto}
.brand b{font-family:var(--f-head);font-style:italic;font-weight:400;font-size:1.45rem;letter-spacing:.005em}
.bulb{width:22px;height:22px;flex:none}
.toptabs{display:none;gap:4px}
@media (min-width:760px){.toptabs{display:flex}}
.toptabs button,.iconbtn{background:none;border:0;border-radius:999px;padding:8px 14px;color:var(--ink-2);font-weight:700;font-size:.95rem}
.toptabs button[aria-current="page"]{background:var(--paper-2);color:var(--ink)}
.iconbtn{padding:8px;display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav-in{max-width:46rem;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.bnav button{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-3);font-size:.78rem;font-weight:700}
.bnav button svg{width:24px;height:24px}
.bnav button[aria-current="page"]{color:var(--accent)}
@media (min-width:760px){.bnav{display:none}}
body.focus .bnav,body.focus .toptabs{display:none}

/* type helpers */
.eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:.9rem}
.note{font-family:var(--f-note);color:var(--margin);font-size:1.05rem;line-height:1.2}
.hl{background:linear-gradient(transparent 12%,var(--hi) 12%,var(--hi) 88%,transparent 88%);color:var(--hi-ink);padding:0 .08em;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.pos{font-family:var(--f-head);font-style:italic;color:var(--ink-2);font-weight:400}

.section{display:grid;gap:14px;padding-top:22px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-h h2{font-size:1.35rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:2px solid transparent;padding:12px 20px;font-weight:700;font-size:1rem;line-height:1.2;text-decoration:none;min-height:48px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--card);border-color:var(--rule);color:var(--ink)}
.btn-soft{background:var(--paper-2);color:var(--ink);border-color:var(--rule)}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:20px;height:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1 1 auto}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:6px 0}
.back{background:none;border:0;color:var(--ink-2);font-weight:700;display:inline-flex;align-items:center;gap:6px;padding:14px 0 0}
.back svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.9rem;font-weight:700;color:var(--ink-2)}
button.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip svg{width:16px;height:16px}
.hu-ans .btn{min-height:84px;font-size:1.15rem;border-radius:20px}

/* cards */
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.plain{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:16px}

/* today */
.hello{padding-top:20px;display:grid;gap:4px}
.hello h1{font-size:clamp(1.7rem,5vw,2.2rem)}
.plan{display:grid;gap:12px}
.plan-item{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.plan-num{font-family:var(--f-head);font-size:2.4rem;line-height:1;min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums}
.plan-item p{font-weight:700}
.plan-item .muted{font-weight:400;font-size:.92rem}
.plan .btn{grid-column:1/-1}
@media (min-width:560px){.plan-item{grid-template-columns:auto 1fr auto}.plan .btn{grid-column:auto}}
.coursepick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.9rem;color:var(--ink-2)}
.coursepick select{border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:6px 10px;max-width:100%}

/* lamp meter */
.lampbar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--lamp-off)}
.lampbar span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:8px 14px;font-size:.9rem}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.legend b{font-variant-numeric:tabular-nums;margin-left:auto}
.dim{display:inline-flex;gap:3px;align-items:flex-end;flex:none}
.dim i{width:5px;border-radius:2px;background:var(--lamp-off)}
.dim i:nth-child(1){height:7px}.dim i:nth-child(2){height:10px}.dim i:nth-child(3){height:13px}.dim i:nth-child(4){height:16px}
.dim i.on{background:var(--lamp)}
.week{display:flex;gap:8px;align-items:flex-end}
.week div{display:grid;justify-items:center;gap:4px;font-size:.75rem;color:var(--ink-3);font-weight:700}
.week i{width:26px;height:26px;border-radius:50%;border:2px solid var(--rule);display:block}
.week i.on{background:var(--lamp);border-color:var(--lamp)}
.week i.today{outline:2px solid var(--accent);outline-offset:2px}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--f-head);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}

/* word of the day (notebook page) */
.page{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,color-mix(in srgb,var(--rule) 55%,transparent) 31px,color-mix(in srgb,var(--rule) 55%,transparent) 32px)}
.page::before{content:"";position:absolute;top:0;bottom:0;left:30px;width:1.5px;background:var(--margin);opacity:.55}
.page-in{padding:16px 18px 18px 46px;display:grid;gap:10px}
.cornell{display:grid;gap:14px}
@media (min-width:640px){.cornell{grid-template-columns:13.5rem 1fr;gap:22px}.page.wide::before{left:calc(28px + 13.5rem + 10px)}.page.wide .page-in{padding-left:28px}}
.headword{font-family:var(--f-head);font-weight:700;font-size:clamp(1.8rem,6vw,2.4rem);line-height:1.08;overflow-wrap:break-word}
.headword.l1{font-size:1.8rem}.headword.l2{font-size:1.68rem}.headword.l3{font-size:1.5rem}
@media (min-width:640px){.cornell .headword.l1{font-size:1.9rem}.cornell .headword.l2{font-size:1.6rem}.cornell .headword.l3{font-size:1.4rem}}
.headword.sm{font-size:1.6rem}
.hw-col{display:grid;gap:8px;align-content:start}
.def{font-size:1.12rem;line-height:1.45}
.ex{font-style:italic;color:var(--ink-2)}
.lbl{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-bottom:2px}
.fieldset{display:grid;gap:12px}
.say{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--paper-2);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.9rem;color:var(--ink)}
.say svg{width:18px;height:18px}
.hook{border-left:3px solid var(--hi);padding-left:12px;display:grid;gap:4px}
.picchip{display:inline-block;background:var(--hi);color:var(--hi-ink);border-radius:6px;padding:1px 8px;font-weight:700;font-size:.95rem;margin-right:6px}

/* lists */
.list{display:grid;border-top:1px solid var(--rule)}
.li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:hover{background:color-mix(in srgb,var(--paper-2) 60%,transparent)}
.li-main{min-width:0;display:grid;gap:2px}
.li-title{font-weight:700;font-size:1.02rem}
.li-title .w{font-family:var(--f-head);font-size:1.12rem}
.li-sub{color:var(--ink-2);font-size:.92rem;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lesson-li{grid-template-columns:3rem 1fr auto}
.lnum{font-family:var(--f-head);font-size:1.3rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.minibar{width:64px;height:6px;border-radius:9px;background:var(--lamp-off);overflow:hidden}
.minibar span{display:block;height:100%;background:var(--lamp)}
.unit-h{padding:18px 4px 6px;font-weight:700;color:var(--ink-3);font-size:.8rem;letter-spacing:.09em;text-transform:uppercase}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--paper-2);border-radius:14px;padding:4px;gap:4px}
.seg button{min-width:0;overflow-wrap:anywhere}
.pron{font-family:var(--f-body);font-size:.95rem;color:var(--ink-2);letter-spacing:.02em}
.pron::before{content:"say ";font-family:var(--f-note);color:var(--margin);letter-spacing:0}
.tipbox{border-left:3px solid var(--accent);padding-left:12px;display:grid;gap:4px}
.tipbox .note{color:var(--accent)}
.notecard{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.notecard h3{font-size:1.12rem}
.notecard ul{margin:0;padding-left:1.1em;display:grid;gap:6px}
.kindtag{justify-self:start;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--margin)}
.seg button{border:0;background:none;border-radius:10px;padding:10px 8px;font-weight:700;color:var(--ink-2);line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg small{display:block;font-weight:400;font-size:.8rem;color:var(--ink-3)}
.search{display:flex;align-items:center;gap:8px;border:2px solid var(--rule);background:var(--card);border-radius:14px;padding:4px 12px}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;outline:0;background:none;padding:10px 0;width:100%;min-width:0;font-size:1.05rem}
.search svg{width:20px;height:20px;color:var(--ink-3);flex:none}

/* lesson detail */
.lesson-hero{display:grid;gap:8px;padding-top:6px}
.lesson-hero h1{font-size:clamp(1.6rem,5vw,2.1rem)}
.idea{font-size:1.08rem;line-height:1.55}
.tips{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.tips li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.tips li::before{content:"";width:9px;height:9px;margin-top:.55em;border-radius:50%;background:var(--margin)}
.roots{display:grid;gap:10px}
.root{display:grid;grid-template-columns:minmax(6.5rem,auto) 1fr;gap:4px 14px;padding:12px 0;border-bottom:1px solid var(--rule)}
.root:last-child{border-bottom:0}
.root .r{font-family:var(--f-head);font-weight:700;font-size:1.1rem}
.root .m{font-weight:700}
.root .x{grid-column:2;color:var(--ink-2);font-size:.92rem}
@media (max-width:420px){.root{grid-template-columns:1fr}.root .x{grid-column:1}}
.alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5rem,1fr));gap:8px}
.alpha div{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;background:var(--card);display:flex;gap:8px;align-items:baseline}
.alpha b{font-family:var(--f-head);font-size:1.3rem}

/* sessions */
.sess{min-height:calc(100dvh - 140px);display:grid;align-content:start;gap:16px;padding-top:14px}
.sess-top{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:8px;border-radius:9px;background:var(--paper-2);overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink-2);font-size:.9rem}
.flash{min-height:20rem}
.flash .page-in{min-height:20rem;align-content:start}
.front-center{display:grid;gap:12px;justify-items:start;padding-top:6px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answers .btn{min-height:56px}
.btn-again{background:var(--bad-bg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn-got{background:var(--good);color:var(--card)}
:root[data-theme="dark"] .btn-got{color:#0E1A14}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-got{color:#0E1A14}}
.kbd{font-size:.78rem;color:var(--ink-3);text-align:center}
.q{font-size:1.25rem;font-weight:700;line-height:1.35}
.q .w{font-family:var(--f-head);font-size:1.5rem}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--rule);background:var(--card);border-radius:14px;padding:14px 16px;min-height:56px;display:grid;grid-template-columns:2rem 1fr;gap:8px;align-items:center;line-height:1.35}
.opt .k{width:1.7rem;height:1.7rem;border-radius:50%;background:var(--paper-2);display:grid;place-items:center;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.opt.w{font-family:var(--f-head);font-size:1.15rem}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.feedback{border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.feedback.good{background:var(--good-bg)}
.feedback.bad{background:var(--bad-bg)}
.feedback b.t{font-size:1.05rem}
.blank{display:inline-block;min-width:5.5ch;border-bottom:3px solid var(--accent);color:transparent}
.inputrow{display:flex;gap:10px;flex-wrap:wrap}
.inputrow input{flex:1 1 12rem;min-width:0;border:2px solid var(--rule);background:var(--card);border-radius:14px;padding:12px 14px;font-size:1.2rem;font-family:var(--f-head)}
.inputrow input:focus{border-color:var(--accent);outline:0}
.summary{display:grid;gap:14px;text-align:left}
.big{font-family:var(--f-head);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}

/* practice grid */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:12px}
.mode{text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:16px;display:grid;gap:6px;align-content:start;box-shadow:var(--shadow)}
.mode:hover{border-color:var(--accent)}
.mode h3{font-size:1.15rem}
.mode p{color:var(--ink-2);font-size:.93rem}
.mode .tag{justify-self:start;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--margin)}

/* heads up */
.hu-word{font-family:var(--f-head);font-weight:700;font-size:clamp(2.4rem,12vw,4.5rem);line-height:1.05;text-align:center;word-break:break-word;padding:28px 8px 8px}
.hu-clue{text-align:center;color:var(--ink-2)}
.timer{font-family:var(--f-head);font-size:2.2rem;font-variant-numeric:tabular-nums;text-align:center}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:50;display:grid;align-items:end;justify-items:center}
.sheet{background:var(--paper);width:100%;max-width:34rem;border-radius:20px 20px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;max-height:90dvh;overflow:auto}
@media (min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
.setting{display:grid;gap:8px}
.confirm{border:2px solid var(--bad);background:var(--bad-bg);border-radius:14px;padding:14px;display:grid;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.92rem;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:760px){.toast{bottom:28px}}
.empty{padding:28px 8px;text-align:center;color:var(--ink-2)}
.sync{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--ink-3)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:block}
.sync.on i{background:var(--good)}
.fade{animation:fade .22s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

<script id="wh-data" type="application/json">{"words":[{"id":"gnarled","w":"gnarled","pos":"adjective","d":"twisted and knotted, as with old branches, hands or roots","ex":"The old fisherman mended nets with gnarled fingers.","ety":"A word that sounds like what it means — try saying it slowly and picture a knotty old tree trunk.","src":[{"c":"ttc","n":1}]},{"id":"factotum","w":"factotum","pos":"noun","d":"a person hired to do many different kinds of jobs; a jack of all trades","ex":"Our office factotum handles billing, the phones and even the coffee machine.","ety":"Latin fac (make, do — think factory) + totum (all, as in total): someone who 'does it all'. Picture Batman's butler, Alfred.","src":[{"c":"ttc","n":1}]},{"id":"procrustean","w":"procrustean","pos":"adjective","d":"forcing conformity by arbitrary, ruthless or violent means","ex":"The procrustean dress code ignored every reasonable exception.","ety":"From Procrustes, a mythical bandit who made travelers fit his iron bed — stretching the short ones and cutting off the feet of the tall ones. A 'procrustean bed' is an arbitrary standard everything must fit.","src":[{"c":"ttc","n":1}]},{"id":"decimate","w":"decimate","pos":"verb","d":"to destroy or kill a large part of something","ex":"The drought decimated the region's wheat harvest.","ety":"Latin dec (ten, as in decade, decimal, decathlon). Roman commanders punished mutinous troops by executing one soldier in ten; the meaning later widened to 'destroy utterly'.","src":[{"c":"ttc","n":1},{"c":"bri","n":9}],"pic":"dice + might","hook":"A giant die rolls through town with all its might, flattening buildings.","syn":["devastate","destroy","wipe out"],"ant":["preserve"],"d2":"to kill, destroy or remove a large part of"},{"id":"kerfuffle","w":"kerfuffle","pos":"noun","d":"a commotion or fuss, usually over a minor disagreement","ex":"There was a brief kerfuffle over who had reserved the table.","ety":"Learn it alongside its meaning-cousins: spat and tussle (mild), hullabaloo (noisy), imbroglio (tangled), melee and donnybrook (violent free-for-alls).","src":[{"c":"ttc","n":1}]},{"id":"semantic-chunking","w":"semantic chunking","pos":"term","d":"organizing words into groups that share a meaning, to make them easier to remember and retrieve","ex":"Instead of an A-to-Z list, she studied words for 'fight' together — that's semantic chunking.","ety":"From Greek sēma (sign, meaning). Our brains store knowledge in 'schemas' — mental file folders — so grouping by meaning matches how memory works.","src":[{"c":"ttc","n":1}]},{"id":"etymology","w":"etymology","pos":"noun","d":"the history of a word: its origin and how its form and meaning have changed","ex":"The etymology of 'decimate' involves Roman army discipline.","ety":"Greek etymon (true sense) + -logy (study). An 'etymological narrative' is a story about a word's history — stories are easy to remember.","src":[{"c":"ttc","n":1}]},{"id":"morphology","w":"morphology","pos":"noun","d":"the study of the structure of words and their meaningful parts (prefixes, suffixes, roots)","ex":"Morphology tells us that 'unbreakable' has three meaningful parts.","ety":"Greek morph (form, shape) + -logy (study). Meaningful word parts are called morphemes.","src":[{"c":"ttc","n":1}]},{"id":"factitious","w":"factitious","pos":"adjective","d":"artificial, not natural; or made-up and fake, a sham","ex":"Her factitious laugh fooled no one at the table.","ety":"Latin fac (make): things made by people in a factory are not natural. Don't confuse it with 'facetious' (joking, not serious).","src":[{"c":"ttc","n":2},{"c":"va","n":49}],"pr":"fak-TISH-us","tip":"Not to be confused with fictitious (imaginary) or fractious (unruly).","d2":"artificial; contrived; not natural or genuine","ety2":"Latin facticius, made by art; facere, to make.","syn":["artificial","contrived","sham","bogus","spurious"],"ant":["genuine","natural","spontaneous"]},{"id":"facetious","w":"facetious","pos":"adjective","d":"joking or flippant, especially at an inappropriate time","ex":"He was being facetious when he offered to sell his brother.","ety":"Usage alert: often confused with factitious (artificial). Facetious = playful; factitious = fake.","src":[{"c":"ttc","n":2}]},{"id":"circumspect","w":"circumspect","pos":"adjective","d":"cautious and careful, considering all risks before acting","ex":"Be circumspect about what you post online.","ety":"Latin circum (around) + spect (look): a careful person looks around before acting.","src":[{"c":"ttc","n":2},{"c":"va","n":13}],"pr":"SUR-kum-spekt","tip":"Careful = close attention; cautious = guarding against danger; circumspect = a wary care about unforeseen consequences.","d2":"cautious and watchful; considering all circumstances before acting","ety2":"Latin circum (around) + specere (to look): looking around before acting. Specere also gives spectator and spectacle.","syn":["prudent","wary","vigilant","discreet"]},{"id":"receptive-vocabulary","w":"receptive vocabulary","pos":"term","d":"the words you understand when you read or hear them","ex":"Your receptive vocabulary is much larger than the words you actually use.","ety":"Compare 'expressive vocabulary': the words you can use comfortably in speech and writing.","src":[{"c":"ttc","n":2}]},{"id":"orthography","w":"orthography","pos":"noun","d":"a language's spelling system","ex":"English orthography represents meaning as well as sound.","ety":"Greek ortho (straight, correct) + graph (write): 'correct writing'.","src":[{"c":"ttc","n":2}]},{"id":"affix","w":"affix","pos":"noun","d":"a word part attached to a base or root — a prefix (front) or suffix (end)","ex":"In 'unprofitable', un- and -able are affixes on the base word profit.","ety":"Latin ad (to) + fix (fasten). A root (like spect) can't stand alone; a base word (like profit) can.","src":[{"c":"ttc","n":2}]},{"id":"mountebank","w":"mountebank","pos":"noun","d":"a flamboyant swindler who poses as an expert, especially one selling fake remedies","ex":"The mountebank sold bottles of colored water as a cure for baldness.","ety":"Italian 'monta in banco' — mount a bench: quacks climbed onto a bench in the town square to sell potions. Synonyms: charlatan, flimflammer, con artist.","src":[{"c":"ttc","n":3}]},{"id":"sophist","w":"sophist","pos":"noun","d":"someone who uses clever but deliberately misleading arguments","ex":"The debate coach warned against becoming a sophist who wins without being right.","ety":"Greek soph (wise, clever). Ancient Sophists taught persuasion and were accused of caring about winning, not truth. Sophistry = such trickery. Compare sophomore, 'wise fool'.","src":[{"c":"ttc","n":3}]},{"id":"specious","w":"specious","pos":"adjective","d":"seeming plausible on the surface but actually false — and intended to mislead","ex":"His specious argument fell apart under questioning.","ety":"Latin speciosus (good-looking), from species (appearance) and spec (look). A specious claim looks good but isn't.","src":[{"c":"ttc","n":3},{"c":"va","n":44}],"pr":"SPEE-shus","tip":"A specious argument has the ring of truth, so 'obviously specious' is nearly a contradiction.","d2":"seeming true or right but actually false","ety2":"Latin speciosus, beautiful in appearance.","syn":["plausible","fallacious","misleading","sophistic","spurious"]},{"id":"spurious","w":"spurious","pos":"adjective","d":"false or not genuine — not necessarily meant to deceive","ex":"The study found a spurious link between shoe size and intelligence.","ety":"Difference from specious: specious implies deliberate deception; spurious can just be wrong or an honest mistake. Common pairs: spurious charges, spurious reasoning.","src":[{"c":"ttc","n":3},{"c":"va","n":37}],"pr":"SPYOOR-ee-us","d2":"false; counterfeit; not genuine","syn":["bogus","sham","fraudulent","apocryphal","specious"],"ant":["genuine","authentic","bona fide"]},{"id":"apocryphal","w":"apocryphal","pos":"adjective","d":"of doubtful authenticity; widely told but probably untrue and unverifiable","ex":"The tale of alligators in the sewers is apocryphal.","ety":"From the Apocrypha, texts left out of the Bible because their authenticity couldn't be established. Think urban legends.","src":[{"c":"ttc","n":3},{"c":"va","n":41}],"pr":"uh-PAHK-ruh-ful","d2":"of doubtful authenticity; probably made up","ety2":"The Apocrypha: books of the Greek Old Testament whose authority was doubted.","syn":["spurious","unauthenticated","fictitious","legendary"],"ant":["genuine","authentic","bona fide","canonical"]},{"id":"ersatz","w":"ersatz","pos":"adjective","d":"being an inferior or artificial substitute","ex":"We drank ersatz coffee made from roasted chicory.","ety":"German for 'substitute'. British prisoners in WWII were fed Ersatzbrot — bread bulked out with sawdust — and brought the word home.","src":[{"c":"ttc","n":3}]},{"id":"skulduggery","w":"skulduggery","pos":"noun","d":"underhanded, dishonest or deceitful behavior","ex":"The election was marred by bribes, wiretaps and other skulduggery.","ety":"Of Scottish origin; nothing to do with digging up skulls — but that grisly image can help you remember 'shady dealings'.","src":[{"c":"ttc","n":3}]},{"id":"machinations","w":"machinations","pos":"noun (usually plural)","d":"crafty schemes or secret plots","ex":"The novel follows the political machinations of a royal court.","ety":"Link mach- to Machiavelli, author of The Prince, the classic portrait of scheming rulers. Most common pairing: political machinations.","src":[{"c":"ttc","n":3}]},{"id":"hornswoggle","w":"hornswoggle","pos":"verb","d":"to swindle, cheat or trick","ex":"We got hornswoggled into paying double for the tickets.","ety":"An 1800s Americanism of unknown origin. A colorful (probably apocryphal) story: a lassoed cow wriggles its head to slip its horns free and cheat the cowboy. Cousins: bamboozle, hoodwink.","src":[{"c":"ttc","n":3}]},{"id":"gadfly","w":"gadfly","pos":"noun","d":"a persistently annoying person who keeps questioning, criticizing and pestering","ex":"The local gadfly turned up at every council meeting with a new complaint.","ety":"Literally a fly that bites livestock; Old Norse gaddr = spike, sting. Socrates called himself the gadfly that stung lazy Athens awake. Common pair: political gadfly.","src":[{"c":"ttc","n":4}]},{"id":"querulous","w":"querulous","pos":"adjective","d":"complaining in a whining, peevish way","ex":"The querulous passenger grumbled about the seat, the food and the pilot.","ety":"Latin queri (to complain), the source of quarrel — not related to query. Picture Oscar the Grouch. Cousins: peevish (petty complaints), petulant (childish sulks), carp (nasty nitpicking).","src":[{"c":"ttc","n":4}]},{"id":"maudlin","w":"maudlin","pos":"adjective","d":"tearfully and foolishly sentimental, often from drinking too much","ex":"After a few drinks he got maudlin about his school days.","ety":"From Mary Magdalene, painted in the Middle Ages as a weeping penitent. Picture a crying drunk spilling his life story.","src":[{"c":"ttc","n":4}]},{"id":"mawkish","w":"mawkish","pos":"adjective","d":"excessively and sickeningly sentimental, often insincerely so","ex":"The mawkish tribute from his rival made the audience cringe.","ety":"Middle English mawke = maggot — think 'disgusting'. Maudlin = too emotional from lack of restraint; mawkish = sickening, fake sentiment.","src":[{"c":"ttc","n":4}]},{"id":"treacle","w":"treacle","pos":"noun","d":"cloying, sickly sweet sentiment or speech; also, molasses or golden syrup","ex":"The greeting card was pure treacle.","ety":"Picture thick, sticky syrup. Adjective: treacly. Related: cloying (overly sweet, ingratiating), saccharine.","src":[{"c":"ttc","n":4}]},{"id":"scabrous","w":"scabrous","pos":"adjective","d":"indecent, salacious or scandalous; also, rough and scaly","ex":"The tabloid printed every scabrous detail of the affair.","ety":"Latin scaber (rough, scaly), from scabere (to scratch) — the family of scab and scabies. Rough skin → rough, shocking content.","src":[{"c":"ttc","n":4}]},{"id":"noisome","w":"noisome","pos":"adjective","d":"offensive and disgusting, especially of smells; also harmful","ex":"A noisome odor drifted from the forgotten lunchbox.","ety":"Related to annoy, not to noise. (Noise comes from Latin nausea, 'seasickness', from Greek naus, ship.)","src":[{"c":"ttc","n":4},{"c":"va","n":44}],"pr":"NOY-sum","d2":"harmful; offensive, especially foul-smelling","ety2":"Middle English, related to annoy — nothing to do with noise.","syn":["noxious","fetid","malodorous","pernicious","mephitic"],"ant":["salubrious","salutary","fragrant"]},{"id":"fulsome","w":"fulsome","pos":"adjective","d":"traditionally: excessive and insincere (fulsome flattery); now often: abundant, generous","ex":"She received fulsome praise from the committee.","ety":"A 'skunked term': it has shifted from 'abundant' to 'overfed' to 'offensively overdone' and back to 'abundant'. Because readers disagree, use it with care.","src":[{"c":"ttc","n":4}]},{"id":"nudnik","w":"nudnik","pos":"noun","d":"a pest who is both annoying and boring","ex":"The neighborhood nudnik cornered me for an hour about lawn mowers.","ety":"Borrowed from Yiddish. A gadfly who is also dull.","src":[{"c":"ttc","n":4}]},{"id":"donnybrook","w":"donnybrook","pos":"noun","d":"a wild free-for-all brawl; also a heated public dispute","ex":"A shove between two players turned into a bench-clearing donnybrook.","ety":"Donnybrook, a Dublin suburb whose annual fair was famous for drunken brawls — it was banned in 1855.","src":[{"c":"ttc","n":5}]},{"id":"imbroglio","w":"imbroglio","pos":"noun","d":"a complicated, confused and often embarrassing situation or dispute","ex":"The love-triangle imbroglio was worthy of a sitcom.","ety":"Pronounced im-BROHL-yo (silent g). Italian 'to confuse'; related to embroiled — and to broil and broth: picture everything jumbled in a boiling pot.","src":[{"c":"ttc","n":5},{"c":"va","n":40}],"pr":"im-BROHL-yoh","d2":"a complicated, confusing situation or dispute","ety2":"Italian imbrogliare, to entangle — also embroil.","syn":["entanglement","predicament","quandary","muddle","fiasco"]},{"id":"bellicose","w":"bellicose","pos":"adjective","d":"aggressively hostile; eager to fight","ex":"The general's bellicose speech alarmed the neighboring countries.","ety":"Latin bellum (war); keyword rebellion. Belligerent is a close cousin. Antebellum = before the war; postbellum = after.","src":[{"c":"ttc","n":5}]},{"id":"truculent","w":"truculent","pos":"adjective","d":"fierce, cruel and eager to fight; also scathingly harsh (of criticism)","ex":"The critic's truculent review called the novel a waste of paper.","ety":"Unrelated to trucks — but picture an aggressive truck driver riding your bumper, and you won't forget it.","src":[{"c":"ttc","n":5},{"c":"va","n":37}],"pr":"TRUK-yuh-lunt","rel":["truculence — aggressive defiance"],"d2":"fierce and aggressively defiant; savagely harsh","ety2":"Latin truculentus, savage.","syn":["pugnacious","belligerent","bellicose","feral","combative"],"ant":["gentle","clement","timid","diffident"]},{"id":"contumacious","w":"contumacious","pos":"adjective","d":"stubbornly disobedient to authority; willfully defiant","ex":"The contumacious witness was held in contempt of court.","ety":"Connect it to someone you know who thumbs their nose at rules.","src":[{"c":"ttc","n":5}]},{"id":"rapacious","w":"rapacious","pos":"adjective","d":"aggressively and excessively greedy; predatory","ex":"A rapacious developer bought up the whole waterfront.","ety":"Emphasizes greedy, devouring aggression. Cousins: ravenous, voracious, avaricious.","src":[{"c":"ttc","n":5}]},{"id":"halcyon","w":"halcyon","pos":"adjective","d":"calm, peaceful and happy (usually of a past time)","ex":"She remembered the halcyon days of childhood summers.","ety":"Greek myth: Alcyone became the halcyon (kingfisher); her father, god of the winds, calmed the sea so she could nest. Note the 'c' (sea) — picture a bird on a still sea.","src":[{"c":"ttc","n":5}]},{"id":"quiescent","w":"quiescent","pos":"adjective","d":"quiet, still and at rest; also inactive or dormant","ex":"After midnight the house settled into quiescence.","ety":"Latin quiescere (to rest), the family of quiet. Noun: quiescence.","src":[{"c":"ttc","n":5},{"c":"bri","n":6},{"c":"va","n":13}],"pic":"quiet + scene","hook":"Actors freeze, pretending to sleep, in a quiet scene so the mummies won't catch them.","syn":["dormant","inactive","still"],"ant":["active"],"d2":"in a state of inactivity or dormancy","pr":"kwee-ES-unt","tip":"(This track is blank on your drive; entry written from the standard meaning.)"},{"id":"propitiate","w":"propitiate","pos":"verb","d":"to win back someone's favor; to appease","ex":"He tried to propitiate his boss with an early report.","ety":"Often religious (propitiating the gods). Synonyms: mollify, placate, conciliate, dulcify.","src":[{"c":"ttc","n":5},{"c":"va","n":38}],"pr":"pruh-PISH-ee-ayt","rel":["propitious — favorable","propitiation — appeasement"],"d2":"to appease; win the favor of someone powerful","syn":["appease","placate","conciliate","mollify","pacify"],"ant":["antagonize","alienate","estrange"]},{"id":"mollycoddle","w":"mollycoddle","pos":"verb","d":"to pamper or overprotect someone excessively","ex":"Stop mollycoddling him — he can make his own bed.","ety":"Coddle = to pamper; 'molly' was once a mocking term for a pampered man.","src":[{"c":"ttc","n":5}]},{"id":"castigate","w":"castigate","pos":"verb","d":"to criticize or punish severely","ex":"The coach castigated the team for their lazy defense.","ety":"Word-part trick: you cast (throw) criticism at someone.","src":[{"c":"ttc","n":6},{"c":"va","n":25}],"pr":"KAS-ti-gayt","tip":"Chasten = discipline in order to purify; chastise = (formerly) beat, (now) scold sharply; castigate = blast publicly in words.","ety2":"Latin castigare, to punish with words or blows.","syn":["chastise","rebuke","censure","berate"],"ant":["praise","commend","laud","extol"]},{"id":"toothsome","w":"toothsome","pos":"adjective","d":"delicious; also (informally) attractive","ex":"The bakery's toothsome pastries sell out by nine.","ety":"1550s: tooth (appetite, as in 'sweet tooth') + -some (causing). Something toothsome makes your teeth want it.","src":[{"c":"ttc","n":6}]},{"id":"captious","w":"captious","pos":"adjective","d":"fault-finding; quick to object to trivial errors","ex":"His captious boss never said a single kind word.","ety":"Synonyms: hypercritical, carping, cantankerous. Non-example: someone encouraging and complimentary.","src":[{"c":"ttc","n":6},{"c":"va","n":37}],"pr":"KAP-shus","tip":"Critical is properly neutral (fair judgment). For negative fault-finding, try carping or captious.","d2":"quick to find fault or raise trivial objections","ety2":"Latin captio, a seizing — catching people out.","syn":["carping","quibbling","caviling","censorious","querulous"]},{"id":"circumlocution","w":"circumlocution","pos":"noun","d":"roundabout, evasive or wordy speech","ex":"Cut the circumlocution and tell me what happened.","ety":"Latin circum (around) + loc (speak): talking around the point. Picture the word written in a circle.","src":[{"c":"ttc","n":6}]},{"id":"mnemonic","w":"mnemonic","pos":"adjective / noun","d":"intended to help memory; a memory aid","ex":"'Roy G. Biv' is a mnemonic for the colors of the rainbow.","ety":"From Mnemosyne, Greek goddess of memory. The 'm' is silent: ni-MON-ik.","src":[{"c":"ttc","n":6},{"c":"va","n":27}],"pr":"ni-MAHN-ik","tip":"The first m is silent.","rel":["mnemonics — memory techniques"],"d2":"helping the memory; a memory aid","ety2":"Greek, to remember. Mnemosyne was the goddess of memory and mother of the nine Muses."},{"id":"malefactor","w":"malefactor","pos":"noun","d":"a person who does evil or breaks the law","ex":"The malefactors were caught on camera.","ety":"Latin mal (bad) + fac (do): one who does bad things. Opposite: benefactor.","src":[{"c":"ttc","n":6},{"c":"ttc","n":7}],"ety2":"mal (evil) + fac (do) + -or (one who) = one who does evil. Opposite: benefactor. Colorful cousins: scalawag, knave, scofflaw, reprobate, snollygoster."},{"id":"malediction","w":"malediction","pos":"noun","d":"a curse; evil talk about someone","ex":"The witch muttered a malediction as she left the village.","ety":"mal (evil) + dict (speak) = evil speech. Antonym: benediction, a blessing.","src":[{"c":"ttc","n":7}]},{"id":"malcontent","w":"malcontent","pos":"noun","d":"a chronically dissatisfied person; also a political rebel","ex":"The office malcontent complained even about free pizza.","ety":"mal + content: 'badly contented'. A malcontent kvetches (Yiddish: to gripe, literally to squeeze).","src":[{"c":"ttc","n":7}]},{"id":"malaise","w":"malaise","pos":"noun","d":"a vague feeling of discomfort, unease or illness","ex":"A general malaise settled over the team after the loss.","ety":"mal + aise (ease): being ill at ease. Common phrase: economic malaise.","src":[{"c":"ttc","n":7}]},{"id":"maladroit","w":"maladroit","pos":"adjective","d":"clumsy, awkward or tactless","ex":"His maladroit attempt at a joke offended everyone.","ety":"mal + adroit (skillful, agile).","src":[{"c":"ttc","n":7}]},{"id":"malfeasance","w":"malfeasance","pos":"noun","d":"wrongdoing, especially by a public official","ex":"The mayor was removed from office for malfeasance.","ety":"mal + Old French faisance (doing) — the same 'do' idea as fac.","src":[{"c":"ttc","n":7}]},{"id":"malinger","w":"malinger","pos":"verb","d":"to fake or exaggerate illness to avoid work or duty","ex":"He malingered every Monday morning.","ety":"Via French malingre (sickly). Picture a child warming the thermometer on a light bulb.","src":[{"c":"ttc","n":7},{"c":"va","n":29}],"pr":"muh-LING-gur","tip":"Not 'to linger or loiter' — it means faking illness.","rel":["malingerer"],"d2":"to pretend to be ill to avoid work or duty","ety2":"French malingre, sickly; related to malady."},{"id":"venal","w":"venal","pos":"adjective","d":"open to bribery; willing to sell one's influence","ex":"A venal official waved the trucks through for cash.","ety":"Latin venum (for sale), as in vendor and vending machine. Don't confuse with venial (minor, forgivable).","src":[{"c":"ttc","n":7},{"c":"va","n":42}],"pr":"VEE-nul","tip":"Don't confuse with venial (forgivable): a venial sin is minor; a venal official takes bribes.","rel":["venality — corruptibility"],"d2":"open to bribery; corrupt","ety2":"Latin venalis, for sale.","syn":["corruptible","bribable","mercenary","unscrupulous"],"ant":["incorruptible","honest","upright"]},{"id":"venial","w":"venial","pos":"adjective","d":"minor and forgivable (of a sin or fault)","ex":"Forgetting to call back is a venial offense.","ety":"Usage alert: venial = pardonable; venal = corruptible.","src":[{"c":"ttc","n":7},{"c":"va","n":47}],"pr":"VEE-nee-ul","tip":"Don't confuse with venal (bribable). (This track is blank on your drive; entry written from the standard meaning.)","d2":"minor and forgivable","ety2":"Latin venia, forgiveness.","syn":["pardonable","excusable","minor","trivial"],"ant":["mortal","grave","unforgivable","heinous"]},{"id":"insidious","w":"insidious","pos":"adjective","d":"proceeding secretly and subtly, with harmful effects; treacherous","ex":"High blood pressure is an insidious disease.","ety":"Latin insidere (to sit in, lie in wait). Spelling hook: it works from the INSIDE.","src":[{"c":"ttc","n":7}]},{"id":"invidious","w":"invidious","pos":"adjective","d":"likely to cause resentment or envy; unfairly discriminating","ex":"The invidious remarks divided the audience.","ety":"Latin invidia (envy). Spelling hook: iNViDious → eNVy.","src":[{"c":"ttc","n":7}]},{"id":"turpitude","w":"turpitude","pos":"noun","d":"depravity; shameful wickedness","ex":"He was dismissed for moral turpitude.","ety":"Latin turpis (shameful, ugly). Usually heard as 'moral turpitude'.","src":[{"c":"ttc","n":7}]},{"id":"snollygoster","w":"snollygoster","pos":"noun","d":"a shrewd, unprincipled person (often a politician)","ex":"Only a snollygoster would promise one thing and vote for the opposite.","ety":"An old Americanism — few people know it, so it's a safe insult.","src":[{"c":"ttc","n":7}]},{"id":"nascent","w":"nascent","pos":"adjective","d":"just coming into existence and beginning to develop","ex":"She led a nascent startup with big potential.","ety":"Latin nasci (to be born); root nasc/nat as in nativity, natal, native. Synonyms: incipient, burgeoning, embryonic, fledgling.","src":[{"c":"ttc","n":8},{"c":"va","n":33}],"pr":"NAS-unt (also NAY-sunt)","rel":["nascency — birth, beginning","antediluvian — before the Flood; extremely old"],"d2":"just coming into being; beginning to develop","ety2":"Latin nasci, to be born — also native, nation, renaissance.","syn":["emerging","embryonic","incipient","inchoate"],"ant":["senescent","antiquated","antediluvian","obsolete"]},{"id":"inchoate","w":"inchoate","pos":"adjective","d":"just begun and not yet fully formed; disorganized","ex":"His plan was still inchoate, so investors waited.","ety":"Pronounced in-KOH-it. Compared with nascent, it highlights what is still lacking.","src":[{"c":"ttc","n":8},{"c":"va","n":34}],"pr":"in-KOH-it","tip":"Say in-KOH-it — the ch is a K.","d2":"just begun; not yet fully formed","ety2":"Latin incohare, to begin.","syn":["nascent","incipient","rudimentary","embryonic","undeveloped"],"ant":["complete","mature","fully formed"]},{"id":"callow","w":"callow","pos":"adjective","d":"young and inexperienced; immature","ex":"As a callow youth of nineteen, he struck out three times in his first game.","ety":"Old English calu (bald, bare) — used of young birds without feathers. Memory hook: a callow person has a shallow pool of experience. Common phrase: callow youth.","src":[{"c":"ttc","n":8},{"c":"va","n":18}],"pr":"KAL-oh","d2":"immature and inexperienced","ety2":"Old English for bald — once said of young unfeathered birds. Compare fledgling.","syn":["green","naive","unseasoned","juvenile","puerile"]},{"id":"dilettante","w":"dilettante","pos":"noun","d":"a dabbler in an art or subject, often one who pretends to more knowledge than they have","ex":"He's a dilettante who buys new gear for every hobby and masters none.","ety":"Italian 'lover of the arts' (1700s); it turned negative by the late 1700s. Related: poser, pretender.","src":[{"c":"ttc","n":8}]},{"id":"tyro","w":"tyro","pos":"noun","d":"a beginner or novice","ex":"Even a fly-fishing tyro like me caught a trout with a good guide.","ety":"Synonyms: novice, rookie, neophyte, greenhorn, tenderfoot, abecedarian (someone learning the ABCs). Unlike dilettante, tyro carries no hint of pretending.","src":[{"c":"ttc","n":8}]},{"id":"ingenue","w":"ingenue","pos":"noun","d":"an innocent, naive young woman, or an actress who plays that stock role","ex":"The ingenue arrived in the big city with stars in her eyes.","ety":"From French ingénu (naive, ingenuous).","src":[{"c":"ttc","n":8}]},{"id":"puerile","w":"puerile","pos":"adjective","d":"childishly silly and immature","ex":"The investors' puerile jokes embarrassed the waiter.","ety":"Latin puer (boy, child). Often used disapprovingly of adults' behavior.","src":[{"c":"ttc","n":8},{"c":"va","n":26}],"pr":"PYOOR-ul or PYOO-ur-ul","tip":"Juvenile is the mildest, puerile harsher, infantile the strongest.","d2":"childish and silly","ety2":"Latin puer, a child.","syn":["childish","juvenile","infantile","sophomoric","callow"]},{"id":"moribund","w":"moribund","pos":"adjective","d":"near death; or no longer active and in decline","ex":"The moribund downtown came back to life with new cafés.","ety":"Latin mori (to die); root mort (death) as in mortal, mortuary, postmortem, mortify.","src":[{"c":"ttc","n":8}]},{"id":"neophyte","w":"neophyte","pos":"noun","d":"a person who is new to a subject, skill or belief","ex":"The class is designed for neophytes with no coding experience.","ety":"Greek neo (new) + phyt (planted): 'newly planted'.","src":[{"c":"ttc","n":8},{"c":"va","n":16}],"pr":"NEE-uh-fyt","tip":"Tyro stresses incompetence, novice inexperience, neophyte enthusiasm.","rel":["tyro — a raw, unskilled beginner (Latin, a new recruit)","amateur — one who does something for love, not money","dilettante — a dabbler in the arts"],"d2":"a beginner; a new convert","ety2":"Greek neo- (new) + phyton (plant): newly planted.","syn":["novice","tyro","beginner","fledgling"]},{"id":"xenophobia","w":"xenophobia","pos":"noun","d":"unreasonable fear or hatred of foreigners or strangers","ex":"The editorial warned against the rising xenophobia.","ety":"Greek xeno (strange, foreign) + phobia (fear). A strange-sounding word for fear of strangers.","src":[{"c":"ttc","n":9},{"c":"va","n":42}],"pr":"zen-uh-FOH-bee-uh","tip":"Elster prefers a short e: ZEN-uh-, not ZEE-nuh-.","rel":["xenophobe — a person with xenophobia","xenophobic — adjective"],"d2":"fear or hatred of foreigners or anything strange","ety2":"Greek xenos (stranger) + phobos (fear).","ant":["xenophilia — love of foreign things"]},{"id":"agoraphobia","w":"agoraphobia","pos":"noun","d":"an abnormal fear of open or public spaces","ex":"Her agoraphobia made crowded markets unbearable.","ety":"Greek agora: the open marketplace and assembly area at the center of a Greek city.","src":[{"c":"ttc","n":9}]},{"id":"glossophobia","w":"glossophobia","pos":"noun","d":"fear of public speaking","ex":"Glossophobia had his shirt soaked with sweat before the talk.","ety":"Greek glossa (tongue). Keyword: polyglot, a speaker of many tongues.","src":[{"c":"ttc","n":9}]},{"id":"acrophobia","w":"acrophobia","pos":"noun","d":"an abnormal fear of heights","ex":"My acrophobia keeps me well back from the cliff edge.","ety":"Greek akros (top, height). Acrobats fly high; the Acropolis is the high city.","src":[{"c":"ttc","n":9}]},{"id":"panacea","w":"panacea","pos":"noun","d":"a supposed cure for all problems or diseases","ex":"Technology is not a panacea for bad teaching.","ety":"Greek pan (all) + akos (cure).","src":[{"c":"ttc","n":9},{"c":"va","n":17}],"pr":"pan-uh-SEE-uh","tip":"'A panacea for all ills' is redundant — panacea already means a remedy for all ills.","d2":"a cure-all; a solution for every problem","ety2":"Greek pan (all) + akos (cure). Pan- also gives panorama, pantheism and pantheon."},{"id":"panoply","w":"panoply","pos":"noun","d":"a complete or impressive collection or display","ex":"The book covers the full panoply of human emotions.","ety":"Greek pan (all) + hopla (arms): originally a full suit of armor.","src":[{"c":"ttc","n":9}]},{"id":"oenophile","w":"oenophile","pos":"noun","d":"a connoisseur or lover of wine","ex":"The oenophile swirled his glass and spoke of blackberry notes.","ety":"Greek oinos (wine) + phil (love). Pronounced EE-nuh-file.","src":[{"c":"ttc","n":9}]},{"id":"philatelist","w":"philatelist","pos":"noun","d":"a person who collects or studies stamps","ex":"Any philatelist would dream of owning the one-cent British Guiana stamp.","ety":"Greek phil (love) + ateleia (exemption from tax — a stamp showed postage was prepaid).","src":[{"c":"ttc","n":9}]},{"id":"canoodle","w":"canoodle","pos":"verb","d":"to kiss and cuddle; also to coax or wheedle","ex":"A couple was canoodling in the back row of the cinema.","ety":"1850s American slang of uncertain origin. A fun (probably apocryphal) story: canoe + paddle, for couples escaping their chaperone.","src":[{"c":"ttc","n":9}]},{"id":"misanthrope","w":"misanthrope","pos":"noun","d":"a person who dislikes and distrusts humankind","ex":"The old misanthrope only came to town twice a year.","ety":"Greek miso (hate) + anthropos (human). Related: misanthropy, misogyny (hatred of women), misandry (hatred of men).","src":[{"c":"ttc","n":9}]},{"id":"execrate","w":"execrate","pos":"verb","d":"to denounce bitterly; to loathe intensely","ex":"The crowd execrated the acquitted man as a thief.","ety":"Latin ex (out, away) + sacrare (make sacred): to take the sacred away — leaving a curse. Adjective: execrable (detestable).","src":[{"c":"ttc","n":9},{"c":"va","n":47}],"pr":"EK-si-krayt","rel":["execrable — abominable","execration — a curse or denunciation"],"d2":"to denounce furiously; to loathe","ety2":"Latin exsecrari, to curse.","syn":["denounce","curse","abhor","detest","anathematize"],"ant":["bless","praise","extol"]},{"id":"anathema","w":"anathema","pos":"noun","d":"something or someone intensely disliked or loathed","ex":"Small talk is anathema to a misanthrope.","ety":"Originally a formal church curse; verb: anathematize, to denounce solemnly.","src":[{"c":"ttc","n":9}]},{"id":"insipid","w":"insipid","pos":"adjective","d":"lacking flavor; lacking interest or excitement","ex":"The roast was overcooked and insipid.","ety":"Hook: sip a bland, tasteless drink. Stresses a lack of taste or interest.","src":[{"c":"ttc","n":10},{"c":"bri","n":26}],"pic":"sippy cup","hook":"A baby sips from a sippy cup and spits out the flavorless juice.","syn":["bland","tasteless","dull"],"ant":["flavorful","exciting"],"d2":"lacking flavor, interest or vigor"},{"id":"vapid","w":"vapid","pos":"adjective","d":"lacking life, zest or spirit; dull and empty","ex":"After forty years, his lectures had become vapid.","ety":"Latin vapidus — that has lost its vapor, like a flat drink. Related word: vapor.","src":[{"c":"ttc","n":10},{"c":"va","n":39}],"pr":"VAP-id","d2":"dull, flat and lifeless","ety2":"Latin vapidus, flat, spoiled — like stale beer.","syn":["insipid","jejune","banal","prosaic","bland"],"ant":["lively","vivid","vivacious","stimulating"]},{"id":"prosaic","w":"prosaic","pos":"adjective","d":"matter-of-fact and unimaginative; or commonplace and ordinary","ex":"The manual was written in a prosaic, just-the-facts style.","ety":"From prose (as opposed to imaginative poetry).","src":[{"c":"ttc","n":10},{"c":"va","n":17}],"pr":"proh-ZAY-ik","d2":"dull and ordinary; matter-of-fact","ety2":"Literally 'of prose', as opposed to poetry — hence plain and unimaginative.","syn":["humdrum","pedestrian","insipid","vapid","jejune"]},{"id":"quotidian","w":"quotidian","pos":"adjective","d":"daily; ordinary and everyday","ex":"Doing dishes and paying bills are quotidian chores.","ety":"Latin quotidie (every day); -dian from dies (day), as in diurnal (daytime). Synonyms: routine, garden-variety.","src":[{"c":"ttc","n":10},{"c":"va","n":42}],"pr":"kwoh-TID-ee-un","d2":"daily; ordinary and commonplace","ety2":"Latin quotidianus, daily.","syn":["daily","diurnal","everyday","mundane","humdrum"]},{"id":"hoi-polloi","w":"hoi polloi","pos":"noun","d":"the common people; the masses","ex":"The heiress chartered private jets to avoid the hoi polloi.","ety":"Greek 'the many'; polloi is related to poly (many) as in polygon. Not to be confused with hoity-toity.","src":[{"c":"ttc","n":10}]},{"id":"banal","w":"banal","pos":"adjective","d":"so lacking in originality as to be boring; trite","ex":"He could only manage banal remarks about the weather.","ety":"Synonyms: trite, stale, threadbare, hackneyed (from a 'hack', a writer for hire who reuses tired phrases).","src":[{"c":"ttc","n":10},{"c":"bri","n":21},{"c":"va","n":29}],"pic":"bone + owl","hook":"An owl tosses away a bone because it's too plain and ordinary.","syn":["trite","clichéd","bland"],"ant":["original","fresh"],"d2":"so unoriginal as to be dull and boring","pr":"buh-NAL, BAY-nul or buh-NAHL","tip":"All three pronunciations are acceptable.","rel":["banality — triteness"],"ety2":"Originally the mill and ovens shared by everyone on a feudal manor — hence 'common'."},{"id":"bromide","w":"bromide","pos":"noun","d":"a trite, overused saying meant to soothe; a platitude","ex":"The coach offered the usual bromides about giving 110%.","ety":"Originally a sedative made with bromine — a bromide dulls your senses.","src":[{"c":"ttc","n":10}]},{"id":"patrician","w":"patrician","pos":"noun / adjective","d":"an aristocrat; having refined, upper-class manners and tastes","ex":"Her patrician tastes ran to opera and fine dining.","ety":"Latin pater (father): the founding families of Rome. Opposite: plebeian (common, lower class).","src":[{"c":"ttc","n":10}]},{"id":"nonpareil","w":"nonpareil","pos":"adjective / noun","d":"having no equal; unrivaled","ex":"Messi is a dribbler nonpareil.","ety":"French non (not) + pareil (equal). Often placed after the noun: 'a writer nonpareil'.","src":[{"c":"ttc","n":10}]},{"id":"hackneyed","w":"hackneyed","pos":"adjective","d":"overused and therefore unoriginal and dull","ex":"The film was full of hackneyed phrases.","ety":"From hackney, a horse for hire — then a hired 'hack' writer.","src":[{"c":"ttc","n":10}]},{"id":"sisyphean","w":"Sisyphean","pos":"adjective","d":"endlessly laborious and futile","ex":"Keeping up with my inbox is a Sisyphean task.","ety":"King Sisyphus cheated death twice; the gods sentenced him to push a boulder up a hill forever — it always rolled back down just before the top.","src":[{"c":"ttc","n":11}]},{"id":"herculean","w":"Herculean","pos":"adjective","d":"requiring tremendous strength or effort","ex":"Rebuilding the city was a Herculean job.","ety":"From the hero Hercules and his twelve labors. Herculean stresses huge effort; Sisyphean stresses endless futility.","src":[{"c":"ttc","n":11}]},{"id":"sword-of-damocles","w":"sword of Damocles","pos":"noun phrase","d":"a constant, looming threat; an impending disaster","ex":"The layoffs hung over the office like a sword of Damocles.","ety":"The flatterer Damocles envied King Dionysius, so the king let him rule for a day — beneath a sword hanging by a single horsehair. Power brings constant fear.","src":[{"c":"ttc","n":11}]},{"id":"gordian-knot","w":"Gordian knot","pos":"noun phrase","d":"an extremely complicated, seemingly unsolvable problem; 'to cut the Gordian knot' = to solve it with bold, decisive action","ex":"The new manager cut the Gordian knot by scrapping the old system entirely.","ety":"King Gordius tied an impossible knot; whoever undid it would rule Asia. Alexander the Great simply sliced through it with his sword.","src":[{"c":"ttc","n":11}]},{"id":"mercurial","w":"mercurial","pos":"adjective","d":"subject to sudden, unpredictable changes of mood; also lively and quick-witted","ex":"Her mercurial temper kept everyone on edge.","ety":"From Mercury (Greek Hermes), the swift, tricky messenger god — and the liquid metal quicksilver that never holds its shape.","src":[{"c":"ttc","n":11},{"c":"va","n":38}],"pr":"mur-KYOOR-ee-ul","rel":["caduceus — Mercury's snake-twined staff, now a medical symbol"],"d2":"changing mood quickly and unpredictably","ety2":"From Mercury, the swift messenger god.","syn":["volatile","capricious","fickle","erratic","protean"],"ant":["stable","steadfast","constant","immutable"]},{"id":"saturnalia","w":"saturnalia","pos":"noun","d":"a wild celebration of unrestrained revelry","ex":"The victory party turned into a saturnalia that lasted until dawn.","ety":"Saturnalia, Rome's December festival for Saturn, with feasting, gambling, gifts and masters serving slaves.","src":[{"c":"ttc","n":11},{"c":"va","n":45}],"pr":"sat-ur-NAY-lee-uh","d2":"a period of wild, unrestrained revelry","ety2":"The Roman Saturnalia, a December festival of Saturn when the usual rules were suspended.","syn":["orgy","bacchanal","revelry","debauch"]},{"id":"saturnine","w":"saturnine","pos":"adjective","d":"gloomy, sullen and brooding","ex":"The saturnine poet rarely smiled.","ety":"Astrologers believed people born under slow, cold, distant Saturn were gloomy. Synonyms: morose, glum, dour, sullen.","src":[{"c":"ttc","n":11},{"c":"va","n":47}],"pr":"SAT-ur-nyn","tip":"Compare jovial (born under Jupiter) and mercurial (under Mercury).","d2":"gloomy, sullen and grave in temperament","ety2":"Latin Saturnus: astrologers held that people born under Saturn were heavy and gloomy.","syn":["morose","melancholy","sullen","dour","taciturn"],"ant":["jovial","sanguine","mercurial","cheerful"]},{"id":"promethean","w":"Promethean","pos":"adjective","d":"daringly original, creative and boldly inventive","ex":"Einstein's Promethean ideas changed how we see the universe.","ety":"Prometheus ('forethought') shaped humans from clay and stole fire from the gods to give them — and was chained to a mountain as punishment.","src":[{"c":"ttc","n":11}]},{"id":"supercilious","w":"supercilious","pos":"adjective","d":"behaving as if one is superior; haughtily disdainful","ex":"The supercilious maître d' looked me up and down.","ety":"Latin super (above) + cilium (eyelash) → supercilium, the eyebrow. Picture a snob raising an eyebrow.","src":[{"c":"ttc","n":12},{"c":"bri","n":32},{"c":"va","n":26}],"pic":"super + silly","hook":"A haughty superintendent struts in a Supergirl costume — with toilet paper on her heel.","syn":["haughty","arrogant","condescending"],"ant":["humble","modest"],"d2":"behaving as if one is superior to others; haughty","pr":"soo-pur-SIL-ee-us","ety2":"Latin super (above) + cilium (eyelid, eyebrow): with raised eyebrows."},{"id":"bumptious","w":"bumptious","pos":"adjective","d":"loudly and offensively self-assertive; pushy","ex":"A bumptious driver cut to the front of the traffic jam.","ety":"Probably bump + presumptuous: someone who bumps you out of the way.","src":[{"c":"ttc","n":12}]},{"id":"hubris","w":"hubris","pos":"noun","d":"excessive pride or self-confidence that leads to downfall","ex":"The CEO's hubris led him to ignore every warning.","ety":"Greek: arrogance toward the gods. Odysseus taunted the blinded Cyclops with his real name — and Poseidon punished him for ten years. Adjective: hubristic.","src":[{"c":"ttc","n":12}]},{"id":"bombast","w":"bombast","pos":"noun","d":"pompous, inflated language with little substance","ex":"The speech was all bombast and no plan.","ety":"In the 1500s bombast was cotton stuffing for cushions — padding to fill something empty. Adjective: bombastic.","src":[{"c":"ttc","n":12}]},{"id":"bloviate","w":"bloviate","pos":"verb","d":"to talk at length in a pompous, boastful way","ex":"The pundit bloviated for an hour without saying anything.","ety":"An 1800s Americanism built on 'blow' — a blowhard full of hot air. Revived to describe President Harding's speeches.","src":[{"c":"ttc","n":12}]},{"id":"sycophant","w":"sycophant","pos":"noun","d":"a self-seeking flatterer who sucks up to people with power","ex":"The sycophants who flattered the teacher all got A's.","ety":"Vivid synonyms: bootlicker, toady, lickspittle, groveler.","src":[{"c":"ttc","n":12},{"c":"va","n":28}],"pr":"SIK-uh-funt","rel":["sycophantic — fawning"],"d2":"a servile flatterer who seeks favor from the powerful","ety2":"Greek, 'fig-shower' — perhaps an informer on illegal fig exporters. Toady may come from the mountebank's 'toad-eater' assistant.","syn":["toady","flatterer","yes-man","lackey"]},{"id":"obsequious","w":"obsequious","pos":"adjective","d":"excessively eager to please or obey; servile","ex":"The obsequious butler agreed with every word his employer said.","ety":"Latin sequ (follow), keyword sequence: obsequious people follow others around to gain favor.","src":[{"c":"ttc","n":12},{"c":"va","n":31}],"pr":"ub-SEE-kwee-us","d2":"excessively eager to please or obey; fawning","syn":["servile","sycophantic","fawning","toadying","ingratiating"],"ant":["defiant","refractory","recalcitrant"]},{"id":"wheedle","w":"wheedle","pos":"verb","d":"to coax someone into or out of something with flattery and charm","ex":"She wheedled her dad into lending her the car.","ety":"Synonyms: cajole, coax. Typical pairs: wheedle into, wheedle out of.","src":[{"c":"ttc","n":12}]},{"id":"blandishments","w":"blandishments","pos":"noun (usually plural)","d":"flattering words or actions used to persuade","ex":"He was deaf to the blandishments of his entourage.","ety":"From Latin blandus (smooth, flattering).","src":[{"c":"ttc","n":12}]},{"id":"unctuous","w":"unctuous","pos":"adjective","d":"excessively flattering and insincere in an oily, slick way","ex":"The unctuous salesman oozed charm from every pore.","ety":"Latin unctus (anointed with oil) — think oily. Down-to-earth synonym: smarmy.","src":[{"c":"ttc","n":12}]},{"id":"orotund","w":"orotund","pos":"adjective","d":"full and resonant (of a voice); pompous and pretentious (of speech or writing)","ex":"His orotund voice filled the hall.","ety":"Latin ore rotundo, 'with a round mouth'. Positive for voices, negative for prose.","src":[{"c":"ttc","n":12}]},{"id":"prescient","w":"prescient","pos":"adjective","d":"having knowledge of events before they happen; showing foresight","ex":"A prescient economist predicted the crash years ahead.","ety":"pre (before) + sci (know, as in science): knowing beforehand. Noun: prescience.","src":[{"c":"ttc","n":13}]},{"id":"manumit","w":"manumit","pos":"verb","d":"to release someone from slavery","ex":"He manumitted the people he had enslaved in his will.","ety":"Latin manus (hand) + mittere (send, let go): to release from one's hand. Noun: manumission; synonym: emancipate.","src":[{"c":"ttc","n":13},{"c":"va","n":45}],"pr":"man-yuh-MIT","rel":["manumission — release from slavery"],"d2":"to free from slavery","ety2":"Latin manus (hand) + mittere (to send, let go).","syn":["emancipate","liberate","free","enfranchise","disenthrall"],"ant":["enslave","subjugate","shackle","trammel"]},{"id":"adumbrate","w":"adumbrate","pos":"verb","d":"to outline sketchily; or to foreshadow vaguely","ex":"The opening scene adumbrates the hero's fall.","ety":"Latin umbra (shadow): to cast a faint shadow of what's to come.","src":[{"c":"ttc","n":13}]},{"id":"umbrage","w":"umbrage","pos":"noun","d":"offense or annoyance (usually 'take umbrage')","ex":"She took umbrage at his remarks about her cooking.","ety":"From umbra (shadow) → suspicion, the 'shady' feeling of being insulted.","src":[{"c":"ttc","n":13},{"c":"va","n":32}],"pr":"UM-brij","tip":"Usually in the phrase 'take umbrage'.","d2":"offense or resentment","ety2":"Latin umbra, shade — a 'shadow' of displeasure.","syn":["offense","resentment","pique","indignation"]},{"id":"ineluctable","w":"ineluctable","pos":"adjective","d":"unable to be avoided; inescapable","ex":"Change is ineluctable.","ety":"in (not) + eluctari (struggle out of).","src":[{"c":"ttc","n":13}]},{"id":"ineffable","w":"ineffable","pos":"adjective","d":"too great or extreme to be expressed in words","ex":"They felt ineffable joy at their daughter's birth.","ety":"in (not) + effari (speak out).","src":[{"c":"ttc","n":13},{"c":"va","n":40}],"pr":"in-EF-uh-bul","tip":"Usually of good things: ineffable joy, ineffable beauty.","d2":"too great to be expressed in words","ety2":"Latin ineffabilis, unutterable.","syn":["inexpressible","indescribable","unutterable","unspeakable"]},{"id":"euphemism","w":"euphemism","pos":"noun","d":"a mild word substituted for one that seems too blunt or harsh","ex":"'Passed away' is a euphemism for 'died'.","ety":"Greek eu (good) + pheme (speech).","src":[{"c":"ttc","n":13}]},{"id":"euphonious","w":"euphonious","pos":"adjective","d":"pleasing to the ear","ex":"She has a euphonious voice.","ety":"Greek eu (good) + phon (sound).","src":[{"c":"ttc","n":13}]},{"id":"dogmatic","w":"dogmatic","pos":"adjective","d":"arrogantly insisting that one's unproven opinions are true; closed-minded","ex":"His dogmatic adherence to old methods bankrupted the firm.","ety":"Greek dogma originally meant simply 'opinion, what one thinks is true'. Related: doctrinaire (rigidly sticking to a theory), imperious (overbearing).","src":[{"c":"ttc","n":14}]},{"id":"pontificate","w":"pontificate","pos":"verb","d":"to express opinions in a pompous, dogmatic way, usually at length","ex":"My roommate pontificates about topics she knows nothing about.","ety":"From pontiff (a high priest or pope). Picture a pompous preacher who never stops.","src":[{"c":"ttc","n":14},{"c":"va","n":19}],"pr":"pahn-TIF-i-kayt","rel":["dogmatic — stating opinions as if they were facts","pontification — pompous pronouncement"],"d2":"to speak in a pompous, dogmatic way, as if issuing official decrees","ety2":"From pontiff, the pope (Latin pontifex), whose official decrees carry absolute authority."},{"id":"apostate","w":"apostate","pos":"noun","d":"a person who abandons their religion, political party, principles or cause","ex":"The group branded anyone who left as an apostate.","ety":"Greek apo (away) + stenai (to stand): one who stands away from former beliefs. Noun: apostasy. (Apostle shares apo- but comes from 'send'.)","src":[{"c":"ttc","n":14}]},{"id":"agitprop","w":"agitprop","pos":"noun / adjective","d":"political propaganda spread through art, music, drama or literature","ex":"The critic called the film left-wing agitprop — but entertaining.","ety":"A portmanteau of agitation + propaganda, from a Soviet Communist Party department.","src":[{"c":"ttc","n":14}]},{"id":"perfidious","w":"perfidious","pos":"adjective","d":"deceitful, treacherous and disloyal","ex":"The perfidious soldier sold his general's plans to the enemy.","ety":"Latin per (through, beyond) + fid (faith): going beyond the limits of trust. Noun: perfidy. Think Benedict Arnold.","src":[{"c":"ttc","n":14}]},{"id":"equivocal","w":"equivocal","pos":"adjective","d":"open to more than one interpretation, often deliberately to mislead","ex":"The suspect gave equivocal answers to direct questions.","ety":"Latin equ (equal) + voc (voice, call): giving equal voice to different meanings. Verb: equivocate. Opposite: unequivocal.","src":[{"c":"ttc","n":14}]},{"id":"ambiguous","w":"ambiguous","pos":"adjective","d":"unclear because it can be understood in more than one way","ex":"'Police discover crack in Australia' is an ambiguous headline.","ety":"Latin ambi (both). Unlike equivocal, no intent to deceive is implied.","src":[{"c":"ttc","n":14},{"c":"va","n":8}],"pr":"am-BIG-yoo-us","d2":"open to more than one interpretation; unclear","syn":["equivocal","enigmatic","vague"],"ant":["unequivocal","distinct","manifest"]},{"id":"ambivalent","w":"ambivalent","pos":"adjective","d":"having mixed or contradictory feelings about something","ex":"I'm ambivalent about moving — excited and anxious at once.","ety":"Latin ambi (both) + valent (being strong): both sides pull equally.","src":[{"c":"ttc","n":14},{"c":"va","n":19}],"pr":"am-BIV-uh-lunt","rel":["ambivalence — mixed feelings"],"d2":"having mixed or conflicting feelings at the same time","ety2":"Latin ambi- (both) + valere (to be strong): strong feelings both ways. Ambi- also gives ambidextrous and ambivert."},{"id":"dissemble","w":"dissemble","pos":"verb","d":"to hide one's true feelings, motives or nature behind a false appearance","ex":"He dissembled and told his aunt the meatloaf was delicious.","ety":"Related to resemble (Latin simulare, to pretend): a dissembler tries to resemble something they're not.","src":[{"c":"ttc","n":14},{"c":"va","n":26}],"pr":"di-SEM-bul","tip":"Close to affect (to put on a false show), as in affecting a carefree manner.","d2":"to hide one's true feelings or motives behind a false appearance","ety2":"Old French, to appear different.","syn":["feign","pretend","disguise","mask"]},{"id":"diffident","w":"diffident","pos":"adjective","d":"shy and lacking self-confidence","ex":"The diffident student rarely spoke up.","ety":"dif (= dis, lack of) + fid (trust): lacking trust in oneself.","src":[{"c":"ttc","n":14},{"c":"va","n":42}],"pr":"DIF-i-dunt","rel":["diffidence — shyness"],"ety2":"Latin dis- (not) + fidere (to trust): lacking trust in oneself.","syn":["shy","timid","bashful","self-effacing","timorous"],"ant":["confident","assertive","brash","audacious"]},{"id":"credulous","w":"credulous","pos":"adjective","d":"too ready to believe things; gullible","ex":"Credulous investors fell for the scheme.","ety":"Latin credere (believe). Opposite: incredulous (unwilling to believe, skeptical).","src":[{"c":"ttc","n":14}]},{"id":"laconic","w":"laconic","pos":"adjective","d":"using very few words; terse","ex":"My teenager's laconic answer to everything is 'good'.","ety":"From Laconia, the region of Sparta. When Philip of Macedon threatened, 'If I enter Laconia, I will raze Sparta,' the Spartans replied with one word: 'If.' Opposite: loquacious.","src":[{"c":"ttc","n":15},{"c":"va","n":12}],"pr":"luh-KAHN-ik","tip":"Pithy = brief and full of meaning; laconic = brief to the point of seeming abrupt.","d2":"using very few words, often bluntly","ety2":"From Laconia, home of the Spartans, famous for their austere ways and short speech. Caesar's 'I came, I saw, I conquered' is a classic laconic line, as is Calvin Coolidge's reply to a bet that he couldn't be made to say more than two words: 'You lose.'","syn":["terse","succinct","pithy","curt"]},{"id":"pithy","w":"pithy","pos":"adjective","d":"brief but full of meaning and force","ex":"The defense attorney's pithy argument won the case.","ety":"From pith, the spongy core of a plant stem — the essential part. Related to pit (a peach pit). Think of Yoda's sayings.","src":[{"c":"ttc","n":15}]},{"id":"obloquy","w":"obloquy","pos":"noun","d":"strong public criticism or verbal abuse; the disgrace that results","ex":"His unpopular vote brought obloquy from the opposition.","ety":"Latin ob (against) + loq (speak): speech against someone.","src":[{"c":"ttc","n":15}]},{"id":"foment","w":"foment","pos":"verb","d":"to stir up or incite trouble, such as a riot or rebellion","ex":"Agitators tried to foment an uprising.","ety":"Hook: you stir up or whip up FOAM. Common pairs: foment a riot, foment rebellion.","src":[{"c":"ttc","n":15}]},{"id":"fulminate","w":"fulminate","pos":"verb","d":"to protest or denounce thunderously; also to explode violently","ex":"The preacher fulminated against gambling and video games.","ety":"Latin fulmen (lightning flash). Usually 'fulminate against'. Synonyms: rail against, upbraid, excoriate.","src":[{"c":"ttc","n":15},{"c":"va","n":48}],"pr":"FUL-muh-nayt","rel":["fulmination — a thundering denunciation"],"d2":"to thunder against; denounce loudly","ety2":"Latin fulmen, a thunderbolt.","syn":["rail","inveigh","denounce","thunder","rant"]},{"id":"philippic","w":"philippic","pos":"noun","d":"a bitter, violent verbal attack","ex":"The losing coach launched into a fifteen-minute philippic against reporters.","ety":"From Demosthenes' speeches denouncing King Philip of Macedon. Synonyms: invective, diatribe, tirade, harangue.","src":[{"c":"ttc","n":15}]},{"id":"vilify","w":"vilify","pos":"verb","d":"to speak or write about someone in an abusively disparaging way","ex":"The scientist was vilified until other studies proved her right.","ety":"Related to vile: you say vile things about someone. Cousins: malign, defame, denigrate, besmirch, sully.","src":[{"c":"ttc","n":15},{"c":"va","n":44}],"pr":"VIL-uh-fy","rel":["vilification — a vicious verbal attack"],"d2":"to attack with abusive, defamatory language","ety2":"Latin vilis, cheap, worthless — also vile.","syn":["defame","malign","denigrate","revile","calumniate","traduce"],"ant":["praise","laud","extol","eulogize"]},{"id":"calumny","w":"calumny","pos":"noun","d":"a false statement made to damage someone's reputation; slander","ex":"The neighbors' calumnies forced him to leave town.","ety":"Stress on the first syllable: KAL-um-nee. Verb: calumniate.","src":[{"c":"ttc","n":15},{"c":"va","n":44}],"pr":"KAL-um-nee","rel":["calumniate — to slander","calumnious — slanderous"],"d2":"a false, malicious statement meant to damage someone's reputation","ety2":"Latin calumnia, a trick.","syn":["slander","defamation","vilification","aspersion"]},{"id":"bowdlerize","w":"bowdlerize","pos":"verb","d":"to remove material considered offensive from a text, often prudishly","ex":"The network bowdlerized the film for prime time.","ety":"An eponym: Thomas Bowdler published 'The Family Shakespeare' (1818) with all the racy bits removed.","src":[{"c":"ttc","n":15}]},{"id":"loquacious","w":"loquacious","pos":"adjective","d":"very talkative","ex":"Our loquacious guide never paused for breath.","ety":"Latin loq (speak). Opposite of laconic.","src":[{"c":"ttc","n":15}]},{"id":"invective","w":"invective","pos":"noun","d":"insulting, abusive language","ex":"He hurled invective at the referee.","ety":"Latin invehi (to attack). Related: vituperation (adj. vituperative).","src":[{"c":"ttc","n":15},{"c":"va","n":33}],"pr":"in-VEK-tiv","rel":["inveigh — to protest bitterly (always 'inveigh against')","obloquy — speech meant to defame","billingsgate — coarse, foul abuse (from a London fish market)"],"d2":"bitter, abusive language; vehement denunciation","ety2":"Latin invehi, to attack with words — also inveigh.","syn":["vituperation","obloquy","billingsgate","diatribe","objurgation"],"ant":["praise","commendation","encomium","eulogy"]},{"id":"maunder","w":"maunder","pos":"verb","d":"to talk in a rambling, aimless or incoherent way","ex":"He maundered on for twenty minutes without answering my question.","ety":"Probably a variant of meander (to wander), from the winding Maeander River. The opposite of pithy. Synonyms: babble, prattle.","src":[{"c":"ttc","n":16}]},{"id":"pillory","w":"pillory","pos":"verb / noun","d":"to expose someone to public ridicule and harsh criticism; (noun) a wooden frame that locked an offender's head and hands for public shaming","ex":"The pitcher was pilloried by fans and press alike.","ety":"Medieval pillories stood in marketplaces so passers-by could mock the guilty.","src":[{"c":"ttc","n":16}]},{"id":"jeremiad","w":"jeremiad","pos":"noun","d":"a long, bitter lament or list of complaints, often predicting doom","ex":"Her column was another jeremiad about the decline of manners.","ety":"Eponym: the prophet Jeremiah, who foretold and lamented the fall of Judah. Often 'a jeremiad against …'.","src":[{"c":"ttc","n":16}]},{"id":"badinage","w":"badinage","pos":"noun","d":"light, playful teasing banter","ex":"Hepburn and Tracy were famous for their witty badinage.","ety":"French badiner (to joke). Hook: two people 'bat' teasing re
