piercing to the feelings; also sharp or keen","ex":"The film ends with a poignant farewell.","syn":["touching","moving","piercing","pungent"],"pr":"POYN-yunt","tip":"The g is silent: POYN-yunt.","src":[{"c":"va","n":6}]},{"id":"nebulous","w":"nebulous","pos":"adjective","d":"vague, hazy, unclear","ex":"His plans for the business are still nebulous.","ety":"Latin for cloudy, like a nebula (a cloud of gas and dust in space; plural nebulae).","pr":"NEB-yuh-lus","tip":"Let 'nebular' mean cloudy and keep 'nebulous' for vague.","src":[{"c":"va","n":6}]},{"id":"clandestine","w":"clandestine","pos":"adjective","d":"done in secret, often for an improper purpose","ex":"They held clandestine meetings in a parking garage.","syn":["covert","furtive","stealthy","surreptitious"],"pr":"klan-DES-tin","tip":"Preferred: klan-DES-tin. Avoid the newer variants KLAN-des-tyn and klan-des-TEEN.","src":[{"c":"va","n":6}]},{"id":"tirade","w":"tirade","pos":"noun","d":"a long, angry, abusive speech","ex":"The coach launched into a tirade after the loss.","syn":["harangue","diatribe","rant"],"pr":"TY-rayd","tip":"Tirades are protracted (long), vituperative (abusive) and censorious (blaming).","src":[{"c":"va","n":6}]},{"id":"recur","w":"recur","pos":"verb","d":"to happen again, especially repeatedly or at intervals","ex":"The headaches recur every few weeks.","pr":"ri-KUR","tip":"Theodore Bernstein's distinction: reoccur suggests happening once more; recur suggests happening again and again.","src":[{"c":"va","n":6}]},{"id":"tacit","w":"tacit","pos":"adjective","d":"understood or implied without being said","ex":"Their silence gave tacit approval to the plan.","ety":"Latin tacere, to be silent — also the root of taciturn (reserved, saying little).","pr":"TAS-it","src":[{"c":"va","n":6}]},{"id":"allegation","w":"allegation","pos":"noun","d":"a claim or accusation made without proof yet","ex":"The company denied the allegations of fraud.","pr":"al-i-GAY-shun","rel":["allege — to assert without proof"],"src":[{"c":"va","n":6}]},{"id":"gullible","w":"gullible","pos":"adjective","d":"easily fooled or cheated","ex":"Gullible investors lost their savings to the scheme.","syn":["credulous","naive"],"pr":"GUL-uh-bul","rel":["gull — to trick someone who is unwary"],"src":[{"c":"va","n":7}]},{"id":"benign","w":"benign","pos":"adjective","d":"kindly and gentle; favorable; (medicine) not harmful","ex":"The tumor turned out to be benign.","syn":["kindly","gracious","mild","salubrious"],"ant":["malign","malignant"],"pr":"bi-NYN","src":[{"c":"va","n":7}]},{"id":"peripheral","w":"peripheral","pos":"adjective","d":"on the outer edge; hence, minor or not essential","ex":"Let's skip the peripheral issues and focus on cost.","pr":"puh-RIF-uh-rul","rel":["periphery — the outer boundary or edge"],"src":[{"c":"va","n":7}]},{"id":"rebuff","w":"rebuff","pos":"verb / noun","d":"to reject bluntly; a blunt refusal","ex":"She rebuffed his offer of help.","syn":["snub","spurn","repulse"],"pr":"ri-BUF","src":[{"c":"va","n":7}]},{"id":"animosity","w":"animosity","pos":"noun","d":"strong dislike or ill will","ex":"There was long-standing animosity between the rivals.","syn":["hostility","enmity","antipathy","rancor","malevolence"],"pr":"an-uh-MAH-si-tee","src":[{"c":"va","n":7}]},{"id":"tenuous","w":"tenuous","pos":"adjective","d":"thin, slight, flimsy; weakly supported","ex":"The link between the two cases is tenuous at best.","syn":["flimsy","slender","shaky","insubstantial"],"pr":"TEN-yoo-us","src":[{"c":"va","n":7}]},{"id":"complacent","w":"complacent","pos":"adjective","d":"smugly self-satisfied and unaware of dangers or others' needs","ex":"Winning three years in a row made the team complacent.","pr":"kum-PLAY-sunt","tip":"Don't confuse with complaisant (kum-PLAY-zunt), which means eager to please, obliging.","src":[{"c":"va","n":7}]},{"id":"acme","w":"acme","pos":"noun","d":"the highest point; the peak of achievement","ex":"At the acme of her career she ran three companies.","ety":"Straight from Greek akme, highest point. Elster remembers it through Wile E. Coyote's Acme products — and the cliffs he falls off.","ant":["nadir — the lowest point"],"pr":"AK-mee","src":[{"c":"va","n":7}]},{"id":"defunct","w":"defunct","pos":"adjective","d":"no longer existing, operating or in use","ex":"The factory has been defunct for a decade.","ety":"Latin defunctus, dead, finished.","syn":["extinct","obsolete","dead"],"pr":"di-FUNGKT","src":[{"c":"va","n":7}]},{"id":"abet","w":"abet","pos":"verb","d":"to encourage or assist, often in wrongdoing","ex":"He was charged with aiding and abetting the robbery.","pr":"uh-BET","tip":"Usually negative ('aid and abet' a crime), but can be used favorably: to abet the cause of justice.","src":[{"c":"va","n":7}]},{"id":"haggard","w":"haggard","pos":"adjective","d":"looking exhausted, worn out and gaunt","ex":"After three sleepless nights she looked haggard.","syn":["gaunt","drawn","careworn","emaciated"],"pr":"HAG-urd","src":[{"c":"va","n":8}]},{"id":"waive","w":"waive","pos":"verb","d":"to give up a right or claim voluntarily; to set aside","ex":"He waived his right to a jury trial.","pr":"WAYV","tip":"Relinquish suggests giving up reluctantly; waive suggests choosing not to insist on a right.","src":[{"c":"va","n":8}]},{"id":"carnal","w":"carnal","pos":"adjective","d":"relating to the body's physical, especially sexual, appetites","ex":"The sermon warned against carnal desires.","pr":"KAR-nul","tip":"Not a general word for 'bodily': we don't say carnal aches and pains.","src":[{"c":"va","n":8}]},{"id":"sanction","w":"sanction","pos":"verb / noun","d":"to give official approval to; official permission (also, as a noun, a penalty)","ex":"The board sanctioned the merger.","pr":"SANGK-shun","tip":"Ratify = approve officially what a representative did; certify = officially confirm that standards are met; sanction = give authoritative approval.","src":[{"c":"va","n":8}]},{"id":"spendthrift","w":"spendthrift","pos":"noun / adjective","d":"a person who wastes money; wasteful","ex":"His spendthrift habits drove the company into debt.","syn":["prodigal","profligate","improvident"],"pr":"SPEND-thrift","rel":["improvident — not providing for the future","prodigal — recklessly extravagant (the prodigal son)","profligate — wildly extravagant and pleasure-seeking"],"src":[{"c":"va","n":8}]},{"id":"mollify","w":"mollify","pos":"verb","d":"to calm or soothe someone's anger; to soften","ex":"Nothing the manager said could mollify the angry customer.","ety":"Latin mollis (soft) + facere (to make): to make soft. Cousin: emollient, a softening cream.","syn":["pacify","placate","appease","assuage"],"pr":"MAHL-uh-fy","src":[{"c":"va","n":8}]},{"id":"unequivocal","w":"unequivocal","pos":"adjective","d":"perfectly clear; having only one possible meaning","ex":"The answer was an unequivocal no.","ant":["equivocal","ambiguous"],"pr":"un-i-KWIV-uh-kul","tip":"Five syllables, ending in -vocal. 'Unequivocable' is a common mistake.","src":[{"c":"va","n":8}]},{"id":"malleable","w":"malleable","pos":"adjective","d":"able to be shaped or molded; easily influenced","ex":"Young minds are malleable.","ety":"Latin malleus, hammer: capable of being hammered into shape. Compare tractable (from tractare, to handle — as in tractor).","syn":["pliable","tractable","impressionable"],"ant":["intransigent","obstinate","unyielding"],"pr":"MAL-ee-uh-bul","src":[{"c":"va","n":8}]},{"id":"verbose","w":"verbose","pos":"adjective","d":"using more words than needed; wordy","ex":"The verbose memo could have been a single paragraph.","ety":"Latin verbum, word — also verbal, verbatim (word for word) and verbiage (excess words).","syn":["wordy","long-winded","garrulous","loquacious","prolix"],"pr":"vur-BOHS","rel":["verbosity — wordiness"],"src":[{"c":"va","n":8}]},{"id":"transient","w":"transient","pos":"adjective / noun","d":"lasting only a short time; a person passing through","ex":"The town's transient population swells every summer.","syn":["transitory","evanescent","ephemeral","fugitive","fugacious"],"ant":["permanent","everlasting"],"pr":"TRAN-shunt","tip":"Elster prefers two syllables: TRAN-shunt (it sounds like 'ancient'). Also note short-lived and long-lived are traditionally said with a long i (LYVD), since they come from 'life'.","src":[{"c":"va","n":9}]},{"id":"repudiate","w":"repudiate","pos":"verb","d":"to reject firmly; to refuse to accept or be associated with","ex":"The senator repudiated the extremist group's endorsement.","syn":["renounce","disown","deny","disavow"],"pr":"ri-PYOO-dee-ayt","src":[{"c":"va","n":9}]},{"id":"impetuous","w":"impetuous","pos":"adjective","d":"acting quickly without thinking; impulsively eager","ex":"In an impetuous moment he quit his job.","syn":["rash","impulsive","hasty","precipitate"],"ant":["prudent","circumspect"],"pr":"im-PECH-oo-us","tip":"Rash = reckless daring; impulsive = driven by an inner urge; impetuous = full of energy and impatience.","src":[{"c":"va","n":9}]},{"id":"frugal","w":"frugal","pos":"adjective","d":"careful and sparing with money; inexpensive","ex":"They ate a frugal meal of soup and bread.","ety":"Latin frux, fruit: careful with the fruit of one's labor.","syn":["thrifty","economical","provident","parsimonious (stingy)"],"pr":"FROO-gul","src":[{"c":"va","n":9}]},{"id":"incongruous","w":"incongruous","pos":"adjective","d":"out of place; not fitting with what surrounds it","ex":"A tuxedo looks incongruous at a beach party.","ety":"in- (not) + congruous (fitting together harmoniously).","syn":["inappropriate","discordant","incompatible"],"pr":"in-KAHNG-groo-us","src":[{"c":"va","n":9}]},{"id":"corroborate","w":"corroborate","pos":"verb","d":"to confirm or support with additional evidence","ex":"Two witnesses corroborated her account.","ety":"Latin, to strengthen.","pr":"kuh-RAH-buh-rayt","tip":"Authenticate = prove genuine; verify = confirm accuracy; substantiate = back with evidence; corroborate = back up someone else's statement.","src":[{"c":"va","n":9}]},{"id":"embellish","w":"embellish","pos":"verb","d":"to decorate; to add details, sometimes untrue, to make a story more interesting","ex":"He embellished the story every time he told it.","ety":"Old French, to make beautiful; Latin bellus, pretty.","pr":"em-BEL-ish","rel":["embellishment — a decoration or added detail"],"src":[{"c":"va","n":9}]},{"id":"avaricious","w":"avaricious","pos":"adjective","d":"greedy for wealth","ex":"The avaricious landlord raised the rent again.","syn":["greedy","covetous","grasping","rapacious"],"pr":"av-uh-RISH-us","tip":"Greedy = wanting too much of anything; covetous = wanting what someone else has; avaricious = hoarding money.","rel":["avarice — greed for money"],"src":[{"c":"va","n":9}]},{"id":"cursory","w":"cursory","pos":"adjective","d":"quick and superficial; done without attention to detail","ex":"He gave the contract only a cursory glance.","ety":"Latin currere, to run — also course, curriculum, courier. Nothing to do with cursing.","syn":["hasty","perfunctory","superficial","slapdash"],"ant":["thorough","exhaustive"],"pr":"KUR-suh-ree","src":[{"c":"va","n":10}]},{"id":"clement","w":"clement","pos":"adjective","d":"mild (of weather); merciful and lenient (of people)","ex":"We hoped for clement weather on the wedding day.","ety":"Latin clemens, mild.","ant":["inclement — stormy, harsh"],"pr":"KLEM-unt","rel":["clemency — mercy, leniency"],"src":[{"c":"va","n":10}]},{"id":"lucrative","w":"lucrative","pos":"adjective","d":"producing a lot of money; profitable","ex":"She left teaching for a lucrative job in sales.","ety":"Latin lucrum, gain — also lucre (money, as in Shakespeare's 'filthy lucre').","syn":["profitable","remunerative","gainful"],"pr":"LOO-kruh-tiv","src":[{"c":"va","n":10}]},{"id":"allocate","w":"allocate","pos":"verb","d":"to set aside or assign for a particular purpose","ex":"The city allocated funds for a new library.","syn":["assign","earmark","apportion","allot"],"pr":"AL-uh-kayt","src":[{"c":"va","n":10}]},{"id":"paragon","w":"paragon","pos":"noun","d":"a model of excellence; a perfect example","ex":"The Gettysburg Address is a paragon of concise speechwriting.","syn":["model","epitome","exemplar","ideal"],"pr":"PAR-uh-gahn","src":[{"c":"va","n":10}]},{"id":"analogous","w":"analogous","pos":"adjective","d":"similar in some respects, so that a comparison can be made","ex":"The heart is analogous to a pump.","pr":"uh-NAL-uh-gus","tip":"Analogous things are alike in some ways, never identical.","rel":["analogy — a partial likeness used for comparison"],"src":[{"c":"va","n":10}]},{"id":"diurnal","w":"diurnal","pos":"adjective","d":"daily; also active in the daytime","ex":"Squirrels are diurnal; owls are nocturnal.","ety":"Latin diurnus, of a day.","ant":["nocturnal"],"pr":"dy-UR-nul","src":[{"c":"va","n":10}]},{"id":"pretext","w":"pretext","pos":"noun","d":"a false reason given to hide the real one","ex":"He used a family emergency as a pretext to leave early.","ety":"Latin praetextum, literally something woven in front — a front or cover.","syn":["excuse","pretense","ruse","guise"],"pr":"PREE-tekst","src":[{"c":"va","n":10}]},{"id":"defray","w":"defray","pos":"verb","d":"to pay or help pay the cost of","ex":"The grant will defray part of the travel expenses.","pr":"di-FRAY","tip":"Pay and defray aren't interchangeable: you pay a bill, but you defray (cover) a cost or a portion of it.","src":[{"c":"va","n":11}]},{"id":"terse","w":"terse","pos":"adjective","d":"brief and to the point; sometimes curt","ex":"He sent a terse reply: 'Not interested.'","syn":["concise","succinct","laconic","pithy"],"ant":["verbose","prolix","long-winded"],"pr":"TURS","tip":"Concise = nothing unnecessary; succinct = fewest possible words; terse = brief, pointed and polished, and sometimes brusque. Say suk-SINGKT, with the double c as ks — not suh-SINGKT.","src":[{"c":"va","n":11}]},{"id":"boon","w":"boon","pos":"noun","d":"a timely blessing or benefit","ex":"The new bus line has been a boon to commuters.","ety":"Once meant a favor asked of a king or queen ('grant me this boon'); that sense is now archaic.","pr":"BOON","rel":["supplicant — a person who begs humbly","supplication — humble, earnest begging"],"src":[{"c":"va","n":11}]},{"id":"proletariat","w":"proletariat","pos":"noun","d":"the working class, especially industrial wage earners","ex":"Marx predicted the proletariat would overthrow the owners of capital.","ety":"Latin proletarius, a Roman citizen of the lowest class.","pr":"proh-li-TAIR-ee-ut","rel":["proletarian — of the working class"],"src":[{"c":"va","n":11}]},{"id":"heterogeneous","w":"heterogeneous","pos":"adjective","d":"made up of different or unrelated kinds; mixed","ex":"The city has a wonderfully heterogeneous population.","ety":"Greek hetero- (other, different), as in heterodox. Its opposite uses homo- (same): homogeneous, homogenize, homonym.","ant":["homogeneous"],"pr":"het-ur-uh-JEE-nee-us","tip":"Five syllables: het-ur-uh-JEE-nee-us.","src":[{"c":"va","n":11}]},{"id":"pittance","w":"pittance","pos":"noun","d":"a very small amount, especially of money","ex":"He worked all summer for a pittance.","pr":"PIT-uns","tip":"Elster's memory trick: think of a fruit's pit — small and hard, like a pittance to live on.","src":[{"c":"va","n":11}]},{"id":"glib","w":"glib","pos":"adjective","d":"speaking smoothly and easily, but too smoothly to be sincere or thoughtful","ex":"The glib salesman had an answer for everything.","syn":["slick","smooth-tongued","facile","unctuous"],"pr":"GLIB","rel":["unctuous — oily, smarmily ingratiating (Latin unguere, to anoint; cousin of unguent, an ointment)"],"src":[{"c":"va","n":11}]},{"id":"penchant","w":"penchant","pos":"noun","d":"a strong liking or inclination","ex":"She has a penchant for spicy food.","syn":["propensity","proclivity","predilection","inclination"],"pr":"PEN-chunt","tip":"A propensity is a deep, often irresistible inclination; a proclivity leans toward something objectionable (a proclivity for violence).","src":[{"c":"va","n":11}]},{"id":"circumscribe","w":"circumscribe","pos":"verb","d":"to limit or confine; literally, to draw a line around","ex":"Her role was tightly circumscribed by the contract.","ety":"Latin circum (around) + scribere (to write, draw). The same circum- gives circumstance, circumvent (get around), circumnavigate and circumlocution (roundabout talk).","syn":["restrict","confine","delimit"],"pr":"SUR-kum-skryb","src":[{"c":"va","n":12}]},{"id":"ingratiating","w":"ingratiating","pos":"adjective","d":"trying to win favor by flattery or charm, usually insincerely","ex":"He flashed his ingratiating smile at the boss again.","ety":"Latin in (into) + gratia (grace): getting into someone's good graces.","syn":["unctuous","obsequious","fawning","sycophantic"],"pr":"in-GRAY-shee-ay-ting","src":[{"c":"va","n":12}]},{"id":"mercenary","w":"mercenary","pos":"adjective / noun","d":"motivated only by money; a soldier hired to fight for pay","ex":"His interest in the charity was purely mercenary.","syn":["greedy","avaricious","venal"],"pr":"MUR-suh-ner-ee","rel":["venal — open to bribery, corruptible"],"src":[{"c":"va","n":12}]},{"id":"extemporize","w":"extemporize","pos":"verb","d":"to speak or perform without preparation; to improvise","ex":"When the slides failed, she extemporized for ten minutes.","pr":"ek-STEM-puh-ryz","tip":"Improvise is the general word; extemporize usually refers to speaking off the cuff.","rel":["extemporaneous — spoken or done without preparation","impromptu — on the spur of the moment"],"src":[{"c":"va","n":12}]},{"id":"austere","w":"austere","pos":"adjective","d":"severe or stern; strictly simple, without comfort or ornament","ex":"The monks lived in austere cells with a bed and a chair.","syn":["stern","severe","dour","spartan","ascetic"],"pr":"aw-STEER","rel":["austerity — strict economy or simplicity"],"src":[{"c":"va","n":12}]},{"id":"ameliorate","w":"ameliorate","pos":"verb","d":"to make a bad situation better or more bearable","ex":"New housing programs aim to ameliorate conditions for the poor.","syn":["improve","alleviate","mitigate","amend"],"ant":["worsen","exacerbate"],"pr":"uh-MEEL-yuh-rayt","src":[{"c":"va","n":12}]},{"id":"expunge","w":"expunge","pos":"verb","d":"to erase completely, as if it had never existed","ex":"The judge ordered the conviction expunged from his record.","syn":["obliterate","eradicate","delete"],"pr":"ik-SPUNJ","tip":"Erase = rub out; cancel = cross out; delete = remove written material; expunge = wipe out every trace.","src":[{"c":"va","n":12}]},{"id":"foible","w":"foible","pos":"noun","d":"a minor weakness or flaw in character","ex":"His only foible is a fondness for terrible puns.","ety":"Originally the weaker part of a sword blade; related to feeble.","syn":["quirk","failing","idiosyncrasy"],"pr":"FOY-bul","src":[{"c":"va","n":13}]},{"id":"fervent","w":"fervent","pos":"adjective","d":"showing intense, passionate feeling","ex":"She is a fervent supporter of public libraries.","ety":"Latin fervere, to boil, glow — also behind fervid.","syn":["ardent","zealous","vehement","fervid"],"ant":["apathetic","indifferent","phlegmatic","listless"],"pr":"FUR-vunt","tip":"Fervent = warm and earnest; fervid = hotter, boiling over (a fervid debate).","src":[{"c":"va","n":13}]},{"id":"protract","w":"protract","pos":"verb","d":"to draw out or prolong, especially needlessly","ex":"The lawyers protracted the trial for months.","ety":"Latin trahere/tractare, to draw, drag.","ant":["curtail","abbreviate","truncate"],"pr":"proh-TRAKT","tip":"Prolong = make longer than usual; protract = drag out tediously.","src":[{"c":"va","n":13}]},{"id":"ostentatious","w":"ostentatious","pos":"adjective","d":"showy and designed to impress; flashy","ex":"They threw an ostentatious party with ice sculptures and fireworks.","syn":["flamboyant","flashy","pretentious","showy"],"ant":["modest","unassuming","plain"],"pr":"ahs-ten-TAY-shus","tip":"Pretentious = claiming importance you haven't earned; pompous = puffed up and self-solemn; ostentatious = putting on a vain, flashy show.","src":[{"c":"va","n":13}]},{"id":"quandary","w":"quandary","pos":"noun","d":"a state of perplexity or uncertainty about what to do","ex":"She was in a quandary over which offer to accept.","pr":"KWAHN-dree","tip":"A predicament is an unpleasant situation; a dilemma, strictly, is a choice between two equally bad options; a quandary is a state of doubt that leaves you unable to act. Two or three syllables: KWAHN-dree or KWAHN-duh-ree.","src":[{"c":"va","n":13}]},{"id":"censure","w":"censure","pos":"verb / noun","d":"to criticize sternly or reprimand formally; strong official disapproval","ex":"The Senate voted to censure the member for misconduct.","syn":["reprimand","condemn","denounce","reprehend"],"ant":["commend","extol","laud"],"pr":"SEN-shur","tip":"Don't confuse with censor, to suppress or cut objectionable material.","src":[{"c":"va","n":13}]},{"id":"cavil","w":"cavil","pos":"verb","d":"to raise petty, unnecessary objections","ex":"Critics caviled about the font while ignoring the book's ideas.","syn":["quibble","nitpick","niggle","carp"],"pr":"KAV-ul","src":[{"c":"va","n":13}]},{"id":"assimilate","w":"assimilate","pos":"verb","d":"to absorb and incorporate (ideas, food, people) so they become part of the whole","ex":"Immigrant families often assimilate within a generation. She assimilated the new rules quickly.","ety":"Latin ad (to) + similis (like): to make like.","syn":["absorb","incorporate","integrate","digest"],"pr":"uh-SIM-uh-layt","tip":"(This track is blank on your drive; entry written from the standard meaning.)","src":[{"c":"va","n":13}]},{"id":"rescind","w":"rescind","pos":"verb","d":"to cancel, repeal or take back","ex":"The company rescinded the job offer.","ety":"Latin, to cut back or away.","syn":["revoke","repeal","annul","nullify"],"pr":"ri-SIND","src":[{"c":"va","n":14}]},{"id":"discernible","w":"discernible","pos":"adjective","d":"able to be perceived or detected","ex":"There was no discernible difference between the copies.","ety":"Latin discernere, to sift apart, distinguish.","syn":["perceptible","detectable","evident","manifest"],"ant":["imperceptible","indistinct"],"pr":"di-SUR-nuh-bul","rel":["discern — to perceive, especially what is hidden","discernment — keen judgment","discerning — showing good judgment"],"src":[{"c":"va","n":14}]},{"id":"cataclysm","w":"cataclysm","pos":"noun","d":"a violent upheaval or disaster; originally a great flood","ex":"The war was a cataclysm that reshaped Europe.","ety":"Greek, to wash away. Disaster = 'bad star'; catastrophe = 'a down-turning' (the tragic final turn of a Greek play); debacle = a violent breakup of river ice, hence a collapse; calamity = a deeply personal misfortune.","pr":"KAT-uh-kliz-um","rel":["inundate — to flood or overwhelm"],"src":[{"c":"va","n":14}]},{"id":"narcissism","w":"narcissism","pos":"noun","d":"excessive self-love and self-admiration","ex":"His narcissism made it impossible for him to listen to others.","ety":"From Narcissus, the youth in Greek myth who fell in love with his own reflection.","syn":["vanity","egotism","conceit"],"pr":"NAR-suh-siz-um","tip":"(This track is blank on your drive; entry written from the standard meaning.)","src":[{"c":"va","n":14}]},{"id":"incriminate","w":"incriminate","pos":"verb","d":"to make someone appear guilty of a crime or wrongdoing","ex":"The emails incriminated two senior managers.","syn":["implicate","inculpate","accuse"],"ant":["exonerate","vindicate"],"pr":"in-KRIM-uh-nayt","src":[{"c":"va","n":14}]},{"id":"stigma","w":"stigma","pos":"noun","d":"a mark of shame or disgrace","ex":"The stigma of mental illness keeps many from seeking help.","ety":"Greek, a mark or brand, as burned into slaves and criminals.","pr":"STIG-muh","tip":"Plural: stigmas (or stigmata). Elster recommends STIG-muh-tuh for stigmata, with the traditional first-syllable stress.","rel":["stigmatize — to brand as shameful","stigmata — marks like Christ's wounds"],"src":[{"c":"va","n":14}]},{"id":"brevity","w":"brevity","pos":"noun","d":"shortness of time; conciseness of expression","ex":"Brevity is the soul of wit.","ety":"Latin brevis, short — also brief, and breve, the little curve over a vowel marking a short sound.","syn":["conciseness","succinctness","terseness","pithiness"],"pr":"BREV-i-tee","src":[{"c":"va","n":14}]},{"id":"indigent","w":"indigent","pos":"adjective / noun","d":"extremely poor; needy","ex":"The clinic offers free care to indigent patients.","syn":["impoverished","destitute","penniless","needy"],"ant":["affluent","wealthy"],"pr":"IN-di-junt","tip":"(This track is blank on your drive; entry written from the standard meaning.) Don't confuse with indignant (angry) or indigenous (native).","src":[{"c":"va","n":14}]},{"id":"clairvoyant","w":"clairvoyant","pos":"adjective / noun","d":"able to perceive things beyond normal senses; unusually perceptive; a person with that power","ex":"You don't need to be clairvoyant to see the merger coming.","ety":"French, from Latin clarus (clear) + videre (to see).","pr":"klair-VOY-unt","rel":["clairvoyance — exceptional insight"],"src":[{"c":"va","n":14}]},{"id":"adroit","w":"adroit","pos":"adjective","d":"skillful and clever, with the hands or the mind","ex":"She was adroit at steering the meeting away from trouble.","ety":"French à droit, 'to the right': English has always favored the right hand. Latin dexter (right) gives dexterous and ambidextrous; Latin sinister (left) came to mean evil; French gauche (left) means socially awkward.","syn":["deft","dexterous","adept","ingenious"],"ant":["maladroit","clumsy","inept","gauche"],"pr":"uh-DROYT","src":[{"c":"va","n":15}]},{"id":"platitude","w":"platitude","pos":"noun","d":"a dull, overused remark delivered as if it were profound","ex":"His speech was a string of platitudes about teamwork.","ety":"French plat, flat: a flat remark.","syn":["cliché","truism", {"id":"voluble","w":"voluble","pos":"adjective","d":"talking easily, rapidly and at length","ex":"The voluble tour guide never paused for breath.","syn":["talkative","garrulous","loquacious","effusive","glib"],"ant":["reticent","taciturn","terse","laconic"],"pr":"VAHL-yuh-bul","src":[{"c":"va","n":21}]},{"id":"commiserate","w":"commiserate","pos":"verb","d":"to express sympathy; to share someone's sorrow","ex":"Her coworkers commiserated with her when she lost the account.","ety":"Latin, to pity: by derivation, to share someone's misery.","pr":"kuh-MIZ-uh-rayt","rel":["condole — to express sympathy for a loss (condolence)"],"src":[{"c":"va","n":21}]},{"id":"dilemma","w":"dilemma","pos":"noun","d":"a situation requiring a choice between two equally undesirable options","ex":"He faced the dilemma of betraying a friend or lying to the court.","ety":"Greek di- (two) + lemma (proposition).","pr":"di-LEM-uh","tip":"Strictly, not just any problem. A quandary stresses confusion; a quagmire (literally a bog) stresses hopelessness. Informal: in a pickle, between a rock and a hard place.","src":[{"c":"va","n":21}]},{"id":"transitory","w":"transitory","pos":"adjective","d":"lasting only a short time; by nature bound to pass","ex":"Fame is transitory.","ety":"Latin transire, to go across — also transit and transition.","syn":["transient","ephemeral","evanescent","fleeting"],"ant":["permanent","enduring"],"pr":"TRAN-si-tor-ee","src":[{"c":"va","n":21}]},{"id":"philanthropic","w":"philanthropic","pos":"adjective","d":"generous in helping others, especially through large donations","ex":"The foundation funds philanthropic work around the world.","ety":"Greek philein (to love) + anthropos (human being): loving humankind. Compare philosophy, philharmonic, anthropology.","syn":["charitable","benevolent","humanitarian","altruistic"],"pr":"fil-un-THRAHP-ik","rel":["philanthropy — love of humanity shown by giving","philanthropist — a generous donor"],"src":[{"c":"va","n":21}]},{"id":"lethargy","w":"lethargy","pos":"noun","d":"sluggishness and lack of energy; drowsy dullness","ex":"A heavy lunch always left him in a state of lethargy.","syn":["torpor","lassitude","languor","somnolence"],"pr":"LETH-ur-jee","tip":"Apathy is lack of feeling or concern; lethargy is lack of energy.","rel":["lethargic — sluggish, drowsy"],"src":[{"c":"va","n":21}]},{"id":"pugnacious","w":"pugnacious","pos":"adjective","d":"eager to fight or argue; combative","ex":"The pugnacious senator picked a fight with every reporter.","ety":"Latin pugnare, to fight with fists — also pugilist, a boxer.","syn":["belligerent","bellicose","combative","contentious"],"ant":["peaceable","amicable","pacific"],"pr":"pug-NAY-shus","src":[{"c":"va","n":21}]},{"id":"contrition","w":"contrition","pos":"noun","d":"deep, sincere remorse for wrongdoing","ex":"He expressed genuine contrition and offered to repay everything.","ety":"Latin, a crushing: crushed by guilt.","pr":"kun-TRISH-un","tip":"Penitence = sorrow for a wrong (perhaps temporary); remorse = tortured guilt; contrition = crushing remorse with a real wish to make amends.","rel":["contrite — deeply sorry"],"src":[{"c":"va","n":21}]},{"id":"intractable","w":"intractable","pos":"adjective","d":"hard to manage or control; stubborn","ex":"The intractable dispute dragged on for years.","ety":"in- (not) + Latin tractare (to handle) — as in traction and tractor.","syn":["stubborn","unruly","obstinate","refractory"],"ant":["tractable","docile","compliant","malleable"],"pr":"in-TRAK-tuh-bul","src":[{"c":"va","n":22}]},{"id":"altruism","w":"altruism","pos":"noun","d":"unselfish concern for the welfare of others","ex":"She volunteers out of pure altruism.","ant":["egoism","selfishness"],"pr":"AL-troo-iz-um","rel":["altruist, altruistic","egoism — self-interest as a guiding principle","egotism — excessive talk about oneself"],"src":[{"c":"va","n":22}]},{"id":"accolade","w":"accolade","pos":"noun","d":"an award, praise or mark of honor","ex":"The film won accolades from critics around the world.","ety":"Latin ad (to) + collum (neck): originally the embrace and sword-tap on the shoulders that conferred knighthood. Also AK-uh-lahd and other variants.","pr":"AK-uh-layd","src":[{"c":"va","n":22}]},{"id":"chrysalis","w":"chrysalis","pos":"noun","d":"the pupa stage of a butterfly in its case; a sheltered, undeveloped stage","ex":"She emerged from the chrysalis of college ready for the world.","pr":"KRIS-uh-lis","tip":"A chrysalis is the protected stage, not the change itself. The transformation is a metamorphosis.","src":[{"c":"va","n":22}]},{"id":"genteel","w":"genteel","pos":"adjective","d":"refined and polite, often affectedly so","ex":"They lived in genteel poverty, keeping up appearances.","ety":"French gentil, noble, polite.","pr":"jen-TEEL","tip":"Today often implies excessive or pretended refinement.","src":[{"c":"va","n":22}]},{"id":"jovial","w":"jovial","pos":"adjective","d":"cheerful, good-humored and jolly","ex":"The jovial host greeted everyone with a joke.","ety":"From Jove (Jupiter), the merry, feast-loving chief Roman god — 'by Jove!'","syn":["merry","jolly","convivial","genial"],"ant":["morose","saturnine","dour"],"pr":"JOH-vee-ul","src":[{"c":"va","n":22}]},{"id":"subterfuge","w":"subterfuge","pos":"noun","d":"a trick or deception used to hide a motive or escape something","ex":"They got into the party by subterfuge.","ety":"Latin, to flee secretly.","syn":["ruse","stratagem","artifice","ploy"],"pr":"SUB-tur-fyooj","tip":"The -fuge rhymes with huge.","src":[{"c":"va","n":22}]},{"id":"ebullience","w":"ebullience","pos":"noun","d":"bubbling enthusiasm and high spirits","ex":"She couldn't contain her ebullience after the win.","ety":"Latin ebullire, to boil up, bubble.","syn":["exuberance","effervescence","exhilaration"],"pr":"i-BUL-yuns","tip":"Say i-BUL-yuns (as in bulk) or i-BUUL-yuns (as in bull) — not i-BYOOL-.","rel":["ebullient — overflowing with enthusiasm","ebullition — a boiling up; an outburst"],"src":[{"c":"va","n":23}]},{"id":"impervious","w":"impervious","pos":"adjective","d":"not allowing anything to pass through; not affected by","ex":"The jacket is impervious to rain. He seems impervious to criticism.","syn":["impenetrable","impermeable","resistant","immune"],"ant":["permeable","penetrable","susceptible"],"pr":"im-PUR-vee-us","src":[{"c":"va","n":23}]},{"id":"remonstrate","w":"remonstrate","pos":"verb","d":"to protest or object forcefully","ex":"She remonstrated with the manager about the unfair schedule.","syn":["protest","object","expostulate","reprove"],"pr":"ri-MAHN-strayt","tip":"Expostulate = plead earnestly to change someone's mind; remonstrate = protest in a calmer, reasoned way.","src":[{"c":"va","n":23}]},{"id":"efface","w":"efface","pos":"verb","d":"to erase or wipe out; to make oneself inconspicuous","ex":"Time had effaced the inscription on the stone.","syn":["erase","obliterate","expunge","blot out"],"pr":"i-FAYS","tip":"Don't confuse with deface, to spoil the appearance of.","rel":["self-effacing — modest, keeping oneself in the background"],"src":[{"c":"va","n":23}]},{"id":"chimera","w":"chimera","pos":"noun","d":"a fanciful, impossible idea; (myth) a monster with a lion's head, goat's body and serpent's tail","ex":"Total job security is a chimera.","syn":["fantasy","figment","pipe dream","illusion"],"pr":"ky-MEER-uh","rel":["chimerical — wildly fanciful, imaginary"],"src":[{"c":"va","n":23}]},{"id":"incorrigible","w":"incorrigible","pos":"adjective","d":"incapable of being corrected or reformed; unruly","ex":"He's an incorrigible practical joker.","ety":"in- (not) + corrigible (capable of being corrected).","syn":["hopeless","inveterate","irredeemable","incurable"],"pr":"in-KOR-i-juh-bul","src":[{"c":"va","n":23}]},{"id":"juxtapose","w":"juxtapose","pos":"verb","d":"to place side by side, especially for comparison or contrast","ex":"The exhibition juxtaposes old photos with new ones of the same streets.","ety":"Latin iuxta (next to) + ponere (to place) — also position.","pr":"JUK-stuh-pohz","rel":["juxtaposition — a side-by-side placement"],"src":[{"c":"va","n":23}]},{"id":"conversant","w":"conversant","pos":"adjective","d":"familiar with and knowledgeable about","ex":"She is conversant with several programming languages.","ety":"Latin conversari, to associate with — also converse and conversation.","pr":"kun-VUR-sunt","tip":"Conversant with (familiar through study); versed in (familiar through experience).","src":[{"c":"va","n":23}]},{"id":"auspicious","w":"auspicious","pos":"adjective","d":"favorable; promising success","ex":"The company made an auspicious start, selling out in a week.","ety":"Latin auspex, a Roman who foretold the future by watching birds (avis, bird + specere, to look). Under the auspices of = with the backing of.","syn":["promising","favorable","propitious","fortunate"],"pr":"aw-SPISH-us","tip":"Propitious stresses a favorable moment for acting; auspicious stresses a good omen.","src":[{"c":"va","n":23}]},{"id":"itinerant","w":"itinerant","pos":"adjective / noun","d":"traveling from place to place, especially for work","ex":"Itinerant farmworkers follow the harvest north.","syn":["wandering","migratory","nomadic","peripatetic"],"pr":"eye-TIN-ur-unt","rel":["itinerary — a planned route of travel"],"src":[{"c":"va","n":24}]},{"id":"cull","w":"cull","pos":"verb","d":"to select and gather from many sources; to remove inferior ones from a group","ex":"She culled the best quotes from hundreds of interviews.","ety":"Latin colligere, to gather — also collect.","pr":"KUL","rel":["glean — to gather bit by bit, as farm workers gathered grain left after the harvest"],"src":[{"c":"va","n":24}]},{"id":"promulgate","w":"promulgate","pos":"verb","d":"to announce officially; to make widely known","ex":"The ministry promulgated new safety rules.","syn":["proclaim","publicize","disseminate","bruit"],"pr":"PRAHM-ul-gayt or proh-MUL-gayt","tip":"Both pronunciations are standard: PRAHM-ul-gayt is now more common.","src":[{"c":"va","n":24}]},{"id":"nomenclature","w":"nomenclature","pos":"noun","d":"a system of names used in a science or field","ex":"Botanical nomenclature uses two Latin names for each plant.","ety":"Latin nomen (name) + calare (to call). A Roman nomenclator whispered voters' names to candidates.","pr":"NOH-mun-klay-chur","tip":"Linnaeus founded the two-name (binomial) system still used today.","src":[{"c":"va","n":24}]},{"id":"droll","w":"droll","pos":"adjective","d":"amusing in an odd, dry or whimsical way","ex":"He has a droll sense of humor.","syn":["wry","whimsical","comical","waggish"],"pr":"DROHL","rel":["drollery — quaint humor"],"src":[{"c":"va","n":24}]},{"id":"insatiable","w":"insatiable","pos":"adjective","d":"impossible to satisfy","ex":"She has an insatiable curiosity.","ety":"Latin satis, enough — also satisfy, satiate and satiety (fullness to excess).","syn":["unquenchable","voracious","ravenous","greedy"],"pr":"in-SAY-shuh-bul","src":[{"c":"va","n":24}]},{"id":"beguile","w":"beguile","pos":"verb","d":"to charm or captivate; also to deceive by trickery","ex":"The serpent beguiled Eve. Her stories beguiled the children for hours.","ety":"be- (thoroughly) + guile (crafty deceit). Be- also intensifies besmirch, befuddle and beware.","syn":["charm","enchant","captivate","deceive"],"pr":"bi-GYL","src":[{"c":"va","n":24}]},{"id":"vindictive","w":"vindictive","pos":"adjective","d":"having or showing a strong desire for revenge","ex":"His vindictive ex-partner tried to ruin his reputation.","ety":"Latin vindicta, vengeance (see vendetta).","syn":["vengeful","spiteful","retaliatory"],"pr":"vin-DIK-tiv","tip":"Vengeful wants payback in kind; vindictive is less rational, often retaliating for imagined wrongs.","rel":["retribution — punishment given in return for a wrong"],"src":[{"c":"va","n":24}]},{"id":"replete","w":"replete","pos":"adjective","d":"fully supplied; abundantly filled","ex":"The museum is replete with Renaissance art.","ety":"Latin replere, to fill again — plenus (full) gives plenty, plenitude and plenary (complete: a plenary session).","syn":["filled","brimming","abounding","teeming"],"pr":"ri-PLEET","tip":"Replete = full of something abundant; fraught = burdened with something heavy (fraught with danger). Replete doesn't mean complete.","src":[{"c":"va","n":24}]},{"id":"preclude","w":"preclude","pos":"verb","d":"to prevent from happening; to make impossible in advance","ex":"His injury precluded any chance of playing in the final.","ety":"Latin prae (before) + claudere (to shut): to shut the door beforehand.","syn":["prevent","rule out","forestall","obviate"],"pr":"pri-KLOOD","src":[{"c":"va","n":25}]},{"id":"colloquial","w":"colloquial","pos":"adjective","d":"informal; used in ordinary conversation rather than formal writing","ex":"'Gonna' is a colloquial form of 'going to'.","ety":"Latin colloquium, conversation (com- together + loqui to speak).","syn":["conversational","informal","vernacular","idiomatic"],"ant":["formal","literary"],"pr":"kuh-LOH-kwee-ul","tip":"(This track is blank on your drive; entry written from the standard meaning.)","rel":["colloquialism — an informal expression"],"src":[{"c":"va","n":25}]},{"id":"convivial","w":"convivial","pos":"adjective","d":"friendly, lively and fond of feasting and good company","ex":"The dinner had a convivial atmosphere.","ety":"Latin convivium, a feast (con- together + vivere to live).","syn":["sociable","jovial","genial","gregarious"],"ant":["aloof","reserved","unsociable"],"pr":"kun-VIV-ee-ul","src":[{"c":"va","n":25}]},{"id":"eschew","w":"eschew","pos":"verb","d":"to deliberately avoid or abstain from","ex":"She eschews social media.","syn":["avoid","shun","abstain from","forgo"],"pr":"es-CHOO","tip":"Nothing to do with chewing (that's masticate).","src":[{"c":"va","n":25}]},{"id":"prodigious","w":"prodigious","pos":"adjective","d":"remarkably great in size, extent or degree; amazing","ex":"He has a prodigious memory for faces.","ety":"Latin prodigium, an omen or marvel — also prodigy.","syn":["enormous","colossal","gargantuan","herculean","Brobdingnagian"],"ant":["Lilliputian","tiny"],"pr":"pruh-DIJ-us","rel":["gargantuan — from Rabelais's giant Gargantua","Brobdingnagian — from the giants in Gulliver's Travels"],"src":[{"c":"va","n":25}]},{"id":"approbation","w":"approbation","pos":"noun","d":"formal approval or praise","ex":"The plan won the approbation of the board.","syn":["approval","sanction","endorsement","commendation"],"ant":["disapprobation","censure","repudiation"],"pr":"ap-ruh-BAY-shun","tip":"More formal and dignified than approval: children seek approval; presidents seek the approbation of Congress.","src":[{"c":"va","n":25}]},{"id":"legerdemain","w":"legerdemain","pos":"noun","d":"sleight of hand; any clever trickery or deception","ex":"The accountant's financial legerdemain fooled auditors for years.","ety":"Middle French léger de main, light of hand.","syn":["sleight of hand","prestidigitation","trickery","thaumaturgy"],"pr":"lej-ur-duh-MAYN","tip":"No e at the end.","rel":["prestidigitation — nimble-fingered magic (Italian presto, quick + digit, finger)","thaumaturgy — the working of miracles"],"src":[{"c":"va","n":26}]},{"id":"complicity","w":"complicity","pos":"noun","d":"partnership or involvement in wrongdoing","ex":"He denied any complicity in the fraud.","ety":"Latin complicare, to fold together — also complicate and accomplice.","syn":["collusion","conspiracy","connivance"],"pr":"kum-PLIS-i-tee","tip":"Connivance is passive (looking the other way); complicity is active participation.","rel":["collusion — secret cooperation to cheat a third party","connive — strictly, to 'wink at' wrongdoing, pretending not to see it"],"src":[{"c":"va","n":26}]},{"id":"transmute","w":"transmute","pos":"verb","d":"to change completely in form, nature or substance, usually for the better","ex":"Alchemists tried to transmute lead into gold.","ety":"Latin trans (across) + mutare (to change).","syn":["transform","convert","metamorphose"],"pr":"trans-MYOOT","src":[{"c":"va","n":26}]},{"id":"edify","w":"edify","pos":"verb","d":"to instruct and improve morally or intellectually","ex":"The documentary both entertained and edified.","pr":"ED-i-fy","tip":"'For your edification' is a cliché and can sound condescending.","rel":["edification — enlightenment, improvement","edifying — instructive, uplifting"],"src":[{"c":"va","n":26}]},{"id":"sonorous","w":"sonorous","pos":"adjective","d":"deep, full and rich in sound","ex":"The actor's sonorous voice filled the theater.","syn":["resonant","rich","resounding","booming"],"pr":"suh-NOR-us","tip":"Traditional American: suh-NOR-us. SAHN-ur-us is British in origin.","src":[{"c":"va","n":27}]},{"id":"admonish","w":"admonish","pos":"verb","d":"to warn or reprove gently but earnestly","ex":"She admonished him to slow down before he burned out.","ety":"Latin admonere, to remind, warn.","syn":["caution","counsel","reprove","exhort"],"pr":"ad-MAHN-ish","rel":["admonishment, admonition — a gentle warning"],"src":[{"c":"va","n":27}]},{"id":"paradigm","w":"paradigm","pos":"noun","d":"a typical example, model or pattern","ex":"Her company became the paradigm for ethical sourcing.","syn":["model","pattern","exemplar","archetype"],"pr":"PAR-uh-dym or PAR-uh-dim","tip":"Both pronunciations are accepted.","rel":["paradigmatic — serving as a model"],"src":[{"c":"va","n":27}]},{"id":"circuitous","w":"circuitous","pos":"adjective","d":"roundabout; indirect","ex":"We took a circuitous route to avoid the traffic.","ety":"From circuit, a route that goes around and comes back.","syn":["indirect","meandering","tortuous","labyrinthine","serpentine"],"pr":"sur-KYOO-i-tus","src":[{"c":"va","n":27}]},{"id":"vindicate","w":"vindicate","pos":"verb","d":"to clear of blame or suspicion by proving it unjustified; to justify","ex":"The new evidence vindicated her.","pr":"VIN-di-kayt","tip":"Acquit = released by a court; exonerate = freed from the burden of guilt; vindicate = shown to have been wrongly accused.","rel":["vindication — being proved right or blameless"],"src":[{"c":"va","n":27}]},{"id":"ostracize","w":"ostracize","pos":"verb","d":"to exclude from a group or society","ex":"After the scandal, his colleagues ostracized him.","ety":"Ancient Athenians voted to banish a citizen by writing his name on a potsherd (ostrakon). In Syracuse they used olive leaves — petalism.","syn":["shun","exclude","banish","blackball"],"pr":"AHS-truh-syz","rel":["ostracism — exclusion"],"src":[{"c":"va","n":27}]},{"id":"plethora","w":"plethora","pos":"noun","d":"an excess; an overabundance","ex":"The report contains a plethora of dull statistics.","ety":"Greek plethein, to be full.","syn":["surplus","glut","surfeit","profusion"],"ant":["dearth","paucity","scarcity"],"pr":"PLETH-ur-uh","tip":"Stress the first syllable: PLETH-ur-uh, not pluh-THOR-uh.","rel":["plethoric — overabundant; bombastic, turgid (of language)"],"src":[{"c":"va","n":27}]},{"id":"proclivity","w":"proclivity","pos":"noun","d":"a natural tendency, usually toward something bad","ex":"He has a proclivity for exaggeration.","ety":"Latin, a sloping forward.","syn":["propensity","predisposition","penchant","predilection"],"pr":"proh-KLIV-i-tee","tip":"Propensity is usually neutral; proclivity usually leans toward the objectionable.","src":[{"c":"va","n":27}]},{"id":"commensurate","w":"commensurate","pos":"adjective","d":"corresponding in size, amount or degree; proportionate","ex":"She wants a salary commensurate with her experience.","ety":"Latin, measured together.","syn":["proportionate","corresponding","equivalent"],"pr":"kuh-MEN-shur-it","src":[{"c":"va","n":28}]},{"id":"incessant","w":"incessant","pos":"adjective","d":"continuing without pause; unceasing","ex":"The incessant barking kept us awake.","ety":"in- (not) + Latin cessare (to cease).","syn":["constant","unremitting","interminable","relentless"],"ant":["intermittent","sporadic","occasional"],"pr":"in-SES-unt","tip":"Continual = again and again with breaks (the continual ringing of the phone); continuous = without a break (continuous rain). Continuous is passive; incessant is active and often irritating.","src":[{"c":"va","n":28}]},{"id":"tangential","w":"tangential","pos":"adjective","d":"only slightly related; digressing from the main subject","ex":"His comments were tangential to the debate.","ety":"From tangent, a line that touches a curve without crossing it; to go off on a tangent.","syn":["peripheral","digressive","incidental"],"pr":"tan-JEN-shul","src":[{"c":"va","n":28}]},{"id":"tenable","w":"tenable","pos":"adjective","d":"able to be defended or upheld","ex":"Her argument is no longer tenable in light of the new data.","ety":"Latin tenere, to hold — also tenacious.","ant":["untenable","indefensible"],"pr":"TEN-uh-bul","src":[{"c":"va","n":28}]},{"id":"impalpable","w":"impalpable","pos":"adjective","d":"unable to be felt by touch; hard to grasp with the mind","ex":"An impalpable sense of dread hung over the house.","ety":"im- (not) + palpable (Latin palpare, to touch gently). Doctors palpate, examine by touch.","syn":["intangible","imperceptible","elusive"],"ant":["palpable","tangible"],"pr":"im-PAL-puh-bul","src":[{"c":"va","n":28}]},{"id":"odious","w":"odious","pos":"adjective","d":"hateful; deserving or causing strong dislike","ex":"He had the odious habit of taking credit for others' work.","ety":"Latin odium, hatred — English odium means hatred or disgrace incurred.","syn":["hateful","detestable","repugnant","abhorrent","execrable"],"pr":"OH-dee-us","tip":"Don't confuse with odorous, having a smell. Garbage may be both; roses are only odorous.","src":[{"c":"va","n":28}]},{"id":"ubiquitous","w":"ubiquitous","pos":"adjective","d":"seeming to be everywhere at once","ex":"Smartphones are now ubiquitous.","ety":"Latin ubique, everywhere.","syn":["omnipresent","pervasive","universal"],"pr":"yoo-BIK-wi-tus","rel":["ubiquity — being everywhere"],"src":[{"c":"va","n":28}]},{"id":"ruminate","w":"ruminate","pos":"verb","d":"to think deeply and at length; to mull over","ex":"She ruminated on the offer all weekend.","ety":"Latin ruminare, to chew the cud. Ruminants (cows, sheep, camels) re-chew food from the first stomach, the rumen.","syn":["ponder","mull","contemplate","cogitate"],"pr":"ROO-muh-nayt","src":[{"c":"va","n":28}]},{"id":"remuneration","w":"remuneration","pos":"noun","d":"payment for work or services","ex":"The remuneration barely covered his expenses.","syn":["compensation","pay","recompense","emolument"],"pr":"ri-myoo-nuh-RAY-shun","tip":"Note the order: re-mu-ner-, not 're-nu-mer-' (it isn't related to numbers).","rel":["remunerate — to pay for services"],"src":[{"c":"va","n":28}]},{"id":"peccadillo","w":"peccadillo","pos":"noun","d":"a small, easily forgiven sin or fault","ex":"Arriving five minutes late is a peccadillo, not a crime.","ety":"Spanish, from Latin peccare, to sin (see impeccable).","syn":["foible","failing","frailty","indiscretion"],"pr":"pek-uh-DIL-oh","tip":"Failing = noticeable shortcoming; frailty = weakness that yields to temptation; foible = harmless quirk; peccadillo = small offense. Plural: peccadilloes or peccadillos.","src":[{"c":"va","n":29}]},{"id":"supine","w":"supine","pos":"adjective","d":"lying on the back, face up; also passive and inactive","ex":"The patient lay supine on the table.","ant":["prone (face down)"],"pr":"soo-PYN","tip":"Don't confuse prostrate with prostate, the gland.","rel":["prostrate — lying flat, often from exhaustion or submission","recumbent — lying back comfortably"],"src":[{"c":"va","n":29}]},{"id":"heterodox","w":"heterodox","pos":"adjective","d":"holding opinions that differ from accepted beliefs","ex":"His heterodox views on economics annoyed his colleagues.","ety":"Greek hetero- (other) + doxa (opinion). Ortho- means right or correct: orthodox, orthodontics, orthography (correct spelling), orthoepy (correct pronunciation).","ant":["orthodox"],"pr":"HET-ur-uh-dahks","tip":"Heterodox differs harmlessly; heretical differs in a way seen as dangerous.","rel":["heterodoxy — unorthodox belief"],"src":[{"c":"va","n":29}]},{"id":"grandiloquent","w":"grandiloquent","pos":"adjective","d":"using pompous, lofty language","ex":"The mayor's grandiloquent speech said very little.","ety":"Latin grandis + loqui (to speak). Relatives: magniloquent (pompous), breviloquent (brief), suaviloquent (smooth), somniloquent (talking in one's sleep).","syn":["bombastic","grandiose","florid","turgid"],"ant":["plainspoken","forthright"],"pr":"gran-DIL-uh-kwunt","src":[{"c":"va","n":29}]},{"id":"lugubrious","w":"lugubrious","pos":"adjective","d":"mournful, often exaggeratedly or comically so","ex":"The basset hound gave a lugubrious howl.","ety":"Latin lugere, to mourn.","syn":["doleful","dolorous","funereal","melancholy"],"ant":["jovial","cheerful","sanguine"],"pr":"luh-GOO-bree-us","src":[{"c":"va","n":29}]},{"id":"infinitesimal","w":"infinitesimal","pos":"adjective","d":"too small to be measured","ex":"The chance of winning is infinitesimal.","syn":["minuscule","minute","microscopic"],"pr":"in-fin-i-TES-uh-mul","tip":"Strictly, too small to measure at all. Also: minuscule is spelled like minus + cule (not 'miniscule').","src":[{"c":"va","n":29}]},{"id":"goad","w":"goad","pos":"verb / noun","d":"to provoke or urge someone into action; a pointed stick for driving cattle","ex":"His friends goaded him into jumping.","syn":["spur","prod","incite","egg on","instigate"],"ant":["pacify","mollify","assuage"],"pr":"GOHD","src":[{"c":"va","n":29}]},{"id":"aver","w":"aver","pos":"verb","d":"to state positively and confidently","ex":"She averred that she had never seen the man.","syn":["assert","affirm","declare","asseverate"],"pr":"uh-VUR","tip":"State = express formally; declare = state publicly; assert = state boldly; asseverate = state solemnly; aver = state with complete confidence.","src":[{"c":"va","n":29}]},{"id":"cacophony","w":"cacophony","pos":"noun","d":"a harsh, discordant mixture of sounds","ex":"A cacophony of car horns filled the street.","ety":"Greek kakos (bad) + phone (sound). Caco- also gives cacography (bad writing), cacology (bad word choice), cacoepy (bad pronunciation) and cacoethes (an incurable itch or bad habit).","syn":["discord","dissonance","din","racket"],"ant":["harmony","euphony"],"pr":"kuh-KAHF-uh-nee","rel":["cacophonous — harsh-sounding"],"src":[{"c":"va","n":30}]},{"id":"refractory","w":"refractory","pos":"adjective","d":"stubbornly disobedient; resistant to control, heat or treatment","ex":"A refractory mule. A refractory case of eczema.","syn":["unruly","recalcitrant","intransigent","contumacious","obstinate"],"ant":["docile","compliant","tractable"],"pr":"ri-FRAK-tuh-ree","rel":["recalcitrant — 'kicking back' (Latin calcitrare, to kick) against authority","intransigent — refusing to compromise","contumacious — insolently defiant of authority"],"src":[{"c":"va","n":30}]},{"id":"iconoclast","w":"iconoclast","pos":"noun","d":"a person who attacks cherished beliefs or institutions","ex":"An iconoclast in the art world, she mocked every sacred cow.","ety":"Greek, an image breaker — originally someone who smashed religious images.","syn":["rebel","radical","heretic","maverick"],"pr":"eye-KAHN-uh-klast","rel":["iconoclastic — attacking established beliefs"],"src":[{"c":"va","n":30}]},{"id":"enervate","w":"enervate","pos":"verb","d":"to weaken; to drain of energy","ex":"The heat enervated the runners.","syn":["exhaust","sap","debilitate","devitalize"],"ant":["energize","invigorate","fortify"],"pr":"EN-ur-vayt","tip":"Despite the sound, it means the opposite of energize. A classic word to look up rather than guess from context.","src":[{"c":"va","n":30}]},{"id":"levity","w":"levity","pos":"noun","d":"lightness of manner, especially when out of place","ex":"This is no time for levity.","ety":"Latin levis, light — also levitate.","syn":["frivolity","flippancy","jocularity","tomfoolery"],"ant":["gravity","solemnity","seriousness"],"pr":"LEV-i-tee","src":[{"c":"va","n":30}]},{"id":"equanimity","w":"equanimity","pos":"noun","d":"calmness and evenness of temper, especially under stress","ex":"She accepted the news with equanimity.","ety":"Latin aequus (even) + animus (mind).","syn":["composure","serenity","poise","sangfroid","imperturbability"],"pr":"ee-kwuh-NIM-i-tee","tip":"Composure implies self-control in a crisis; equanimity is an inner balance that holds in all circumstances.","src":[{"c":"va","n":30}]},{"id":"stricture","w":"stricture","pos":"noun","d":"a severe criticism; also a restriction, or a narrowing of a body passage","ex":"He ignored the critic's strictures.","ety":"Latin stringere, to draw tight — also strict and stringent.","ant":["praise","commendation","plaudit"],"pr":"STRIK-chur","tip":"It's a noun only: you can express strictures but you can't 'stricture' something.","src":[{"c":"va","n":30}]},{"id":"opulent","w":"opulent","pos":"adjective","d":"very wealthy; luxurious and showy","ex":"They lived in an opulent mansion.","ety":"Latin opulentus, rich, linked to Ops, Roman goddess of the harvest.","syn":["wealthy","affluent","sumptuous","lavish"],"ant":["indigent","impecunious","destitute"],"pr":"AHP-yuh-lunt","tip":"Prosperous = thriving; affluent = with a free flow of money; opulent = displaying great wealth.","src":[{"c":"va","n":30}]},{"id":"disparage","w":"disparage","pos":"verb","d":"to belittle; to speak of as inferior","ex":"Don't disparage your rivals in public.","ety":"Old French, to marry beneath one's rank (Latin par, equal — as in peer and on a par).","syn":["belittle","denigrate","deprecate","malign","vilify"],"ant":["praise","extol"],"pr":"di-SPAR-ij","rel":["disparaging — belittling"],"src":[{"c":"va","n":30}]},{"id":"anomalous","w":"anomalous","pos":"adjective","d":"deviating from what is normal or expected; irregular","ex":"This year's sales figures are anomalous.","ety":"Greek, not the same.","syn":["irregular","abnormal","aberrant","atypical"],"pr":"uh-NAHM-uh-lus","rel":["anomaly — something that deviates from the norm"],"src":[{"c":"va","n":31}]},{"id":"truncate","w":"truncate","pos":"verb","d":"to shorten by cutting off a part, often severely","ex":"The editor truncated the article to half its length.","ety":"Latin truncare, to maim; truncus, a tree trunk with the branches lopped off.","syn":["curtail","abridge","abbreviate","shorten"],"ant":["lengthen","prolong","protract"],"pr":"TRUNG-kayt","src":[{"c":"va","n":31}]},{"id":"abstemious","w":"abstemious","pos":"adjective","d":"moderate in eating and drinking; self-denying","ex":"An abstemious eater, she skipped dessert every night.","ety":"Latin abstemius, abstaining from wine.","syn":["temperate","sober","ascetic","frugal"],"ant":["gluttonous","self-indulgent"],"pr":"ab-STEE-mee-us","rel":["ascetic — rigorously self-denying"],"src":[{"c":"va","n":31}]},{"id":"ethereal","w":"ethereal","pos":"adjective","d":"extremely light, delicate and heavenly","ex":"The choir's ethereal voices filled the cathedral.","ety":"From ether, the airy element the ancients believed filled the heavens.","syn":["celestial","delicate","airy","sublime","rarefied"],"ant":["mundane","terrestrial","earthly"],"pr":"i-THEER-ee-ul","src":[{"c":"va","n":31}]},{"id":"bombastic","w":"bombastic","pos":"adjective","d":"pompous and inflated in language, with little substance","ex":"His bombastic speech promised everything and explained nothing.","ety":"Bombast was once cotton padding for clothes — now verbal padding.","syn":["grandiloquent","turgid","pompous","pretentious"],"pr":"bahm-BAS-tik","tip":"Turgid (swollen) obscures meaning; grandiloquent strains for eloquence; bombastic hides emptiness behind pomp.","src":[{"c":"va","n":31}]},{"id":"senescent","w":"senescent","pos":"adjective","d":"growing old; declining with age","ex":"The town's senescent industries were closing one by one.","ety":"Latin senex, old — also senile and senate (a council of elders).","ant":["juvenescent (growing young)"],"pr":"si-NES-unt","rel":["senescence — the process of aging"],"src":[{"c":"va","n":31}]},{"id":"catholic","w":"catholic","pos":"adjective","d":"universal; broad-minded and wide-ranging in interests or tastes","ex":"She has catholic taste in music, from opera to hip-hop.","ety":"Greek katholikos, universal. Lowercase catholic has nothing to do with religion.","syn":["eclectic","wide-ranging","liberal","latitudinarian"],"ant":["parochial","narrow-minded","bigoted"],"pr":"KATH-uh-lik","rel":["ecumenical — universal, especially promoting unity among churches"],"src":[{"c":"va","n":32}]},{"id":"objurgation","w":"objurgation","pos":"noun","d":"a harsh rebuke; a vehement scolding","ex":"He endured his father's objurgation in silence.","ety":"Latin ob (against) + iurgare (to scold).","syn":["reproof","vituperation","tirade","tongue-lashing"],"pr":"ahb-jur-GAY-shun","rel":["objurgate — to scold sharply"],"src":[{"c":"va","n":32}]},{"id":"vicissitude","w":"vicissitude","pos":"noun","d":"a change of circumstances, usually unwelcome; the ups and downs","ex":"The company survived the vicissitudes of twenty turbulent years.","syn":["change","fluctuation","variation","ups and downs"],"pr":"vi-SIS-i-tood","tip":"Usually plural.","src":[{"c":"va","n":32}]},{"id":"contentious","w":"contentious","pos":"adjective","d":"quarrelsome; likely to provoke argument","ex":"Immigration is a contentious issue.","ety":"Latin contendere, to strive against — also contend and contention.","syn":["argumentative","combative","disputatious","litigious"],"ant":["amicable","peaceable","conciliatory"],"pr":"kun-TEN-shus","rel":["bellicose — warlike by nature","belligerent — waging or provoking a fight","litigious — quick to sue"],"src":[{"c":"va","n":32}]},{"id":"obeisance","w":"obeisance","pos":"noun","d":"a gesture or attitude of deep respect, like a bow","ex":"The courtiers made obeisance to the queen.","ety":"French, obedience.","syn":["homage","deference","reverence","genuflection"],"pr":"oh-BAY-suns","src":[{"c":"va","n":32}]},{"id":"assiduous","w":"assiduous","pos":"adjective","d":"diligent, persistent and careful","ex":"Her assiduous research turned up the missing letters.","ety":"Latin assiduus, sitting down to a task (sedere, to sit — also sedentary).","syn":["diligent","sedulous","industrious","indefatigable"],"ant":["indolent","lazy","otiose"],"pr":"uh-SIJ-oo-us","src":[{"c":"va","n":32}]},{"id":"duplicity","w":"duplicity","pos":"noun","d":"deceitful double-dealing","ex":"The spy's duplicity went undetected for years.","ety":"Latin duplex, double: doubleness of heart or speech.","syn":["deceit","guile","chicanery","mendacity"],"pr":"doo-PLIS-i-tee","rel":["duplicitous — two-faced"],"src":[{"c":"va","n":32}]},{"id":"myrmidon","w":"myrmidon","pos":"noun","d":"a loyal follower who carries out orders without question or scruple","ex":"The dictator's myrmidons rounded up his critics.","ety":"The Myrmidons were the fierce warriors who followed Achilles to Troy.","syn":["minion","henchman","lackey","hireling"],"pr":"MUR-mi-dahn (also MUR-mi-dun)","tip":"Lowercase myrmidon is the general word; capital M means Achilles' troops.","src":[{"c":"va","n":33}]},{"id":"accede","w":"accede","pos":"verb","d":"to give in or agree to, often under pressure; to take office","ex":"The union refused to accede to the company's demands.","ety":"Latin accedere, to come near.","syn":["consent","yield","comply","acquiesce"],"ant":["resist","protest","oppose","cavil"],"pr":"ak-SEED","tip":"Consent is voluntary; concur is independent agreement; assent follows deliberation; acquiesce hides reluctance; accede gives in to pressure. Also: accede to the throne.","src":[{"c":"va","n":33}]},{"id":"nonage","w":"nonage","pos":"noun","d":"youth or immaturity; legally, the period of being a minor","ex":"In his nonage he could not sign a contract.","ety":"Anglo-French non + age: not of age.","syn":["minority","youth","immaturity","juvenility"],"ant":["majority","maturity"],"pr":"NAHN-ij (also NOH-nij)","src":[{"c":"va","n":33}]},{"id":"machination","w":"machination","pos":"noun","d":"a crafty scheme or plot with a sinister purpose","ex":"When his machinations were exposed, he was demoted to the mail room.","ety":"Latin machinari, to contrive; machina, device — also machine and deus ex machina.","syn":["scheme","stratagem","intrigue","ruse","cabal"],"pr":"mak-uh-NAY-shun","tip":"Usually plural. Say mak-, not mash-: the ch is a K.","src":[{"c":"va","n":33}]},{"id":"docile","w":"docile","pos":"adjective","d":"easy to teach or manage; submissive","ex":"The docile pony let the children ride all afternoon.","ety":"Latin docilis, teachable; docere, to teach — also docent and doctrine.","syn":["compliant","tractable","amenable","malleable"],"ant":["obstinate","intractable","refractory","headstrong"],"pr":"DAHS-ul (British DOH-syl)","rel":["docility — submissiveness","docent — a guide who lectures in a museum ('docent guide' is redundant)"],"src":[{"c":"va","n":33}]},{"id":"redoubtable","w":"redoubtable","pos":"adjective","d":"formidable; arousing fear and respect","ex":"Small airlines faced redoubtable competition from the big carriers.","ety":"Old French redouter, to dread; Latin dubitare, to doubt — also dubious.","syn":["formidable","fearsome","awe-inspiring","daunting"],"pr":"ri-DOWT-uh-bul","tip":"Sometimes used humorously: 'the redoubtable Aunt Edna'.","src":[{"c":"va","n":33}]},{"id":"prognosticate","w":"prognosticate","pos":"verb","d":"to predict, especially from signs or present indications","ex":"Pundits prognosticate the outcome of every election.","ety":"Greek prognosis, knowing beforehand.","syn":["predict","forecast","foretell","presage","vaticinate"],"pr":"prahg-NAHS-ti-kayt","rel":["prognosis — the predicted course of a disease","diagnosis — identifying what the disease is","prognostication — a prediction"],"src":[{"c":"va","n":33}]},{"id":"engender","w":"engender","pos":"verb","d":"to bring about; give rise to","ex":"An exchange of invective between nations can engender war.","ety":"Latin generare, to beget — originally meant to procreate.","syn":["produce","generate","cause","spawn","foster"],"ant":["prevent","suppress","quash"],"pr":"en-JEN-dur","src":[{"c":"va","n":34}]},{"id":"fetid","w":"fetid","pos":"adjective","d":"stinking; foul-smelling, as of rot or decay","ex":"A fetid odor rose from the swamp.","ety":"Latin fetere, to stink.","syn":["malodorous","rank","putrid","noisome","mephitic"],"ant":["fragrant","aromatic","redolent"],"pr":"FET-id","tip":"Stronger than malodorous. The British spelling is foetid (FEE-tid); Americans say FET-id.","src":[{"c":"va","n":34}]},{"id":"capitulate","w":"capitulate","pos":"verb","d":"to surrender, especially on agreed terms","ex":"After a month of siege, the garrison capitulated.","ety":"Latin caput, head: to draw up terms under headings — compare decapitate.","syn":["surrender","yield","submit","succumb"],"ant":["resist","hold out","defy"],"pr":"kuh-PICH-uh-layt","rel":["capitulation — surrender on terms"],"src":[{"c":"va","n":34}]},{"id":"exponent","w":"exponent","pos":"noun","d":"a person who represents, advocates or explains an idea","ex":"Carrie Nation was a fierce exponent of temperance.","ety":"Latin exponere, to put forth — also expound.","syn":["advocate","champion","proponent","spokesperson","interpreter"],"pr":"ek-SPOH-nunt","rel":["expound — to explain point by point"],"src":[{"c":"va","n":34}]},{"id":"mendacious","w":"mendacious","pos":"adjective","d":"lying; untruthful","ex":"The mendacious salesman swore the car had never been in an accident.","ety":"Latin mendax, lying.","syn":["dishonest","deceitful","untruthful","disingenuous","prevaricating"],"ant":["truthful","veracious","honest","scrupulous"],"pr":"men-DAY-shus","tip":"Don't confuse with mendicant, a beggar.","rel":["mendacity — lying, untruthfulness"],"src":[{"c":"va","n":34}]},{"id":"strident","w":"strident","pos":"adjective","d":"loud, harsh and grating; shrill","ex":"Her strident voice cut through the noise of the market.","ety":"Latin stridere, to make a harsh noise — also stridor and stridulate (to chirp, as crickets do).","syn":["shrill","grating","raucous","vociferous","stentorian"],"ant":["soft","melodious","dulcet","euphonious"],"pr":"STRY-dunt","src":[{"c":"va","n":34}]},{"id":"oligarchy","w":"oligarchy","pos":"noun","d":"government by a few powerful people","ex":"A small oligarchy of landowners ran the island.","ety":"Greek oligos (few) + archein (to rule).","syn":["junta","cabal","ruling clique"],"pr":"AHL-i-gahr-kee","tip":"Say AHL-, as in olive, not OH-.","rel":["oligarch — one of the ruling few","oligarchic — adjective"],"src":[{"c":"va","n":34}]},{"id":"refulgent","w":"refulgent","pos":"adjective","d":"shining brightly; radiant","ex":"She gave him a refulgent smile.","ety":"Latin re- (back) + fulgere (to shine).","syn":["radiant","resplendent","luminous","incandescent","coruscating"],"ant":["dim","murky","tenebrous","crepuscular"],"pr":"ri-FUL-junt","rel":["refulgence — brilliance","scintillating — sparkling","coruscating — flashing, glittering"],"src":[{"c":"va","n":34}]},{"id":"nepotism","w":"nepotism","pos":"noun","d":"favoritism shown to relatives, especially in jobs","ex":"Promoting his niece to office manager was flagrant nepotism.","ety":"Italian nepote, nephew; Latin nepos — coined for popes who enriched their 'nephews'.","syn":["favoritism","patronage","partiality"],"pr":"NEP-uh-tiz-um","rel":["nepotistic — adjective"],"src":[{"c":"va","n":35}]},{"id":"ribald","w":"ribald","pos":"adjective","d":"humorous in a coarse, mildly indecent way","ex":"The sailors sang ribald songs below deck.","ety":"Old French ribauld, a wanton person.","syn":["bawdy","risqué","racy","earthy","off-color"],"ant":["decorous","refined","prim","urbane"],"pr":"RIB-uld (rhymes with scribbled)","tip":"Say RIB-uld, not RY-bawld. Obscene is strongly offensive; ribald is only mildly indecent and funny.","rel":["ribaldry — coarse humor"],"src":[{"c":"va","n":35}]},{"id":"supplicate","w":"supplicate","pos":"verb","d":"to beg humbly and earnestly","ex":"The prisoners supplicated the king for mercy.","ety":"Latin supplicare, to kneel; supplex, on bended knee — also supple.","syn":["entreat","beseech","implore","importune","petition"],"pr":"SUP-li-kayt","rel":["supplication — a humble request","suppliant / supplicant — one who begs"],"src":[{"c":"va","n":35}]},{"id":"inexorable","w":"inexorable","pos":"adjective","d":"relentless; impossible to stop or move by pleading","ex":"Joe pleaded for an extra day off, but his manager was inexorable.","ety":"Latin inexorabilis, not moved by entreaty.","syn":["relentless","unyielding","implacable","obdurate","intransigent"],"ant":["flexible","yielding","tractable","complaisant"],"pr":"in-EK-sur-uh-bul","tip":"Stress the second syllable: in-EK-sur-uh-bul. Implacable applies to feelings that can't be appeased.","src":[{"c":"va","n":35}]},{"id":"parvenu","w":"parvenu","pos":"noun","d":"an upstart who has suddenly gained wealth or power but isn't accepted by the class he joined","ex":"The old families snubbed the parvenu and his gold-plated yacht.","ety":"French parvenir, to arrive or succeed: one newly arrived.","syn":["upstart","nouveau riche","arriviste","social climber"],"pr":"PAHR-vuh-noo","tip":"Almost always disparaging.","src":[{"c":"va","n":35}]},{"id":"hyperbole","w":"hyperbole","pos":"noun","d":"obvious, deliberate exaggeration for emphasis","ex":"'I've told you a million times' is hyperbole.","ety":"Greek hyperbole, a throwing beyond; overshooting the mark.","syn":["exaggeration","overstatement","embellishment"],"ant":["understatement","litotes"],"pr":"hy-PUR-buh-lee","tip":"Say hy-PUR-buh-lee. There is no 'hyper bowl'.","rel":["hyperbolic — exaggerated"],"src":[{"c":"va","n":35}]},{"id":"sanctimonious","w":"sanctimonious","pos":"adjective","d":"making a hypocritical show of piety or moral superiority","ex":"His sanctimonious l noun","d":"a cave dweller; a primitive, brutish or reclusive person","ex":"His coworkers were troglodytes who had never opened a novel.","ety":"Greek, one who creeps into holes.","syn":["cave dweller","recluse","Neanderthal","philistine"],"pr":"TRAHG-luh-dyt","rel":["troglodytic — adjective","anchorite / eremite — a hermit"],"src":[{"c":"va","n":46}]},{"id":"aleatory","w":"aleatory","pos":"adjective","d":"depending on chance or luck","ex":"Day trading is an aleatory business.","ety":"Latin aleator, a dice player; alea, a game of dice.","syn":["chancy","random","uncertain","fortuitous","risky"],"pr":"AY-lee-uh-tor-ee","tip":"In law, an aleatory contract depends on an uncertain event; aleatory music leaves some sounds to chance.","src":[{"c":"va","n":46}]},{"id":"farrago","w":"farrago","pos":"noun","d":"a confused mixture; a jumble","ex":"His speech was a farrago of half-truths and clichés.","ety":"Latin farrago, mixed fodder for cattle.","syn":["hodgepodge","mishmash","medley","potpourri","salmagundi"],"pr":"fuh-RAH-goh (also -RAY-)","rel":["farraginous — jumbled"],"src":[{"c":"va","n":46}]},{"id":"cynosure","w":"cynosure","pos":"noun","d":"the center of attention or admiration","ex":"The bride was the cynosure of every eye.","ety":"Greek kynosoura, dog's tail — the Little Dipper, whose tip is the North Star, a sailor's guide.","syn":["focal point","center of attention","magnet"],"pr":"SY-nuh-shoor (also SIN-)","rel":["cynic — from Greek kynikos, doglike (Diogenes and the Cynics)"],"src":[{"c":"va","n":46}]},{"id":"hieratic","w":"hieratic","pos":"adjective","d":"priestly; used by priests; sacred","ex":"The priests performed hieratic rites in the temple.","ety":"Greek hieros, sacred — also hierarchy and hieroglyphic.","syn":["sacerdotal","ecclesiastical","clerical","sacred"],"ant":["demotic","secular","lay"],"pr":"hy-uh-RAT-ik","rel":["hierarchy — originally rule by priests","demotic — of the common people (also an Egyptian script)"],"src":[{"c":"va","n":47}]},{"id":"vitiate","w":"vitiate","pos":"verb","d":"to spoil or impair; corrupt morally; make legally invalid","ex":"One false entry vitiated the whole contract.","ety":"Latin vitium, fault, vice.","syn":["impair","corrupt","debase","contaminate","invalidate"],"pr":"VISH-ee-ayt","rel":["vitiation — corruption"],"src":[{"c":"va","n":47}]},{"id":"risible","w":"risible","pos":"adjective","d":"laughable; provoking laughter","ex":"His risible excuse fooled no one.","ety":"Latin ridere, to laugh — also ridicule and ridiculous.","syn":["laughable","ludicrous","droll","comical","absurd"],"pr":"RIZ-uh-bul","src":[{"c":"va","n":47}]},{"id":"lionize","w":"lionize","pos":"verb","d":"to treat as a celebrity","ex":"Hollywood lionized the young director after her first hit.","ety":"From lion, a famous or fascinating person: a literary lion.","syn":["celebrate","idolize","fete","glorify"],"ant":["vilify","disparage","ignore"],"pr":"LY-uh-nyz","src":[{"c":"va","n":47}]},{"id":"contretemps","w":"contretemps","pos":"noun","d":"an awkward, embarrassing mishap","ex":"There was a contretemps when the speaker's slides wouldn't load.","ety":"French, against the time — originally a badly timed thrust in fencing.","syn":["mishap","hitch","faux pas","snag","embarrassment"],"pr":"KAHN-truh-tahn","tip":"The plural is spelled the same but said -tahnz. Smaller than a scandal or crisis.","src":[{"c":"va","n":47}]},{"id":"rodomontade","w":"rodomontade","pos":"noun","d":"boastful, blustering talk","ex":"Behind the rodomontade, the general had no plan.","ety":"From Rodomonte, a boastful king in Italian Renaissance epics.","syn":["bluster","braggadocio","bombast","bravado","gasconade"],"pr":"rahd-uh-mahn-TAYD","tip":"(This track is blank on your drive; entry written from the standard meaning.)","src":[{"c":"va","n":47}]},{"id":"hebetude","w":"hebetude","pos":"noun","d":"mental dullness; lethargy","ex":"The long meeting left everyone in a state of hebetude.","ety":"Latin hebes, blunt, dull.","syn":["dullness","ob
